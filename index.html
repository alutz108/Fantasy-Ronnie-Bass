// All the math lives here (no HTML), so it's easy to test and to extend with new stats.
// Input is the object from data/history.json.

const pct = (w, l, t) => {
  const g = w + l + t;
  return g ? (w + t / 2) / g : 0;
};

function prepare(data) {
  const managers = new Map(data.managers.map((m) => [m.id, m.name]));
  const seasons = [...data.seasons].sort((a, b) => a.year - b.year);
  return { data, seasons, managers, name: (id) => managers.get(id) ?? "Unclaimed" };
}

// Flat list of games, oldest first. Consolation games are left out unless asked for.
function games(ctx, withConsolation = false) {
  const out = [];
  for (const s of ctx.seasons) {
    const teamName = new Map(s.teams.map((t) => [t.teamId, t.name]));
    for (const g of s.matchups) {
      if (!withConsolation && g.type === "consolation") continue;
      out.push({
        year: s.year, week: g.week, type: g.type,
        a: { m: g.home.managerId, team: teamName.get(g.home.teamId), score: g.home.score },
        b: { m: g.away.managerId, team: teamName.get(g.away.teamId), score: g.away.score },
      });
    }
  }
  return out.sort((x, y) => x.year - y.year || x.week - y.week);
}

function champions(ctx) {
  return [...ctx.seasons].reverse().map((s) => {
    const champ = s.teams.find((t) => t.teamId === s.championTeamId);
    const runner = s.teams.find((t) => t.finalRank === 2);
    const who = (t) => t && { team: t.name, manager: ctx.name(t.managerId) };
    return { year: s.year, platform: s.platform, legacy: !!s.legacy, champion: who(champ), runnerUp: who(runner) };
  });
}

function seasonYears(ctx) {
  return ctx.seasons.filter((s) => !s.legacy).map((s) => s.year).reverse();   // legacy seasons have a champion but no standings
}

function standings(ctx, year) {
  const s = ctx.seasons.find((x) => x.year === year);
  if (!s) return [];
  return [...s.teams]
    .sort((a, b) => b.wins - a.wins || a.losses - b.losses || b.pf - a.pf)
    .map((t, i) => ({ ...t, rank: i + 1, manager: ctx.name(t.managerId), champion: t.teamId === s.championTeamId }));
}

function allTime(ctx) {
  const rows = new Map();
  const row = (id) => {
    if (!rows.has(id)) rows.set(id, { managerId: id, name: ctx.name(id), seasons: 0, w: 0, l: 0, t: 0, pf: 0, pa: 0, titles: [], runnerUps: [], playoffs: 0 });
    return rows.get(id);
  };
  for (const s of ctx.seasons) {
    const madePlayoffs = new Set();
    for (const g of s.matchups) {
      if (g.type !== "playoff") continue;
      if (g.home.managerId) madePlayoffs.add(g.home.managerId);
      if (g.away.managerId) madePlayoffs.add(g.away.managerId);
    }
    for (const t of s.teams) {
      if (!t.managerId) continue;
      const r = row(t.managerId);
      if (!s.legacy) { r.seasons++; r.w += t.wins ?? 0; r.l += t.losses ?? 0; r.t += t.ties ?? 0; r.pf += t.pf ?? 0; r.pa += t.pa ?? 0; }   // legacy seasons only give a title
      if (t.teamId === s.championTeamId) r.titles.push(s.year);
      if (t.finalRank === 2) r.runnerUps.push(s.year);
    }
    for (const id of madePlayoffs) row(id).playoffs++;
  }
  return [...rows.values()]
    .map((r) => ({ ...r, pct: pct(r.w, r.l, r.t) }))
    .sort((a, b) => b.titles.length - a.titles.length || b.pct - a.pct);
}

function headToHead(ctx) {
  const all = games(ctx);
  const ids = [...new Set(all.flatMap((g) => [g.a.m, g.b.m]).filter(Boolean))]
    .sort((x, y) => ctx.name(x).localeCompare(ctx.name(y)));
  const rec = new Map();
  const bump = (me, opp, pf, pa) => {
    const k = `${me}|${opp}`;
    const r = rec.get(k) ?? { w: 0, l: 0, t: 0, pf: 0, pa: 0 };
    if (pf > pa) r.w++; else if (pf < pa) r.l++; else r.t++;
    r.pf += pf; r.pa += pa;
    rec.set(k, r);
  };
  for (const g of all) {
    if (!g.a.m || !g.b.m || g.a.m === g.b.m) continue;
    bump(g.a.m, g.b.m, g.a.score, g.b.score);
    bump(g.b.m, g.a.m, g.b.score, g.a.score);
  }
  return { ids, get: (a, b) => rec.get(`${a}|${b}`) ?? null };
}

function pairGames(ctx, a, b) {
  return games(ctx)
    .filter((g) => (g.a.m === a && g.b.m === b) || (g.a.m === b && g.b.m === a))
    .reverse();
}

function records(ctx, top = 5) {
  const gs = games(ctx);

  const singles = gs.flatMap((g) => [
    { year: g.year, week: g.week, m: g.a.m, team: g.a.team, score: g.a.score, opp: g.b.team },
    { year: g.year, week: g.week, m: g.b.m, team: g.b.team, score: g.b.score, opp: g.a.team },
  ]);
  const highScores = [...singles].sort((x, y) => y.score - x.score).slice(0, top);
  const lowScores = singles.filter((s) => s.score > 0).sort((x, y) => x.score - y.score).slice(0, top);

  const margins = gs.map((g) => {
    const [win, lose] = g.a.score >= g.b.score ? [g.a, g.b] : [g.b, g.a];
    return { year: g.year, week: g.week, winner: win, loser: lose, margin: win.score - lose.score };
  });
  const biggestMargins = [...margins].sort((x, y) => y.margin - x.margin).slice(0, top);
  const closestGames = margins.filter((g) => g.margin > 0).sort((x, y) => x.margin - y.margin).slice(0, top);

  const seasonPF = ctx.seasons
    .flatMap((s) => s.teams.map((t) => ({ year: s.year, team: t.name, manager: ctx.name(t.managerId), pf: t.pf ?? 0 })))
    .sort((x, y) => y.pf - x.pf).slice(0, top);

  const perManager = new Map();
  for (const g of gs) {
    for (const [me, opp] of [[g.a, g.b], [g.b, g.a]]) {
      if (!me.m) continue;
      const result = me.score > opp.score ? "W" : me.score < opp.score ? "L" : "T";
      const list = perManager.get(me.m) ?? [];
      list.push({ result, year: g.year, week: g.week });
      perManager.set(me.m, list);
    }
  }
  const streaks = (kind) => {
    const out = [];
    for (const [m, list] of perManager) {
      let run = 0, best = 0, end = -1;
      list.forEach((x, i) => {
        if (x.result === kind) { run++; if (run > best) { best = run; end = i; } } else run = 0;
      });
      if (best > 0) out.push({ manager: ctx.name(m), length: best, from: list[end - best + 1], to: list[end] });
    }
    return out.sort((x, y) => y.length - x.length).slice(0, top);
  };

  return { highScores, lowScores, biggestMargins, closestGames, seasonPF, winStreaks: streaks("W"), loseStreaks: streaks("L") };
}

// ---- drafts ----
function draftYears(ctx) {
  return ctx.seasons.filter((s) => s.draft && s.draft.picks.length).map((s) => s.year).sort((a, b) => b - a);
}
function draftOf(ctx, year) {
  const s = ctx.seasons.find((x) => x.year === year);
  return s && s.draft && s.draft.picks.length ? s.draft : null;
}

// ---- trades ----
function tradeYears(ctx) {
  return [...new Set((ctx.data.trades || []).map((t) => t.ls))].sort((a, b) => b - a);
}

// Trades with team and manager names filled in, and each traded draft pick matched to the player it became.
function tradeList(ctx) {
  const seasonByYear = new Map(ctx.seasons.map((s) => [s.year, s]));
  const teamOf = (ls, roster) => {
    const s = seasonByYear.get(ls);
    const t = s && s.teams[roster - 1];
    return t ? { name: t.name, managerId: t.managerId } : { name: "Team " + roster, managerId: null };
  };
  const pickPlayer = (year, round, orig) => {
    const d = seasonByYear.get(year) && seasonByYear.get(year).draft;
    if (!d || !d.slots) return null;
    const slot = Object.keys(d.slots).find((k) => d.slots[k] === orig);
    if (slot === undefined) return null;
    const pk = d.picks.find((k) => k.round === round && k.slot === Number(slot));
    return pk ? { player: pk.player, pos: pk.pos } : null;
  };
  return [...(ctx.data.trades || [])].sort((a, b) => b.at - a.at).map((t) => ({
    id: t.id, ls: t.ls, at: t.at,
    sides: t.sides.map((sd) => {
      const other = t.sides.find((x) => x.r !== sd.r);
      const team = teamOf(t.ls, sd.r);
      return {
        r: sd.r, team: team.name, managerId: team.managerId,
        drops: (sd.drop || []).map((x) => x.name),
        got: sd.got.map((g) => {
          if (g.k === "p") return { kind: "player", text: g.name, pos: g.pos };
          if (g.k === "d") {
            return { kind: "pick", text: `${g.y} Round ${g.rd}`, resolved: pickPlayer(g.y, g.rd, g.o),
              orig: other && g.o !== other.r ? teamOf(t.ls, g.o).name : null };
          }
          return { kind: "faab", text: `$${g.amt} FAAB` };
        }),
      };
    }),
  }));
}

// ---- head-to-head: pick a manager and see every opponent, or open one matchup ----
const typeOk = (g, f) => f === "all" || (f === "playoff" ? g.type === "playoff" : g.type === "regular");

function h2hManagers(ctx) {
  const ids = new Set();
  for (const g of games(ctx)) if (g.a.m && g.b.m && g.a.m !== g.b.m) { ids.add(g.a.m); ids.add(g.b.m); }
  return [...ids].sort((x, y) => ctx.name(x).localeCompare(ctx.name(y)));
}

// one manager's record against each opponent
function h2hAgainstAll(ctx, me, filter = "all") {
  const rows = new Map();
  for (const g of games(ctx)) {
    if (!typeOk(g, filter)) continue;
    let mine, theirs;
    if (g.a.m === me) { mine = g.a; theirs = g.b; } else if (g.b.m === me) { mine = g.b; theirs = g.a; } else continue;
    if (!theirs.m || theirs.m === me) continue;
    const r = rows.get(theirs.m) || { opp: theirs.m, w: 0, l: 0, t: 0, pf: 0, pa: 0, last: null };
    if (mine.score > theirs.score) r.w++; else if (mine.score < theirs.score) r.l++; else r.t++;
    r.pf += mine.score; r.pa += theirs.score; r.last = { year: g.year, week: g.week };
    rows.set(theirs.m, r);
  }
  return [...rows.values()].map((r) => ({ ...r, games: r.w + r.l + r.t, pct: pct(r.w, r.l, r.t) }))
    .sort((a, b) => b.games - a.games || b.pct - a.pct);
}

// every game between two managers, plus the numbers worth showing
function h2hPair(ctx, me, opp, filter = "all") {
  const chrono = [];
  for (const g of games(ctx)) {
    if (!typeOk(g, filter)) continue;
    let mine, theirs;
    if (g.a.m === me && g.b.m === opp) { mine = g.a; theirs = g.b; } else if (g.b.m === me && g.a.m === opp) { mine = g.b; theirs = g.a; } else continue;
    const margin = mine.score - theirs.score;
    chrono.push({ year: g.year, week: g.week, type: g.type, mine, theirs, margin, result: margin > 0 ? "W" : margin < 0 ? "L" : "T" });
  }
  const out = { n: chrono.length, w: 0, l: 0, t: 0, pf: 0, pa: 0, reg: { w: 0, l: 0, t: 0 }, po: { w: 0, l: 0, t: 0 },
    biggestWin: null, biggestLoss: null, longestWin: 0, longestLoss: 0, current: null, last: chrono.at(-1) || null, list: [...chrono].reverse() };
  let run = 0, runKind = null;
  for (const g of chrono) {
    const k = g.result.toLowerCase();
    out[k]++; (g.type === "playoff" ? out.po : out.reg)[k]++;
    out.pf += g.mine.score; out.pa += g.theirs.score;
    if (g.margin > 0 && (!out.biggestWin || g.margin > out.biggestWin.margin)) out.biggestWin = g;
    if (g.margin < 0 && (!out.biggestLoss || g.margin < out.biggestLoss.margin)) out.biggestLoss = g;
    if (g.result === runKind) run++; else { runKind = g.result; run = 1; }
    if (g.result === "W") out.longestWin = Math.max(out.longestWin, run);
    if (g.result === "L") out.longestLoss = Math.max(out.longestLoss, run);
  }
  if (runKind === "W" || runKind === "L") out.current = { holder: runKind === "W" ? "me" : "opp", length: run };
  out.avgMine = out.n ? out.pf / out.n : 0;
  out.avgTheirs = out.n ? out.pa / out.n : 0;
  return out;
}

// ---- manager profiles: the all-time numbers plus who is still playing and what to call their team ----
function managerProfiles(ctx) {
  const latest = Math.max(...ctx.seasons.map((s) => s.year));
  const info = new Map();
  for (const s of ctx.seasons) {
    if (s.legacy) continue;
    for (const t of s.teams) {
      if (!t.managerId) continue;
      const i = info.get(t.managerId) || { first: s.year, last: s.year, team: t.name, teamYear: s.year };
      i.first = Math.min(i.first, s.year); i.last = Math.max(i.last, s.year);
      if (s.year >= i.teamYear) { i.team = t.name; i.teamYear = s.year; }
      info.set(t.managerId, i);
    }
  }
  return allTime(ctx).map((r) => {
    const i = info.get(r.managerId) || { first: 0, last: 0, team: "" };
    return { ...r, first: i.first, last: i.last, team: i.team, current: i.last === latest, years: !i.first ? "" : i.first === i.last ? String(i.first) : `${i.first}\u2013${i.last}` };
  });
}

// Turns stats into HTML. This is the file to edit when you want to change how a page is laid out.

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (n) => Number(n ?? 0).toFixed(1);
const pct3 = (p) => p.toFixed(3).replace(/^0/, "");
const rec = (w, l, t) => (t ? `${w}-${l}-${t}` : `${w}-${l}`);
const when = (year, week) => `${year} wk ${week}`;
const trophy = "\u{1F3C6}";

const table = (heads, rows, cls = "") => `
  <div class="table-wrap"><table class="${cls}">
    <thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;

const section = (title, body, note = "") =>
  `<section class="card"><h2>${esc(title)}</h2>${note ? `<p class="note">${esc(note)}</p>` : ""}${body}</section>`;

function championsView(ctx) {
  const who = (x) => `${esc(x.team)} <span class="muted">(${esc(x.manager)})</span>`;
  const rows = champions(ctx).map((c) => [
    esc(c.year),
    c.champion
      ? (c.champion.team
        ? `${trophy} <strong>${esc(c.champion.team)}</strong> <span class="muted">(${esc(c.champion.manager)})</span>`
        : `${trophy} <strong>${esc(c.champion.manager)}</strong> <span class="muted">(Yahoo era)</span>`)
      : `<span class="muted">not decided</span>`,
    c.runnerUp ? who(c.runnerUp) : `<span class="muted">-</span>`,
  ]);
  return section("Champions", table(["Year", "Champion", "Runner-up"], rows),
    ctx.seasons.some((s) => s.legacy) ? "The first two seasons were played on Yahoo. Those standings are gone, so only the champions are listed." : "");
}

function standingsView(ctx, year) {
  const years = seasonYears(ctx);
  const y = years.includes(year) ? year : years[0];
  const select = `<label class="inline">Season <select id="year-select">${years
    .map((v) => `<option value="${v}"${v === y ? " selected" : ""}>${v}</option>`).join("")}</select></label>`;
  const list = standings(ctx, y);
  // seasons we can read live from Sleeper carry each team's full-roster total (starters + bench, no IR or taxi)
  const hasBench = list.length > 0 && list.every((t) => t.rosterPts !== null && t.rosterPts !== undefined);
  const rows = list.map((t) => [
    esc(t.rank),
    `${t.champion ? trophy + " " : ""}<strong>${esc(t.name)}</strong>`,
    esc(t.manager),
    rec(t.wins, t.losses, t.ties),
    f1(t.pf), f1(t.pa),
    hasBench ? `<strong>${f1(t.rosterPts)}</strong>` : t.finalRank ? esc(t.finalRank) : `<span class="muted">-</span>`,
  ]);
  const s = ctx.seasons.find((x) => x.year === y) || {};
  let note = "Order is regular-season record, then points for. Final is the playoff finish where the platform reports it.";
  if (hasBench) {
    note = "Order is regular-season record, then points for. Total pts adds each week’s starters and bench players for the regular season. IR and taxi squad players are not counted.";
    const lw = s.rosterLockedWeeks || [];
    if (lw.length) note += ` Weeks ${lw[0]}–${lw[lw.length - 1]} are locked and won’t change; later weeks update live.`;
    const c = s.rosterCheck;
    if (c && c.checked && c.matched / c.checked < 0.9) note += ` Heads up: for ${c.checked - c.matched} of ${c.checked} team-weeks my starter total didn’t match Sleeper’s official score, so treat these totals as approximate.`;
  } else if (s.rosterMissing) {
    note = "Total points including bench aren’t showing because Sleeper didn’t send each player’s score for the week. The final finish is shown instead.";
  }
  return section(`${y} standings`, select + table(["#", "Team", "Manager", "Record", "PF", "PA", hasBench ? "Total pts (incl. bench)" : "Final"], rows), note);
}

function allTimeView(ctx) {
  const hasGames = ctx.seasons.some((s) => s.matchups.length);
  const rows = allTime(ctx).map((r) => [
    `<strong>${esc(r.name)}</strong>`,
    esc(r.seasons),
    rec(r.w, r.l, r.t),
    pct3(r.pct),
    f1(r.pf),
    r.titles.length ? `${trophy} ${r.titles.length}` : "0",
    esc(r.runnerUps.length),
    ...(hasGames ? [esc(r.playoffs)] : []),
  ]);
  const heads = ["Manager", "Seasons", "Record", "Win %", "Points for", "Titles", "Runner-ups", ...(hasGames ? ["Playoffs"] : [])];
  return section("All-time leaderboard", table(heads, rows), "Regular-season records only. Sorted by titles, then win %.");
}

function h2hView(ctx, p) {
  const ids = h2hManagers(ctx);
  if (!ids.length) return section("Head-to-head", `<p class="muted">Head-to-head needs weekly scores, which haven’t been added yet.</p>`);
  const first = allTime(ctx).find((r) => ids.includes(r.managerId));
  const A = ids.includes(p.a) ? p.a : (first ? first.managerId : ids[0]);
  const B = p.b && p.b !== "all" && p.b !== A && ids.includes(p.b) ? p.b : "all";
  const filter = p.ht === "regular" || p.ht === "playoff" ? p.ht : "all";
  const opt = (value, label, sel) => `<option value="${esc(value)}"${sel ? " selected" : ""}>${esc(label)}</option>`;
  const nm = (id) => ctx.name(id);
  const controls = `<div class="filters">
    <label class="inline">Manager <select id="h2h-a">${ids.map((id) => opt(id, nm(id), id === A)).join("")}</select></label>
    <label class="inline">vs <select id="h2h-b">${opt("all", "Everyone", B === "all")}${ids.filter((id) => id !== A).map((id) => opt(id, nm(id), id === B)).join("")}</select></label>
    <label class="inline">Games <select id="h2h-type">${opt("all", "Regular season and playoffs", filter === "all")}${opt("regular", "Regular season only", filter === "regular")}${opt("playoff", "Playoffs only", filter === "playoff")}</select></label>
  </div>`;

  if (B === "all") {
    const rows = h2hAgainstAll(ctx, A, filter).map((r) => {
      const cls = r.w > r.l ? "win" : r.w < r.l ? "loss" : "even";
      return [`<button class="linkbtn" data-act="h2h-open" data-opp="${esc(r.opp)}">${esc(nm(r.opp))}</button>`, esc(r.games),
        `<span class="pill ${cls}">${rec(r.w, r.l, r.t)}</span>`, pct3(r.pct), f1(r.pf), f1(r.pa), r.last ? when(r.last.year, r.last.week) : ""];
    });
    const body = rows.length ? table(["Opponent", "Games", "Record", "Win %", "Points for", "Points against", "Last played"], rows)
      : `<p class="muted">${esc(nm(A))} has no games in that selection.</p>`;
    return section(`${nm(A)} against everyone`, `${controls}<p class="note">Tap an opponent to see every game between you two.</p>${body}`);
  }

  const x = h2hPair(ctx, A, B, filter);
  if (!x.n) return section(`${nm(A)} vs ${nm(B)}`, `${controls}<p class="muted">These two haven’t played each other${filter === "all" ? "" : " in that selection"}.</p>`);
  const lead = x.w > x.l ? "me" : x.w < x.l ? "opp" : null;
  const headline = lead
    ? `${esc(nm(lead === "me" ? A : B))} leads the series ${rec(Math.max(x.w, x.l), Math.min(x.w, x.l), x.t)}`
    : `Series tied ${rec(x.w, x.l, x.t)}`;
  const side = (id, wins, avg, isLead) => `<div class="h2h-side${isLead ? " lead" : ""}"><div class="h2h-name">${esc(nm(id))}</div><div class="h2h-num">${esc(wins)}</div><div class="h2h-sub">wins, avg ${f1(avg)}</div></div>`;
  const tile = (k, v, sub = "") => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  const big = (g) => g ? `${f1(Math.abs(g.margin))} pts <span class="muted">${when(g.year, g.week)}</span>` : `<span class="muted">none</span>`;
  const cur = x.current ? `${esc(nm(x.current.holder === "me" ? A : B))} won ${esc(x.current.length)} straight` : `<span class="muted">-</span>`;
  const l = x.last;
  const lastTxt = l ? `${when(l.year, l.week)}${l.type === "playoff" ? " (playoffs)" : ""}<br><span class="muted">${esc(nm(l.result === "W" ? A : l.result === "L" ? B : A))}${l.result === "T" ? " tied" : " won"} ${f1(Math.max(l.mine.score, l.theirs.score))} to ${f1(Math.min(l.mine.score, l.theirs.score))}</span>` : "";
  const tiles = [
    tile("Games", esc(x.n), filter === "all" ? `${rec(x.reg.w, x.reg.l, x.reg.t)} regular season${x.po.w + x.po.l + x.po.t ? `<br>${rec(x.po.w, x.po.l, x.po.t)} playoffs` : ""}` : ""),
    tile("Total points", `${f1(x.pf)} - ${f1(x.pa)}`, `${esc(nm(A))} - ${esc(nm(B))}`),
    tile(`${nm(A)}’s biggest win`, big(x.biggestWin)),
    tile(`${nm(B)}’s biggest win`, big(x.biggestLoss)),
    tile("Longest win streak", `${esc(nm(A))} ${esc(x.longestWin)}<br>${esc(nm(B))} ${esc(x.longestLoss)}`),
    tile("Current streak", cur),
    tile("Last meeting", lastTxt),
  ].join("");
  const list = x.list.map((g) => [when(g.year, g.week) + (g.type === "playoff" ? ` <span class="kp">P</span>` : ""),
    `${f1(g.mine.score)} - ${f1(g.theirs.score)}`,
    g.result === "W" ? esc(nm(A)) : g.result === "L" ? esc(nm(B)) : "Tie", f1(Math.abs(g.margin))]);
  return section(`${nm(A)} vs ${nm(B)}`, `${controls}
    <div class="h2h-board">${side(A, x.w, x.avgMine, lead === "me")}<div class="h2h-mid">vs${x.t ? `<span>${esc(x.t)} tie${x.t > 1 ? "s" : ""}</span>` : ""}</div>${side(B, x.l, x.avgTheirs, lead === "opp")}</div>
    <p class="big">${headline}</p>
    <div class="tiles">${tiles}</div>
    <h3>All games</h3>${table(["When", `Score (${nm(A)} first)`, "Winner", "Margin"], list)}`);
}

function recordsView(ctx) {
  const r = records(ctx);
  const hasGames = ctx.seasons.some((s) => s.matchups.length);
  const gameRow = (s) => [`<strong>${f1(s.score)}</strong>`, esc(s.team), `<span class="muted">vs ${esc(s.opp)}</span>`, when(s.year, s.week)];
  const marginRow = (g) => [`<strong>${f1(g.margin)}</strong>`, esc(g.winner.team), `<span class="muted">over ${esc(g.loser.team)}</span>`, when(g.year, g.week)];
  const streakRow = (s) => [`<strong>${s.length}</strong>`, esc(s.manager), `${when(s.from.year, s.from.week)} to ${when(s.to.year, s.to.week)}`];
  const HS = ["Score", "Team", "Opponent", "When"], HM = ["Margin", "Winner", "Loser", "When"];
  const pfSection = section("Most points in a season", table(["PF", "Team", "Manager", "Year"], r.seasonPF.map((s) => [`<strong>${f1(s.pf)}</strong>`, esc(s.team), esc(s.manager), esc(s.year)])));
  if (!hasGames) return `<div class="grid">${pfSection}</div><p class="muted">Single-game records and streaks need weekly scores, which haven’t been added yet.</p>`;
  return `<div class="grid">
    ${section("Highest score", table(HS, r.highScores.map(gameRow)))}
    ${section("Lowest score", table(HS, r.lowScores.map(gameRow)))}
    ${section("Biggest blowouts", table(HM, r.biggestMargins.map(marginRow)))}
    ${section("Closest games", table(HM, r.closestGames.map(marginRow)))}
    ${section("Most points in a season", table(["PF", "Team", "Manager", "Year"], r.seasonPF.map((s) => [`<strong>${f1(s.pf)}</strong>`, esc(s.team), esc(s.manager), esc(s.year)])))}
    ${section("Longest win streaks", table(["Games", "Manager", "Span"], r.winStreaks.map(streakRow)), "Streaks carry across seasons.")}
    ${section("Longest losing streaks", table(["Games", "Manager", "Span"], r.loseStreaks.map(streakRow)))}
  </div>`;
}

const MGR_SORTS = [["titles", "Most titles"], ["pct", "Best win %"], ["seasons", "Most seasons"], ["name", "Name A to Z"]];
const initials = (name) => (String(name).split(/\s+/).map((w) => w[0]).join("").replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || "?");
const sortManagers = (rows, how) => [...rows].sort((a, b) =>
  how === "name" ? a.name.localeCompare(b.name)
  : how === "pct" ? b.pct - a.pct || b.titles.length - a.titles.length
  : how === "seasons" ? b.seasons - a.seasons || b.titles.length - a.titles.length
  : b.titles.length - a.titles.length || b.runnerUps.length - a.runnerUps.length || b.pct - a.pct);

function managersView(ctx, p = {}) {
  const hasGames = ctx.seasons.some((s) => s.matchups.length);
  const how = MGR_SORTS.some(([k]) => k === p.msort) ? p.msort : "titles";
  const all = managerProfiles(ctx);
  const current = sortManagers(all.filter((r) => r.current), how);
  const former = all.filter((r) => !r.current);
  const chips = (years, cls) => years.map((y) => `<span class="yr ${cls}">${esc(y)}</span>`).join("");
  const card = (r) => `
    <article class="card mgr">
      <div class="mgr-top">
        <div class="avatar">${esc(initials(r.name))}</div>
        <div class="mgr-id"><h3>${esc(r.name)}</h3><div class="muted">${esc(r.team)}${r.team ? " · " : ""}${esc(r.years)}</div></div>
        <div class="mgr-titles" title="League titles"><span class="mgr-n">${esc(r.titles.length)}</span><span class="mgr-l">${r.titles.length === 1 ? "title" : "titles"}</span></div>
      </div>
      <div class="mgr-row"><span class="mgr-k">${trophy} Champion</span><span>${r.titles.length ? chips(r.titles, "gold") : `<span class="muted">No titles yet</span>`}</span></div>
      <div class="mgr-row"><span class="mgr-k">Runner-up</span><span>${r.runnerUps.length ? chips(r.runnerUps, "") : `<span class="muted">-</span>`}</span></div>
      <div class="mgr-stats">
        <div><div class="k">Record</div><div class="v">${rec(r.w, r.l, r.t)}</div></div>
        <div><div class="k">Win %</div><div class="v">${pct3(r.pct)}</div></div>
        <div><div class="k">Seasons</div><div class="v">${esc(r.seasons)}</div></div>
        ${hasGames ? `<div><div class="k">Playoffs</div><div class="v">${esc(r.playoffs)}</div></div>` : ""}
      </div>
      <div class="bar" title="Win % ${pct3(r.pct)}"><i style="width:${Math.round(r.pct * 100)}%"></i></div>
      <button class="linkbtn mgr-h2h" data-act="mgr-h2h" data-id="${esc(r.managerId)}">Head-to-head record &rarr;</button>
    </article>`;
  const select = `<label class="inline">Sort by <select id="mgr-sort">${MGR_SORTS.map(([k, l]) => `<option value="${k}"${k === how ? " selected" : ""}>${l}</option>`).join("")}</select></label>`;
  const formerRows = sortManagers(former, "titles").map((r) => [
    `<strong>${esc(r.name)}</strong>`, esc(r.years), r.titles.length ? `${trophy} ${esc(r.titles.length)}` : "0", rec(r.w, r.l, r.t), pct3(r.pct), esc(r.seasons)]);
  return `
    <section class="card mgr-head"><div class="hb-head"><h2>Managers</h2>${select}</div>
      <p class="note" style="margin:0">${current.length} current managers, ${former.length} former. Titles and records are all-time, across ESPN and Sleeper.</p></section>
    <div class="cards mgr-grid">${current.map(card).join("")}</div>
    ${former.length ? section("Former managers", table(["Manager", "Years", "Titles", "Record", "Win %", "Seasons"], formerRows)) : ""}`;
}

/* ---------- draft history ---------- */
const POS_LIST = ["QB", "RB", "WR", "TE", "K", "D/ST"];
const posClass = (p) => "pos-" + String(p || "").replace(/[^A-Za-z]/g, "");

function draftState(ctx, p) {
  const years = draftYears(ctx);
  const year = years.includes(p.dyear) ? p.dyear : years[0];
  const draft = draftOf(ctx, year);
  const mgrIds = [...new Set(draft.picks.map((k) => k.managerId).filter(Boolean))]
    .sort((a, b) => ctx.name(a).localeCompare(ctx.name(b)));
  return {
    years, year, draft, mgrIds,
    view: p.dview === "list" ? "list" : "board",
    pos: POS_LIST.includes(p.dpos) ? p.dpos : "all",
    mgr: mgrIds.includes(p.dmgr) ? p.dmgr : "all",
    q: String(p.dq || "").trim().toLowerCase(),
  };
}

function draftView(ctx, p) {
  if (!draftYears(ctx).length) return section("Draft history", `<p class="muted">No draft data has been added yet.</p>`);
  const st = draftState(ctx, p);
  const opt = (value, label, sel) => `<option value="${esc(value)}"${sel ? " selected" : ""}>${esc(label)}</option>`;
  const controls = `<div class="filters">
    <label class="inline">Season <select id="draft-year">${st.years.map((y) => opt(y, y, y === st.year)).join("")}</select></label>
    <label class="inline">View <select id="draft-view">${opt("board", "Board", st.view === "board")}${opt("list", "List", st.view === "list")}</select></label>
    <label class="inline">Position <select id="draft-pos">${opt("all", "All", st.pos === "all")}${POS_LIST.map((x) => opt(x, x, st.pos === x)).join("")}</select></label>
    <label class="inline">Manager <select id="draft-mgr">${opt("all", "All", st.mgr === "all")}${st.mgrIds.map((id) => opt(id, ctx.name(id), st.mgr === id)).join("")}</select></label>
    <label class="inline"><input id="draft-q" type="search" placeholder="Search player" value="${esc(p.dq || "")}"></label>
  </div>`;
  return section(`${st.year} draft`, `${controls}<div id="draft-body">${draftBody(ctx, p)}</div>`);
}

function draftBody(ctx, p) {
  const st = draftState(ctx, p);
  const { draft, pos, mgr, q } = st;
  const ok = (k) => (pos === "all" || k.pos === pos) && (mgr === "all" || k.managerId === mgr) && (!q || k.player.toLowerCase().includes(q));
  const picks = [...draft.picks].sort((a, b) => a.n - b.n);
  const shown = picks.filter(ok);
  const filtered = shown.length !== picks.length;
  const type = draft.type ? draft.type[0].toUpperCase() + draft.type.slice(1) : "";
  const keepers = picks.some((k) => k.keeper);
  const info = `<p class="note">${esc(type)} draft, ${esc(draft.rounds)} rounds, ${esc(picks.length)} picks${filtered ? `. Showing ${esc(shown.length)} matching.` : "."}` +
    `${keepers ? ` K marks a keeper${draft.platform === "espn" ? "; ESPN lists keeper picks first, in rounds 1 and 2" : ""}.` : ""}</p>`;

  const tag = (k, dim) => `<div class="pick ${posClass(k.pos)}${dim ? " dim" : ""}"><span class="pn">${esc(k.n)}</span><span class="pl">${esc(k.player)}</span><span class="pp">${esc(k.pos)}</span>${k.keeper ? `<span class="kp" title="Keeper">K</span>` : ""}</div>`;

  if (st.view === "list") {
    const rows = shown.map((k) => [esc(k.n), esc(k.round), `<strong>${esc(k.player)}</strong>${k.keeper ? ` <span class="kp">K</span>` : ""}`,
      `<span class="pill ${posClass(k.pos)}">${esc(k.pos)}</span>`, esc(k.team), k.managerId ? esc(ctx.name(k.managerId)) : `<span class="muted">-</span>`]);
    return info + (rows.length ? table(["Pick", "Rd", "Player", "Pos", "Team", "Manager"], rows) : `<p class="muted">No picks match those filters.</p>`);
  }

  const cols = [];
  for (const k of picks) if (!cols.some((c) => c.team === k.team)) cols.push({ team: k.team, managerId: k.managerId });
  const cell = new Map();
  for (const k of picks) {
    const key = k.round + "|" + k.team;
    const list = cell.get(key) || [];
    list.push(k);
    cell.set(key, list);
  }
  const head = `<tr><th class="rd"></th>${cols.map((c) => `<th>${esc(c.team)}<div class="sub">${c.managerId ? esc(ctx.name(c.managerId)) : ""}</div></th>`).join("")}</tr>`;
  const body = Array.from({ length: draft.rounds }, (_, i) => i + 1).map((r) =>
    `<tr><th class="rd">${r}</th>${cols.map((c) => `<td>${(cell.get(r + "|" + c.team) || []).map((k) => tag(k, !ok(k))).join("")}</td>`).join("")}</tr>`).join("");
  return `${info}<div class="table-wrap board"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- trades ---------- */
function tradeState(ctx, p) {
  const years = tradeYears(ctx);
  const all = tradeList(ctx);
  const mgrIds = [...new Set(all.flatMap((t) => t.sides.map((s) => s.managerId)).filter(Boolean))]
    .sort((a, b) => ctx.name(a).localeCompare(ctx.name(b)));
  return { years, all, mgrIds,
    year: years.includes(p.tyear) ? p.tyear : "all",
    mgr: mgrIds.includes(p.tmgr) ? p.tmgr : "all",
    q: String(p.tq || "").trim().toLowerCase() };
}

function tradesView(ctx, p) {
  const st = tradeState(ctx, p);
  if (!st.all.length) return section("Trades", `<p class="muted">No trades have been added yet.</p>`);
  const opt = (value, label, sel) => `<option value="${esc(value)}"${sel ? " selected" : ""}>${esc(label)}</option>`;
  const controls = `<div class="filters">
    <label class="inline">Season <select id="trade-year">${opt("all", "All", st.year === "all")}${st.years.map((y) => opt(y, y, st.year === y)).join("")}</select></label>
    <label class="inline">Manager <select id="trade-mgr">${opt("all", "All", st.mgr === "all")}${st.mgrIds.map((id) => opt(id, ctx.name(id), st.mgr === id)).join("")}</select></label>
    <label class="inline"><input id="trade-q" type="search" placeholder="Search player or team" value="${esc(p.tq || "")}"></label>
  </div>`;
  return section("Trades", `${controls}<div id="trades-body">${tradesBody(ctx, p)}</div>`);
}

function tradesBody(ctx, p) {
  const st = tradeState(ctx, p);
  const text = (t) => t.sides.map((s) => s.team + " " + (s.managerId ? ctx.name(s.managerId) : "") + " " +
    s.got.map((g) => g.text + " " + (g.resolved ? g.resolved.player : "")).join(" ") + " " + (s.drops || []).join(" ")).join(" ").toLowerCase();
  const shown = st.all.filter((t) =>
    (st.year === "all" || t.ls === st.year) &&
    (st.mgr === "all" || t.sides.some((s) => s.managerId === st.mgr)) &&
    (!st.q || text(t).includes(st.q)));
  if (!shown.length) return `<p class="muted">No trades match those filters.</p>`;

  const item = (g) => {
    if (g.kind === "player") return `<li>${esc(g.text)} ${g.pos ? `<span class="pill pos-${esc(String(g.pos).replace(/[^A-Za-z]/g, ""))}">${esc(g.pos)}</span>` : ""}</li>`;
    if (g.kind === "pick") {
      return `<li>${esc(g.text)}${g.resolved ? ` <span class="res">(${esc(g.resolved.player)})</span>` : ""}${g.orig ? ` <span class="muted">from ${esc(g.orig)}</span>` : ""}</li>`;
    }
    return `<li>${esc(g.text)}</li>`;
  };
  const cards = shown.map((t) => {
    const date = new Date(t.at).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    const sides = t.sides.map((s) => `
      <div class="side">
        <h4>${esc(s.team)}${s.managerId ? ` <span class="sub">${esc(ctx.name(s.managerId))}</span>` : ""}</h4>
        <div class="recv">receives</div>
        <ul>${s.got.length ? s.got.map(item).join("") : `<li class="muted">nothing</li>`}</ul>
        ${s.drops && s.drops.length ? `<div class="drops">also dropped: ${s.drops.map(esc).join(", ")}</div>` : ""}
      </div>`).join("");
    return `<article class="trade"><div class="tmeta">${esc(date)} <span class="muted">${esc(t.ls)} season</span></div><div class="sides">${sides}</div>${typeof tgHtml === "function" ? tgHtml(ctx, t) : ""}</article>`;
  }).join("");
  return `<p class="note">${shown.length} trade${shown.length === 1 ? "" : "s"}. A traded pick shows the player it became in parentheses once that draft has happened.</p>${typeof tgNote === "function" ? tgNote(ctx, shown) : ""}<div class="trades">${cards}</div>`;
}

/* ---------- lock weeks (hidden page: open the site and add #lock to the address) ---------- */
// what a lock file contains: frozen values stay frozen, newly finished weeks use today’s numbers
function lockFileData(live) {
  const done = Math.max(0, live.rosterLastScored || 0);
  const out = { season: live.year, completedThrough: done, createdAt: new Date().toISOString(), weeks: {} };
  for (let w = 1; w <= done; w++) {
    out.weeks[w] = {};
    live.teams.forEach((t) => { const row = live.rosterWeeks && live.rosterWeeks[String(t.teamId)]; out.weeks[w][t.teamId] = (row && row[w] !== undefined) ? row[w] : 0; });
  }
  return out;
}

function lockView(ctx) {
  const live = [...ctx.seasons].reverse().find((s) => s.live && s.rosterWeeks);
  if (!live) return section("Lock weeks", `<p class="muted">Waiting for Sleeper’s weekly scores. Open this page again in a few seconds, and make sure the site shows “Live from Sleeper” at the bottom.</p>`);
  const done = Math.max(0, live.rosterLastScored || 0);
  const weeks = Array.from({ length: done }, (_, i) => i + 1);
  const locked = new Set(live.rosterLockedWeeks || []);
  if (!weeks.length) return section("Lock weeks", `<p class="muted">Sleeper doesn’t show any finished weeks for ${esc(live.year)} yet.</p>`);
  const value = (t, w) => {
    const rid = String(t.teamId);
    const v = live.rosterWeeks[rid] && live.rosterWeeks[rid][w];
    return v === undefined ? 0 : v;
  };
  const out = lockFileData(live);
  const rows = live.teams.map((t) => [`<strong>${esc(t.name)}</strong>`, ...weeks.map((w) => `${f1(value(t, w))}${locked.has(w) ? " \u{1F512}" : ""}`), `<strong>${f1(t.rosterPts)}</strong>`]);
  const newWeeks = weeks.filter((w) => !locked.has(w));
  return section(`Lock weeks, ${live.year}`,
    `<p class="note">Weeks 1–${done} are finished on Sleeper. A \u{1F512} means that week is already frozen in the site. ${newWeeks.length ? `Not frozen yet: week${newWeeks.length > 1 ? "s" : ""} ${esc(newWeeks.join(", "))}.` : "Every finished week is frozen."}</p>` +
    table(["Team", ...weeks.map((w) => `Wk ${w}`), "Total"], rows) +
    `<p class="note" style="margin-top:14px">When you’re happy with these numbers, copy the text below and send it to Claude, and the weeks will be frozen in the next update.</p>
     <textarea id="lock-json" rows="8" readonly>${esc(JSON.stringify(out))}</textarea>
     <div class="row"><button class="btn primary" data-act="lock-copy">Copy</button><button class="btn" data-act="lock-download">Download file</button></div>`);
}

/* ---------- the paper: weekly recap and preview editions ---------- */
const PAPER = { name: "The Weekly Roundup", recapTag: "Coach Boone’s Week in Review", previewTag: "Coach Boone’s Preview", soonTag: "Coach Boone’s Week in Review and Preview" };
const f2 = (n) => Number(n ?? 0).toFixed(2);
// plain text with **bold**; blank lines make new paragraphs
const mdText = (t) => String(t || "").split(/\n{2,}/).map((p) => `<p>${esc(p.trim()).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</p>`).join("");

// Every edition is one issue: RECAPS[year]["7-recap"] = the recap of week 7, RECAPS[year]["8-preview"] = the preview of week 8.
function recapEditions(recaps) {
  const out = [];
  for (const [year, issues] of Object.entries(recaps || {})) for (const [key, ed] of Object.entries(issues || {})) {
    const m = key.match(/^(\d+)-(recap|preview)$/); if (!m) continue;
    const week = Number(m[1]), kind = m[2];
    out.push({ key: `${year}-${key}`, year: Number(year), week, kind, ed, order: kind === "recap" ? week * 2 : week * 2 - 1 });
  }
  return out.sort((a, b) => b.year - a.year || b.order - a.order);
}

function recapsView(ctx, p, recaps) {
  const eds = recapEditions(recaps);
  const masthead = (inner, left = "", right = "", tag = PAPER.soonTag) => `
    <div class="np-top"><span>${left}</span><span>${right}</span></div>
    <div class="np-name">${esc(PAPER.name)}</div>
    <div class="np-tag">${esc(tag)}</div>${inner}`;
  if (!eds.length) {
    return `<section class="paper">${masthead(`<div class="np-bar"><span>Coming soon</span></div><p class="np-deck">The first edition is on its way. Every week: a recap of last week’s matchups after the scores are final on Tuesday, and a preview of the next slate on Thursday, with the player matchups that matter.</p>`, "Vol. 17 · No. 1", "Est. 2010")}</section>`;
  }
  const cur = eds.find((e) => e.key === p.redition) || eds[0];
  const ed = cur.ed, recap = cur.kind === "recap";
  const season = ctx.seasons.find((s) => s.year === cur.year);
  const team = (id) => (season && season.teams[id - 1]) || { name: "Team " + id, managerId: null, wins: 0, losses: 0, ties: 0 };
  const who = (id) => { const t = team(id); return `<strong>${esc(t.name)}</strong> <span class="muted">(${esc(t.managerId ? ctx.name(t.managerId) : "")})</span>`; };
  const scoreOf = (a, b) => {
    const g = season && season.matchups.find((m) => m.week === cur.week && ((m.home.teamId === a && m.away.teamId === b) || (m.home.teamId === b && m.away.teamId === a)));
    if (!g) return null;
    return g.home.teamId === a ? [g.home.score, g.away.score] : [g.away.score, g.home.score];
  };
  const scoreFor = (m) => scoreOf(m.a, m.b) || (Array.isArray(m.score) ? m.score : null);
  const record = (id) => { const t = team(id); return `${t.wins}-${t.losses}${t.ties ? "-" + t.ties : ""}`; };
  const issueNo = [...eds].filter((e) => e.year === cur.year).sort((a, b) => a.order - b.order).findIndex((e) => e.key === cur.key) + 1;
  const label = (e) => `Week ${e.week} ${e.kind === "recap" ? "Recap" : "Preview"}`;
  const options = eds.map((e) => `<option value="${esc(e.key)}"${e.key === cur.key ? " selected" : ""}>${e.year} ${label(e)}</option>`).join("");

  // size each story: the author can say lead / feature / brief; otherwise the closest recap (or first preview) leads
  const stories = (ed.stories || []).map((m, i) => ({ ...m, _i: i }));
  const margin = (m) => { const sc = scoreFor(m); return sc ? Math.abs(sc[0] - sc[1]) : Infinity; };
  if (!stories.every((m) => m.size)) {
    const ranked = recap ? [...stories].sort((x, y) => margin(x) - margin(y)) : stories;
    ranked.forEach((m, r) => { m._rank = r; if (!m.size) m.size = r === 0 ? "lead" : r <= 3 ? "feature" : "brief"; });
  }
  const byRank = (x, y) => (x._rank ?? x._i) - (y._rank ?? y._i);   // closest games first when I let the page size a recap
  const leadStory = stories.find((m) => m.size === "lead");
  const features = stories.filter((m) => m !== leadStory && m.size !== "brief").sort(byRank);
  const briefs = stories.filter((m) => m.size === "brief").sort(byRank);

  const story = (m) => {
    const sc = recap ? scoreFor(m) : null;
    const win = sc ? (sc[0] > sc[1] ? 0 : sc[0] < sc[1] ? 1 : -1) : -1;
    const kicker = recap
      ? `Week ${cur.week}${sc ? ` · decided by ${f2(Math.abs(sc[0] - sc[1]))}` : ""}${m.tag ? ` · ${esc(m.tag)}` : ""}`
      : `Week ${cur.week} · ${esc(record(m.a))} vs ${esc(record(m.b))}${m.tag ? ` · ${esc(m.tag)}` : ""}`;
    const line = recap && sc
      ? `<div class="np-score"><span class="${win === 0 ? "w" : ""}">${esc(team(m.a).name)} ${f2(sc[0])}</span><span class="np-dash">&ndash;</span><span class="${win === 1 ? "w" : ""}">${esc(team(m.b).name)} ${f2(sc[1])}</span></div>`
      : `<div class="np-score"><span>${who(m.a)}</span><span class="np-dash">vs</span><span>${who(m.b)}</span></div>`;
    const pick = !recap && m.pick ? `<div class="np-pick"><span class="new">OUR PICK</span> ${who(m.pick)}${m.why ? ` <span class="muted">${esc(m.why)}</span>` : ""}</div>` : "";
    const headline = m.headline || `${team(m.a).name} vs ${team(m.b).name}`;
    if (m.size === "brief") return `<article class="np-story np-brief"><div class="np-kicker">${kicker}</div><h3 class="np-h">${esc(headline)}</h3>${line}<div class="np-body">${mdText(m.text)}</div>${pick}</article>`;
    return `<article class="np-story np-${m.size === "lead" ? "lead" : "feature"}"><div class="np-kicker">${kicker}</div><h3 class="np-h">${esc(headline)}</h3>${m.deck ? `<p class="np-deck">${esc(m.deck)}</p>` : ""}${line}<div class="np-body">${mdText(m.text)}</div>${pick}</article>`;
  };

  // league notebook: happenings, streaks, the playoff race, the top of the draft. Each is title + text, optional bullets, optional table.
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const note = (s) => `<section class="np-note${s.wide ? " np-wide" : ""}"><div class="np-sec-h">${esc(s.title)}</div>${s.deck ? `<p class="np-deck">${esc(s.deck)}</p>` : ""}${s.text ? `<div class="np-body">${mdText(s.text)}</div>` : ""}${(s.items || []).length ? `<ul class="np-list">${s.items.map((i) => `<li>${inline(i)}</li>`).join("")}</ul>` : ""}${s.table ? table((s.table.heads || []).map(esc), (s.table.rows || []).map((r) => r.map(inline))) : ""}</section>`;
  const notebook = (ed.sections || []).length ? `<div class="np-notebook">${ed.sections.map(note).join("")}</div>` : "";
  const sidebars = (ed.sidebars || []).map((s) => `<aside class="np-box"><div class="np-box-h">${esc(s.title)}</div><ul>${(s.items || []).map((i) => `<li>${esc(i).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</li>`).join("")}</ul></aside>`).join("");
  const awards = (ed.awards || []).length ? `<section class="np-sec"><div class="np-sec-h">Awards</div><div class="awards">${ed.awards.map((a) => `<div class="award"><div class="award-k">${esc(a.label)}</div><div class="award-v">${a.team ? who(a.team) : ""}</div><div class="award-t">${mdText(a.text)}</div></div>`).join("")}</div></section>` : "";
  // the rumor mill: trade chatter, some real and some invented, never labeled which. heat 1 to 4, a source, and a report card on last week's rumors.
  const rm = ed.rumors, heatNames = ["", "Whisper", "Chatter", "Hot", "Five-alarm"];
  const rumorMill = rm && (rm.items || []).length ? `<section class="np-rumors"><div class="np-rumor-top"><div class="np-sec-h">${esc(rm.title || "The Rumor Mill")}</div><span class="np-stamp">Unconfirmed</span></div>${rm.deck ? `<p class="np-deck">${esc(rm.deck)}</p>` : ""}<div class="np-rumor-grid">${rm.items.map((i) => { const h = Math.max(1, Math.min(4, Number(i.heat) || 1)); return `<article class="np-rumor"><div class="np-heat" title="${heatNames[h]}"><span class="np-dots">${"&#9679;".repeat(h)}${"&#9675;".repeat(4 - h)}</span> ${heatNames[h]}</div><h4>${esc(i.headline)}</h4>${i.source ? `<div class="np-src">Source: ${esc(i.source)}</div>` : ""}${mdText(i.text)}</article>`; }).join("")}</div>${rm.scorecard ? `<p class="np-score-card"><strong>Report card:</strong> ${esc(rm.scorecard)}</p>` : ""}</section>` : "";
  // look ahead: league-wide, not a matchup breakdown. Key games for the playoff line, the first pick, streaks and records.
  const la = ed.lookAhead;

      const sorted = [...all].sort((a, b) => a.pts - b.pts), n = sorted.length;
      const median = (sorted[Math.floor((n - 1) / 2)].pts + sorted[Math.ceil((n - 1) / 2)].pts) / 2;

const slug = (s) => String(s || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function blankTeam() { return { name: "", manager: "", wins: "", losses: "", ties: "", pf: "", pa: "" }; }
function newDraft() { return { year: "", teams: Array.from({ length: 10 }, blankTeam), champIdx: -1, runnerIdx: -1, text: "" }; }

const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
function matchTeam(name, names) {
  const n = norm(name);
  if (!n) return null;
  const exact = names.find((x) => norm(x) === n);
  if (exact) return exact;
  if (n.length >= 4) {
    const part = names.filter((x) => { const k = norm(x); return k && (k.includes(n) || n.includes(k)); });
    if (part.length === 1) return part[0];
  }
  return null;
}

// Saved season docs (+ saved weekly games) -> the shape the stats and views expect.
function toHistory(docs, gdocs, drafts) {
  const managers = new Map();
  let unmatched = 0;
  const seasons = [...docs].sort((a, b) => a.year - b.year).map((d) => {
    const teams = (d.teams || []).map((t, i) => {
      const mname = String(t.manager || "").trim();
      const id = mname ? slug(mname) || mname : null;
      if (id && !managers.has(id)) managers.set(id, { id, name: mname });
      return {
        teamId: i + 1, name: t.name || (d.legacy ? "" : `Team ${i + 1}`), ownerNames: [mname], managerId: id,
        wins: +t.wins || 0, losses: +t.losses || 0, ties: +t.ties || 0, pf: +t.pf || 0, pa: +t.pa || 0,
        finalRank: i === d.champIdx ? 1 : i === d.runnerIdx ? 2 : null, playoffSeed: null, rosterPts: t.rosterPts === undefined ? null : t.rosterPts,
      };
    });
    const byName = new Map(teams.map((t) => [norm(t.name), t]));
    const matchups = [];
    for (const g of (gdocs.get(d.year)?.games || [])) {
      const h = byName.get(norm(g.home)), a = byName.get(norm(g.away));
      if (!h || !a || h === a) { unmatched++; continue; }
      matchups.push({ week: +g.week, type: g.type || "regular",
        home: { teamId: h.teamId, score: +g.homeScore, managerId: h.managerId },
        away: { teamId: a.teamId, score: +g.awayScore, managerId: a.managerId } });
    }
    const champ = d.champIdx >= 0 && teams[d.champIdx] ? d.champIdx + 1 : null;
    const dd = drafts && drafts.get(d.year);
    let draft = null;
    if (dd) {
      const mgrOf = new Map(teams.map((t) => [norm(t.name), t.managerId]));
      draft = { platform: dd.platform, type: dd.type, rounds: dd.rounds,
        slots: dd.slots || null,
        picks: dd.picks.map((k) => ({ n: k.n, round: k.r, team: k.t, managerId: mgrOf.get(norm(k.t)) || null, player: k.p, pos: k.pos, keeper: !!k.k, slot: k.s === undefined ? null : k.s })) };
    }
    return { year: d.year, draft, legacy: !!d.legacy, live: !!d.live, rosterCheck: d.rosterCheck || null, rosterMissing: !!d.rosterMissing, rosterWeeks: d.rosterWeeks || null, rosterLastScored: d.rosterLastScored || 0, rosterLockedWeeks: d.rosterLockedWeeks || [], platform: "manual", leagueName: d.leagueName || null, status: "complete",
      championTeamId: champ, championManagerId: champ ? teams[d.champIdx].managerId : null, teams, matchups };
  });
  return { sample: false, managers: [...managers.values()], seasons, unmatched, trades: tradeData() };
}

function refresh() {
  ctx = prepare(rows.length ? toHistory(rows, gameDocs, draftMap()) : SAMPLE);
  const years = seasonYears(ctx);
  if (!years.includes(params.year)) params.year = years[0];
}

  const list = [...rows].sort((a, b) => b.year - a.year).map((d) => {
    const inDb = dbRows.some((x) => x.year === d.year) || dbGameDocs.has(d.year);
    const inBase = BASE_ROWS.some((x) => x.year === d.year) || liveRows.some((x) => x.year === d.year);
    const isLive = liveRows.some((x) => x.year === d.year);
    const delLabel = confirmDel === d.year ? "Click again to confirm" : inBase ? "Reset to built-in" : "Delete";
    return `
    <tr><td><strong>${esc(d.year)}</strong></td><td>${(d.teams || []).length} teams${inBase ? ` <span class="muted">${inDb ? "(edited)" : isLive ? "(live from Sleeper)" : "(built in)"}</span>` : ""}</td>
    <td class="actions">
      <button class="btn" data-act="edit" data-year="${esc(d.year)}">Edit</button>
      ${inDb ? `<button class="btn danger" data-act="del" data-year="${esc(d.year)}">${delLabel}</button>` : ""}
    </td></tr>`; }).join("");
  const saved = rows.length
    ? section("Saved seasons", `<div class="table-wrap"><table><tbody>${list}</tbody></table></div>`)
    : section("Saved seasons", `<p class="muted">Nothing saved yet. The other tabs are showing sample data until you add your first season.</p>`);

  const backup = section("Backup", `<p class="note">Download everything as a file, or restore from one. Restoring overwrites any season that has the same year.</p>
    <div class="row"><button class="btn" data-act="export">Download backup</button>
    ${db && canWrite !== false ? `<label class="btn">Restore from file<input type="file" id="restore" accept="application/json,.json" hidden></label>` : ""}</div>`);

  if (canWrite === false || !db) {
    return note + saved + backup + section("Add a season", `<p class="muted">${db ? "You have view-only access, so you can’t add seasons." : "Saving isn’t available in this view. Open the page from your Claude artifacts to add data."}</p>`);
  }

  const teamRows = draft.teams.map((t, i) => `
    <tr>
      <td class="muted">${i + 1}</td>
      <td>${input(i, "name", t.name, 'placeholder="Team name" class="w-team"')}</td>
      <td>${input(i, "manager", t.manager, 'placeholder="Manager" class="w-mgr"')}</td>
      <td>${input(i, "wins", t.wins, 'inputmode="decimal" class="w-num"')}</td>
      <td>${input(i, "losses", t.losses, 'inputmode="decimal" class="w-num"')}</td>
      <td>${input(i, "ties", t.ties, 'inputmode="decimal" class="w-num"')}</td>
      <td>${input(i, "pf", t.pf, 'inputmode="decimal" class="w-pts"')}</td>
      <td>${input(i, "pa", t.pa, 'inputmode="decimal" class="w-pts"')}</td>
      <td class="center"><input type="radio" name="champ" data-act="champ" data-i="${i}" ${draft.champIdx === i ? "checked" : ""}></td>
      <td class="center"><input type="radio" name="runner" data-act="runner" data-i="${i}" ${draft.runnerIdx === i ? "checked" : ""}></td>
      <td><button class="btn small" data-act="delrow" data-i="${i}" title="Remove row">&times;</button></td>
    </tr>`).join("");

  const fileNote = pendingFiles.length ? `<span class="muted">${pendingFiles.length} screenshot${pendingFiles.length > 1 ? "s" : ""} chosen</span>` : "";
  const filePicker = imageLimit
    ? `<label class="btn">Choose screenshot<input type="file" id="shots" accept="image/*" multiple hidden></label> ${fileNote}` : "";
  const autofill = sampleNs ? `
    <div class="autofill">
      <h3>Quick fill (optional)</h3>
      <p class="note">Paste the standings page text${imageLimit ? " or choose a screenshot of it" : ""}, then let Claude fill in the form. Check the numbers before saving.</p>
      <textarea data-f="text" rows="4" placeholder="Paste standings here...">${esc(draft.text)}</textarea>
      <div class="row">${filePicker}<button class="btn primary" data-act="fill" ${busy ? "disabled" : ""}>${busy ? "Reading..." : "Fill the form"}</button></div>
    </div>` : "";

  const form = section("Add or edit a season", `
    ${autofill}
    <label class="inline">Season year <input data-f="year" value="${esc(draft.year)}" inputmode="numeric" class="w-year" placeholder="2019"></label>
    <div class="table-wrap"><table class="entry">
      <thead><tr><th>#</th><th>Team</th><th>Manager</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th><th>Champ</th><th>2nd</th><th></th></tr></thead>
      <tbody>${teamRows}</tbody>
    </table></div>
    <div class="row">
      <button class="btn" data-act="addrow">Add team row</button>
      <button class="btn primary" data-act="save">Save season</button>
      <button class="btn" data-act="clear">Clear form</button>
    </div>
    <p class="note">Use the same manager name every year so their titles and records combine. Leave the champion blank if the season isn’t finished.</p>`);

  return `${note}${status ? `<div class="banner">${esc(status)}</div>` : ""}${form}${saved}${backup}`;
}

/* ---------- Add scores page ---------- */
function unlockCard(title) {
  return `${status ? `<div class="banner">${esc(status)}</div>` : ""}` + section(title, `<p class="muted">Enter the editor PIN to add or change data.</p>
    <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" class="w-year"><button class="btn primary" data-act="unlock">Unlock</button></div>`);
}

function saveErr(e) {
  if (e && e.code === "quota_exceeded") return "The database is full.";
  if (e && e.code === "permission-denied") return "Firebase blocked the save. Check your Firestore rules.";
  return "Couldn’t save that. If you only have view access, ask the owner to add the data.";
}

async function exportAll() {
  const payload = JSON.stringify({ app: "league-history", version: 1, exportedAt: new Date().toISOString(),
    seasons: [...rows].sort((a, b) => a.year - b.year), games: [...gameDocs.values()] }, null, 2);
  const name = `league-history-${new Date().toISOString().slice(0, 10)}.json`;
  try {
    const dl = await use("downloads");
    if (dl) await dl.save({ filename: name, data: payload });
    else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    say("Backup ready.");
  } catch (e) {
    say(e && e.code === "declined" ? "Download cancelled." : "Couldn’t create the download.");
  }
}

async function restoreFrom(file) {
  try {
    const data = JSON.parse(await file.text());
    const seasons = Array.isArray(data.seasons) ? data.seasons : [];
    const games = Array.isArray(data.games) ? data.games : [];
    if (!seasons.length && !games.length) return say("That file doesn’t look like a league backup.");
    busy = true; render();
    for (const s of seasons) if (Number.isInteger(s.year)) await db.collection("seasons").doc(String(s.year)).set(s);
    for (const g of games) if (Number.isInteger(g.year)) await db.collection("games").doc(String(g.year)).set(g);
    busy = false;
    say(`Restored ${seasons.length} season${seasons.length === 1 ? "" : "s"} and ${games.length} set${games.length === 1 ? "" : "s"} of scores.`);
  } catch (e) {
    busy = false;
    say(e && e.code ? saveErr(e) : "Couldn’t read that file.");
  }
}

function sortGames(list) { return [...list].sort((a, b) => (Number(a.week) || 0) - (Number(b.week) || 0)); }

function loadGames(year) {
  const saved = gameDocs.get(year)?.games || [];
  const t = (v) => (v === undefined || v === null ? "" : String(v));
  gdraft = { year: String(year), text: "", weekHint: "",
    games: sortGames(saved.map((g) => ({ week: t(g.week), type: g.type || "regular", home: t(g.home), homeScore: t(g.homeScore), away: t(g.away), awayScore: t(g.awayScore) }))) };
  gFiles = [];
}

function scoresView() {
  if (!unlocked) return unlockCard("Add or edit weekly scores");
  const years = rows.map((d) => d.year).sort((a, b) => b - a);
  if (!years.length) return section("Weekly scores", `<p class="muted">Save a season’s standings first, on the Add data tab. Scores are matched to the team names saved there.</p>`);
  const summary = section("Saved scores", table(["Season", "Games saved"],
    years.map((y) => { const n = (gameDocs.get(y)?.games || []).length; return [`<strong>${y}</strong>`, n ? String(n) : `<span class="muted">none yet</span>`]; })));
  if (canWrite === false || !db) {
    return summary + section("Add weekly scores", `<p class="muted">${db ? "You have view-only access, so you can’t add scores." : "Saving isn’t available in this view."}</p>`);
  }
  if (!years.includes(Number(gdraft.year))) loadGames(years[0]);
  const y = Number(gdraft.year);
  const names = (rows.find((r) => r.year === y)?.teams || []).map((t) => t.name);
  const flag = (n) => (String(n).trim() && !matchTeam(n, names) ? " bad" : "");
  const typeOpts = (cur) => ["regular", "playoff", "consolation"].map((o) => `<option value="${o}"${o === cur ? " selected" : ""}>${o}</option>`).join("");
  const gi = (i, f, v, cls, extra = "") => `<input data-g="${f}" data-i="${i}" value="${esc(v)}" class="${cls}" ${extra}>`;

  const body = gdraft.games.map((g, i) => `
    <tr>
      <td>${gi(i, "week", g.week, "w-week", 'inputmode="numeric"')}</td>
      <td><select data-g="type" data-i="${i}">${typeOpts(g.type)}</select></td>
      <td>${gi(i, "home", g.home, "w-team" + flag(g.home), 'list="gteams"')}</td>
      <td>${gi(i, "homeScore", g.homeScore, "w-score", 'inputmode="decimal"')}</td>
      <td>${gi(i, "away", g.away, "w-team" + flag(g.away), 'list="gteams"')}</td>
      <td>${gi(i, "awayScore", g.awayScore, "w-score", 'inputmode="decimal"')}</td>
      <td><button class="btn small" data-act="gdelrow" data-i="${i}" title="Remove game">&times;</button></td>
    </tr>`).join("");

  const fileNote = gFiles.length ? `<span class="muted">${gFiles.length} screenshot${gFiles.length > 1 ? "s" : ""} chosen</span>` : "";
  const filePicker = imageLimit ? `<label class="btn">Choose screenshot<input type="file" id="gshots" accept="image/*" multiple hidden></label> ${fileNote}` : "";
  const autofill = sampleNs ? `
    <div class="autofill">
      <h3>Quick fill (optional)</h3>
      <p class="note">Paste a scoreboard page${imageLimit ? " or choose screenshots" : ""}, one or several weeks at a time. Re-importing a week replaces that week.</p>
      <textarea data-gf="text" rows="4" placeholder="Paste scores here...">${esc(gdraft.text)}</textarea>
      <div class="row">
        <label class="inline" style="margin:0">Week, if not shown <input data-gf="weekHint" class="w-week" value="${esc(gdraft.weekHint)}" inputmode="numeric"></label>
        ${filePicker}
        <button class="btn primary" data-act="gfill" ${busy ? "disabled" : ""}>${busy ? "Reading..." : "Fill the scores"}</button>
      </div>
    </div>` : "";

  const warn = ctx.data.unmatched ? `<div class="banner">${ctx.data.unmatched} saved game${ctx.data.unmatched > 1 ? "s don’t" : " doesn’t"} match a team name in the standings (a team may have been renamed), so ${ctx.data.unmatched > 1 ? "they’re" : "it’s"} left out of the stats.</div>` : "";
  const hasSaved = dbGameDocs.has(y);

  const form = section("Add or edit weekly scores", `
    <label class="inline">Season <select id="g-year">${years.map((v) => `<option value="${v}"${v === y ? " selected" : ""}>${v}</option>`).join("")}</select></label>
    ${autofill}
    <datalist id="gteams">${names.map((n) => `<option value="${esc(n)}">`).join("")}</datalist>
    <div class="table-wrap"><table class="entry">
      <thead><tr><th>Week</th><th>Type</th><th>Team</th><th>Score</th><th>Team</th><th>Score</th><th></th></tr></thead>
      <tbody>${body || `<tr><td colspan="7" class="muted">No games yet. Use Quick fill or add rows.</td></tr>`}</tbody>
    </table></div>
    <div class="row">
      <button class="btn" data-act="gaddrow">Add game row</button>
      <button class="btn primary" data-act="gsave" ${busy ? "disabled" : ""}>Save scores for ${y}</button>
      ${hasSaved ? `<button class="btn danger" data-act="gdelall">${confirmDelGames === y ? "Click again to confirm" : (BASE_GAMES.has(y) || liveGameDocs.has(y)) ? `Reset ${y} scores to built-in` : `Delete all ${y} scores`}</button>` : ""}
    </div>
    <p class="note">Which team is listed first doesn’t matter. Team names must match the standings for that season; rows with a name that doesn’t match turn red. Mark playoff and consolation games with Type so records stay accurate.</p>`);

  return `${status ? `<div class="banner">${esc(status)}</div>` : ""}${warn}${form}${summary}`;
}

/* ---------- pages ---------- */
const pages = {
  champions: ["Champions", (c) => championsView(c)],
  standings: ["Standings", (c, p) => standingsView(c, p.year)],
  recaps: ["Weekly Roundup", (c, p) => recapsView(c, p, BASE_RECAPS)],
  draft: ["Draft History", (c, p) => draftView(c, p)],
  draftorder: ["Draft Order", (c) => draftOrderView(c)],
  trades: ["Trades", (c, p) => tradesView(c, p)],
  trade: ["Trade Machine", (c) => tradeView(c)],
  pickcard: ["Pick Report Card", (c) => pickCardView(c)],
  alltime: ["All-time", (c) => allTimeView(c)],
  h2h: ["Head-to-head", (c, p) => h2hView(c, p)],
  records: ["Records", (c) => recordsView(c)],
  managers: ["Managers", (c, p) => managersView(c, p)],
  handbook: ["Handbook", () => handbookView()],
  lock: ["Lock weeks", (c) => lockView(c)],
  recapdata: ["Recap data", (c) => recapDataView(c)],
  data: ["Add data", () => dataView()],
  scores: ["Add scores", () => scoresView()],
};

function render() {
  const wanted = location.hash.slice(1);
  const key = pages[wanted] && !(READ_ONLY && (wanted === "data" || wanted === "scores")) ? wanted : "standings";
  const hasDrafts = draftYears(ctx).length > 0;
  const navLinks = Object.entries(pages)
    .filter(([k]) => (k !== "draft" || hasDrafts) && (k !== "trades" || (ctx.data.trades || []).length > 0) && k !== "lock" && k !== "recapdata" && k !== "pickcard" && !(READ_ONLY && (k === "data" || k === "scores")))
    .map(([k, [label]]) => `<a href="#${k}"${k === key ? ' class="active"' : ""}>${label}</a>`).join("");
  document.querySelector("#nav").innerHTML = navLinks;
  const drawerLinks = document.querySelector("#drawer-links");
  if (drawerLinks) drawerLinks.innerHTML = navLinks;
  const banner = ctx.data.sample && key !== "data"
    ? `<div class="banner">Showing <strong>sample data</strong>. Open <a href="#data">Add data</a> to enter your league’s real history.</div>` : "";
  document.querySelector("#view").innerHTML = banner + pages[key][1](ctx, params);
  const nameEl = document.querySelector("#league-name");
  if (nameEl && !nameEl.dataset.fixed) nameEl.textContent = ctx.data.seasons.at(-1)?.leagueName || "League History";
  document.title = `${pages[key][0]} | ${(typeof SITE_NAME !== "undefined" && SITE_NAME) || "League History"}`;
  const foot = document.querySelector("footer");
  if (foot) foot.textContent = liveNote || "Fantasy football league history";
  enhanceTables();
}

/* ---------- actions ---------- */
function say(msg) { status = msg; render(); }

function applyParsed(r) {
  const teams = Array.isArray(r?.teams) ? r.teams : [];
  if (!teams.length) return say("I couldn’t find any teams in that. Try pasting more of the page.");
  const s = (v) => (v === null || v === undefined ? "" : String(v));
  draft.teams = teams.map((t) => ({ name: s(t.name), manager: s(t.manager), wins: s(t.wins), losses: s(t.losses), ties: s(t.ties), pf: s(t.pf), pa: s(t.pa) }));
  if (r.year) draft.year = s(r.year);
  draft.champIdx = teams.findIndex((t) => r.champion && t.name === r.champion);
  draft.runnerIdx = teams.findIndex((t) => r.runnerUp && t.name === r.runnerUp);
  draft.text = "";
  pendingFiles = [];
  say("Filled in. Check the numbers, add any missing manager names, then Save season.");
}

async function fill() {
  const text = draft.text.trim();
  if (!text && !pendingFiles.length) return say("Paste some text or choose a screenshot first.");
  busy = true; status = ""; render();
  const prompt = `Extract final fantasy football league standings from the text and/or screenshots provided. Reply with only a JSON object shaped like {"year": 2019, "teams": [{"name": "Team name", "manager": "Owner name or empty string", "wins": 0, "losses": 0, "ties": 0, "pf": 0, "pa": 0}], "champion": "team name or null", "runnerUp": "team name or null"}. One entry per team, in the order shown. Use 0 for a missing number and an empty string if the manager isn’t shown. Never invent data.${text ? "\n\nText:\n" + text : ""}`;
  const opts = { modelTier: "default" };
  if (pendingFiles.length && imageLimit) opts.images = pendingFiles.slice(0, imageLimit.maxCount || 4);
  try {
    const result = await sampleNs.json(prompt, opts);
    busy = false;
    applyParsed(result);
  } catch (e) {
    busy = false;
    say(e && e.code === "not_granted" ? "Quick fill needs your permission to ask Claude. You can still type the numbers in."
      : "That didn’t work this time. You can try again or type the numbers in.");
  }
}

async function save() {
  const year = Number(draft.year);
  if (!Number.isInteger(year) || year < 1990 || year > 2100) return say("Enter the season year, like 2019.");
  const kept = [];
  draft.teams.forEach((t, i) => { if (t.name.trim() || t.manager.trim()) kept.push({ t, i }); });
  if (kept.length < 2) return say("Add at least two teams.");
  if (kept.some(({ t }) => !t.name.trim())) return say("Every row with a manager needs a team name too.");
  if (kept.some(({ t }) => !t.manager.trim())) return say("Every team needs a manager name so records can combine across seasons.");
  const num = (v) => { const n = parseFloat(String(v).replace(/,/g, "")); return Number.isFinite(n) ? n : 0; };
  const doc = {
    year, platform: "manual", savedAt: new Date().toISOString(),
    teams: kept.map(({ t }) => ({ name: t.name.trim(), manager: t.manager.trim(), wins: num(t.wins), losses: num(t.losses), ties: num(t.ties), pf: num(t.pf), pa: num(t.pa) })),
    champIdx: kept.findIndex(({ i }) => i === draft.champIdx),
    runnerIdx: kept.findIndex(({ i }) => i === draft.runnerIdx),
  };
  busy = true; render();
  try {
    await db.collection("seasons").doc(String(year)).set(doc);
    draft = newDraft();
    busy = false;
    say(`Saved ${year}.`);
  } catch (e) {
    busy = false;
    if (e && e.code === "invalid_argument") canWrite = false;
    say(saveErr(e));
  }
}

async function remove(year) {
  if (confirmDel !== year) { confirmDel = year; return render(); }
  confirmDel = null;
  try { await db.collection("seasons").doc(String(year)).delete(); await db.collection("games").doc(String(year)).delete(); say(`Deleted ${year}.`); }
  catch { say("Couldn’t delete that season."); }
}

async function fillGames() {
  const year = Number(gdraft.year);
  const names = (rows.find((r) => r.year === year)?.teams || []).map((t) => t.name);
  const text = gdraft.text.trim();
  if (!text && !gFiles.length) return say("Paste some text or choose a screenshot first.");
  busy = true; status = ""; render();
  const hint = String(gdraft.weekHint).trim();
  const prompt = `Extract fantasy football weekly matchup scores from the text and/or screenshots provided. Reply with only a JSON array like [{"week": 1, "type": "regular", "home": "Team name", "homeScore": 101.5, "away": "Team name", "awayScore": 98.2}]. type is "regular", "playoff" (championship bracket) or "consolation". ${hint ? `If a week isn’t shown, use week ${hint}.` : "Use the week shown."} Use the closest matching name from this list of teams: ${names.join(" | ")}. Never invent scores.${text ? "\n\nText:\n" + text : ""}`;
  const opts = { modelTier: "default" };
  if (gFiles.length && imageLimit) opts.images = gFiles.slice(0, imageLimit.maxCount || 4);
  try {
    const res = await sampleNs.json(prompt, opts);
    busy = false;
    applyGames(res, names);
  } catch (e) {
    busy = false;
    say(e && e.code === "not_granted" ? "Quick fill needs your permission to ask Claude. You can still type the scores in."
      : "That didn’t work this time. You can try again or type the scores in.");
  }
}

function applyGames(res, names) {
  const list = Array.isArray(res) ? res : Array.isArray(res?.games) ? res.games : [];
  if (!list.length) return say("I couldn’t find any games in that. Try including the week heading.");
  const s = (v) => (v === null || v === undefined ? "" : String(v));
  const types = ["regular", "playoff", "consolation"];
  const parsed = list.map((g) => ({
    week: s(g.week ?? gdraft.weekHint), type: types.includes(g.type) ? g.type : "regular",
    home: matchTeam(g.home, names) || s(g.home), homeScore: s(g.homeScore),
    away: matchTeam(g.away, names) || s(g.away), awayScore: s(g.awayScore),
  }));
  const weeks = new Set(parsed.map((g) => Number(g.week)));
  gdraft.games = sortGames(gdraft.games.filter((g) => !weeks.has(Number(g.week))).concat(parsed));
  gdraft.text = ""; gFiles = [];
  say(`Added ${parsed.length} games. Check them, fix any red team names, then Save scores.`);
}

async function saveGames() {
  const year = Number(gdraft.year);
  const season = rows.find((r) => r.year === year);
  if (!season) return say("Pick a season first.");
  const names = (season.teams || []).map((t) => t.name);
  const kept = gdraft.games.filter((g) => [g.home, g.away, g.homeScore, g.awayScore].some((v) => String(v).trim()));
  if (!kept.length) return say("There are no games to save.");
  const out = [], bad = [];
  for (const g of kept) {
    const home = matchTeam(g.home, names), away = matchTeam(g.away, names);
    if (!home || !away) { bad.push((!home ? g.home : g.away) || "(blank)"); continue; }
    const week = Number(g.week), hs = parseFloat(g.homeScore), as2 = parseFloat(g.awayScore);
    if (home === away) return say(`Week ${g.week}: a team can’t play itself (${home}).`);
    if (!Number.isInteger(week) || week < 1 || week > 25) return say(`“${g.week}” isn’t a valid week number.`);
    if (!Number.isFinite(hs) || !Number.isFinite(as2)) return say(`Week ${week}: ${home} vs ${away} is missing a score.`);
    out.push({ week, type: ["regular", "playoff", "consolation"].includes(g.type) ? g.type : "regular", home, homeScore: hs, away, awayScore: as2 });
  }
  if (bad.length) return say(`These names don’t match a ${year} team: ${[...new Set(bad)].join(", ")}. Fix the red rows.`);
  busy = true; render();
  try {
    await db.collection("games").doc(String(year)).set({ year, games: out, savedAt: new Date().toISOString() });
    busy = false;
    loadGames(year);
    say(`Saved ${out.length} games for ${year}.`);
  } catch (e) {
    busy = false;
    if (e && e.code === "invalid_argument") canWrite = false;
    say(saveErr(e));
  }
}

async function removeGames(year) {
  if (confirmDelGames !== year) { confirmDelGames = year; return render(); }
  confirmDelGames = null;
  try { await db.collection("games").doc(String(year)).delete(); loadGames(year); say(`Deleted all ${year} scores.`); }
  catch { say("Couldn’t delete those scores."); }
}

  if (name === "reset") { S.block = []; S.locks = {}; S.q = ""; S.pos = "ALL"; S.copied = false; S.balOpen = null; tmRefresh(); return; }
  if (name === "apply") {
    const ev = tmEval(S, D), sugg = tmSuggest(S, D, ev), s = sugg[Number(el.dataset.i)]; if (!s) return;
    if (s.kind === "add") s.assets.forEach((a) => S.block.push({ id: a.id, from: s.from, to: s.to }));
    else S.block = S.block.filter((b) => !(b.id === s.assets[0].id && b.from === s.from));

    try { navigator.clipboard.writeText(text).then(done, () => { tmFallbackCopy(text); done(); }); } catch (e) { tmFallbackCopy(text); done(); }

}
function tmFallbackCopy(text) { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove(); }

/* ---------- Pick Report Card (test build) ---------- */
// Looks back at every rookie pick the league has made: what the player is worth now compared with what that slot normally costs.
const PC = { hit: 1.25, miss: 0.75, cap: 4, k: 30, adjMin: 0.85, adjMax: 1.15, grades: [[0.40, "A"], [0.15, "B"], [-0.15, "C"], [-0.40, "D"]] };

function tmRookieDrafts(cx) {   // rookie drafts are the short ones (three rounds); startup and keeper drafts run much longer
  const out = [];
  for (const y of draftYears(cx)) { const d = draftOf(cx, y); if (d && d.picks && d.picks.length && d.rounds <= 5) out.push({ season: y, rounds: d.rounds, picks: d.picks }); }
  return out.sort((a, b) => a.season - b.season);
}
function tmTradeInfo(cx) { try { return tradeList(cx, {}).filter((t) => t.ls >= 2024); } catch (e) { return []; } }
function tmNeeds(cx) {   // every player we need a value for, even if nobody owns him now
  const needs = new Map();
  const want = (name, pos) => { if (name) { const k = tmNorm(name) + "|" + tmPos(pos); if (!needs.has(k)) needs.set(k, { name, pos: tmPos(pos) }); } };
  tmRookieDrafts(cx).forEach((d) => d.picks.forEach((p) => want(p.player, p.pos)));
  tmTradeInfo(cx).forEach((t) => t.sides.forEach((s) => s.got.forEach((g) => { if (g.kind === "player") want(g.text, g.pos); else if (g.kind === "pick" && g.resolved) want(g.resolved.player, g.resolved.pos); })));
  return needs;
}

// the typical price of each draft slot, drawn through the early / mid / late prices of a pick in the next class
function tmSlotCurve(anchors) {
  const a = anchors.map((x) => [x[0], x[1]]).sort((x, y) => x[0] - y[0]);
  for (let i = 1; i < a.length; i++) a[i][1] = Math.min(a[i][1], a[i - 1][1]);   // a later slot is never worth more
  return (slot) => {
    if (a.length === 1) return a[0][1];
    if (slot <= a[0][0]) return a[0][1] + ((a[0][1] - a[1][1]) / (a[1][0] - a[0][0])) * (a[0][0] - slot);
    for (let i = 1; i < a.length; i++) if (slot <= a[i][0]) { const t = (slot - a[i - 1][0]) / (a[i][0] - a[i - 1][0]); return a[i - 1][1] + t * (a[i][1] - a[i - 1][1]); }
    const n = a.length, s = (a[n - 2][1] - a[n - 1][1]) / (a[n - 1][0] - a[n - 2][0]);
    return Math.max(a[n - 1][1] * 0.4, a[n - 1][1] - s * (slot - a[n - 1][0]));
  };
}
function tmGrade(rel) { for (const [min, g] of PC.grades) if (rel >= min) return g; return "F"; }
const tmMean = (arr) => (arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0);
const tmClamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function tmCardBuild(env) {
  const nT = env.teams, rows = [];
  for (const dr of env.rookies) for (const pk of dr.picks) {
    const a = env.lookup(pk.player, pk.pos), baseline = env.curve(pk.n), valued = !!a && (a.hasMarket || (a.parts && a.parts.lg != null));
    const value = a ? a.mkt : 0, ret = baseline > 0 ? value / baseline : 0;
    rows.push({ season: dr.season, n: pk.n, round: pk.round, label: `${pk.round}.${String(((pk.n - 1) % nT) + 1).padStart(2, "0")}`, managerId: pk.managerId, mgr: env.mgr(pk.managerId),
      player: pk.player, pos: pk.pos, valued, value, baseline, ret, verdict: ret >= PC.hit ? "Hit" : ret <= PC.miss ? "Miss" : "On par",
      owner: a && a.team ? env.teamMgr(a.team) : "Cut", ppg: a ? a.ppg || 0 : 0, points: a ? a.total || 0 : 0, starts: a ? a.starts || 0 : 0, early: dr.season >= env.season });
  }
  const stat = (list) => ({ n: list.length, avg: tmMean(list.map((r) => Math.min(PC.cap, r.ret))), hits: list.filter((r) => r.verdict === "Hit").length, misses: list.filter((r) => r.verdict === "Miss").length, cut: list.filter((r) => r.owner === "Cut").length });
  const rounds = [...new Set(rows.map((r) => r.round))].sort((a, b) => a - b);
  const bands = [];
  if (rounds.includes(1)) [[1, 4, "Early 1st (1.01 to 1.04)"], [5, 8, "Mid 1st (1.05 to 1.08)"], [9, 12, "Late 1st (1.09 to 1.12)"]].forEach(([lo, hi, label]) => bands.push({ label, ...stat(rows.filter((r) => r.round === 1 && ((r.n - 1) % nT) + 1 >= lo && ((r.n - 1) % nT) + 1 <= hi)) }));
  rounds.filter((r) => r > 1).forEach((r) => bands.push({ label: `Round ${r}`, ...stat(rows.filter((x) => x.round === r)) }));
  const mgrs = [...new Set(rows.map((r) => r.managerId))].map((id) => {
    const list = rows.filter((r) => r.managerId === id), base = list.reduce((s, r) => s + r.baseline, 0), net = list.reduce((s, r) => s + r.value - r.baseline, 0), rel = base ? net / base : 0;
    const best = [...list].sort((a, b) => b.value - b.baseline - (a.value - a.baseline))[0], worst = [...list].sort((a, b) => a.value - a.baseline - (b.value - b.baseline))[0];
    return { id, mgr: list[0].mgr, n: list.length, rel, grade: tmGrade(rel), best, worst, hits: list.filter((r) => r.verdict === "Hit").length };
  }).sort((a, b) => b.rel - a.rel);
  // what the league's own results suggest about a pick of each round, from completed seasons only, nudged gently
  const done = rows.filter((r) => r.season < env.season), adj = {};
  for (const r of rounds) { const l = done.filter((x) => x.round === r), n = l.length, avg = n ? tmMean(l.map((x) => Math.min(PC.cap, x.ret))) : 1, w = n / (n + PC.k); adj[r] = { n, avg, w, adj: tmClamp(1 + w * (avg - 1), PC.adjMin, PC.adjMax) }; }
  const any = Object.values(adj).some((x) => x.n > 0 && Math.abs(x.adj - 1) >= 0.005);
  return { rows, bands, mgrs, adj: { byRound: adj, any }, seasons: [...new Set(rows.map((r) => r.season))], hindsight: tmHindsight(env), unvalued: rows.filter((r) => !r.valued).length, overall: stat(rows), baselinePoints: env.curve };
}

function tmHindsight(env) {
  const out = [];
  for (const t of env.trades || []) {
    if (!t.sides.some((s) => s.got.some((g) => g.kind === "pick"))) continue;
    const sides = t.sides.map((s) => {
      const items = s.got.map((g) => {
        if (g.kind === "player") { const a = env.lookup(g.text, g.pos); return { label: g.text, value: a && (a.hasMarket || (a.parts && a.parts.lg != null)) ? a.mkt : null }; }
        if (g.resolved) { const a = env.lookup(g.resolved.player, g.resolved.pos); return { label: `${g.text} (became ${g.resolved.player})`, value: a && (a.hasMarket || (a.parts && a.parts.lg != null)) ? a.mkt : null, pick: true }; }
        const m = String(g.text).match(/(20\d\d)\s*Round\s*(\d)/i); return { label: g.text, value: m ? env.pickMid(Number(m[1]), Number(m[2])) : null, pick: true, future: true };
      });
      const known = items.filter((i) => i.value != null);
      return { mgr: env.mgr(s.managerId) || s.team, items, total: known.reduce((a, i) => a + i.value, 0), unknown: items.length - known.length };
    });
    if (sides.length !== 2 || sides.some((s) => s.unknown === s.items.length)) continue;
    const [a, b] = sides, avg = (a.total + b.total) / 2 || 1, pct = Math.abs(a.total - b.total) / avg, lead = a.total >= b.total ? a : b;
    const shaky = sides.some((s) => s.unknown > s.items.length / 2);
    out.push({ at: t.at, sides, pct, winner: pct < 0.1 || shaky ? null : lead.mgr, shaky });
  }
  return out.sort((x, y) => y.at - x.at);
}
