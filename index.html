<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ronnie Bass Fantasy Football League</title>
<meta name="description" content="Ronnie Bass Fantasy Football league history, est. 2010">
<meta name="theme-color" content="#0b1f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ronnie Bass">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Colors and sizes live in these variables: change them here to restyle the whole site. White, blue and gold. */
:root {
  --bg: #f3f6fc;
  --card: #ffffff;
  --text: #14213d;
  --muted: #5a6a8a;
  --line: #dde5f3;
  --accent: #1d3d8f;
  --accent-soft: #e9f0ff;
  --navy: #0f2557;
  --gold: #f5b400;
  --gold-soft: #fff6d6;
  --paper: #fffdf6;
  --on-accent: #ffffff;
  --win: #dbe7ff;
  --loss: #fde7e7;
  --even: #edf1f8;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1330; --card: #111d44; --text: #eaf0ff; --muted: #9db0d8; --line: #25346a;
    --accent: #ffc72c; --accent-soft: #1b2b63; --navy: #eaf0ff; --gold: #ffc72c; --gold-soft: #3a3210; --paper: #0e1a42; --on-accent: #0a1330;
    --win: #1f3a7a; --loss: #5a2a38; --even: #1a2858;
  }
}
:root[data-theme="dark"] {
    --bg: #0a1330; --card: #111d44; --text: #eaf0ff; --muted: #9db0d8; --line: #25346a;
    --accent: #ffc72c; --accent-soft: #1b2b63; --navy: #eaf0ff; --gold: #ffc72c; --gold-soft: #3a3210; --paper: #0e1a42; --on-accent: #0a1330;
    --win: #1f3a7a; --loss: #5a2a38; --even: #1a2858;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px 0; position: sticky; top: 0; z-index: 5; }
h1 { margin: 0 0 8px; font-size: 20px; }
nav { display: flex; gap: 4px; overflow-x: auto; }
nav a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
nav a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 20px; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px; }
h2 { margin: 0 0 12px; font-size: 17px; }
h3 { margin: 0 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 0 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.cards .card { margin: 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tbody tr:hover { background: var(--accent-soft); }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 13px; }
.pill.win { background: var(--win); } .pill.loss { background: var(--loss); } .pill.even { background: var(--even); }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin: -6px 0 12px; }
.big { font-size: 17px; font-weight: 600; }
.pickers { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
label.inline { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px; }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
.banner { background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; }
.banner.error { background: var(--loss); }
code { background: var(--even); padding: 1px 6px; border-radius: 6px; }
.manager dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; }
.manager dt { color: var(--muted); } .manager dd { margin: 0; text-align: right; }
.trophies { min-height: 24px; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } main { padding: 12px; } }

/* data entry */
.btn { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; display: inline-block; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: #c0392b; }
.btn.small { padding: 2px 9px; }
.btn[disabled] { opacity: .6; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.actions { text-align: right; }
.center { text-align: center; }
input, textarea { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
textarea { width: 100%; }
.entry input { width: 100%; }
.entry td, .entry th { padding: 4px 6px; }
.w-team { min-width: 150px; } .w-mgr { min-width: 110px; } .w-num { min-width: 44px; max-width: 60px; } .w-pts { min-width: 72px; } .w-year { width: 90px; }
.autofill { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
.autofill h3 { margin: 0 0 4px; font-size: 15px; }
.banner a { color: var(--accent); }
.bad { border-color: #c0392b !important; background: var(--loss) !important; }
.w-week { min-width: 48px; max-width: 64px; } .w-score { min-width: 76px; max-width: 96px; }

/* draft */
.filters { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; margin-bottom: 4px; }
.filters input[type=search] { min-width: 170px; }
.board table { border-collapse: separate; border-spacing: 0; }
.board th, .board td { white-space: normal; vertical-align: top; border-bottom: 1px solid var(--line); }
.board td { min-width: 136px; padding: 4px; }
.board th .sub { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 12px; }
.board th.rd { position: sticky; left: 0; background: var(--card); text-align: center; min-width: 34px; }
.pick { display: flex; gap: 6px; align-items: baseline; font-size: 13px; line-height: 1.3; padding: 3px 6px; margin-bottom: 3px; border-radius: 6px; border-left: 4px solid var(--pos, var(--line)); background: var(--even); }
.pick .pn { color: var(--muted); font-size: 11px; min-width: 22px; }
.pick .pp { margin-left: auto; color: var(--muted); font-size: 11px; }
.pick.dim { opacity: .22; }
.kp { background: var(--accent); color: #fff; border-radius: 4px; font-size: 10px; padding: 0 4px; margin-left: 4px; }
.pos-QB { --pos: #c0392b; } .pos-RB { --pos: #2e86c1; } .pos-WR { --pos: #27ae60; } .pos-TE { --pos: #d68910; } .pos-K { --pos: #8e44ad; } .pos-DST { --pos: #7f8c8d; }
.pill.pos-QB, .pill.pos-RB, .pill.pos-WR, .pill.pos-TE, .pill.pos-K, .pill.pos-DST { background: var(--even); border-left: 4px solid var(--pos); border-radius: 6px; }

/* trades */
.trades { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.trade { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--card); }
.tmeta { font-size: 12px; color: var(--text); font-weight: 600; margin-bottom: 6px; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side h4 { margin: 0; font-size: 14px; line-height: 1.25; }
.side .sub { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.recv { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0 2px; }
.side ul { margin: 0; padding-left: 16px; font-size: 13px; }
.side li { margin-bottom: 3px; }
.res { color: var(--accent); font-weight: 600; }
@media (max-width: 520px) { .trades { grid-template-columns: 1fr; } }
.drops { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* brand header (GitHub build) */
h1.brand { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; }
h1.brand .logo { height: 56px; width: auto; display: block; }
h1.brand .tag { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

/* head-to-head */
.linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.h2h-board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 10px 0 4px; text-align: center; }
.h2h-side { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px; background: var(--card); }
.h2h-side.lead { border-color: var(--accent); background: var(--accent-soft); }
.h2h-name { font-weight: 700; font-size: 16px; }
.h2h-num { font-size: 44px; font-weight: 800; line-height: 1.1; }
.h2h-sub { font-size: 12px; color: var(--muted); }
.h2h-mid { color: var(--muted); font-weight: 600; }
.h2h-mid span { display: block; font-size: 11px; font-weight: 400; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 8px 0 16px; }
.tile { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--card); }
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.tile .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
@media (max-width: 520px) { .h2h-num { font-size: 36px; } }
h1.brand .tag { font-size: 15px; line-height: 1.2; }

/* handbook */
.hb-intro h2 { margin-bottom: 6px; }
.hb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
.chip:hover { background: var(--accent-soft); border-color: var(--accent); }
.hb { scroll-margin-top: 120px; }
.hb-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.hb-head h2 { margin: 0; }
.hb-top { font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.hb h3 { margin: 16px 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.hb-list, .hb-owners { margin: 4px 0; padding-left: 20px; }
.hb-list li, .hb-owners li { margin-bottom: 5px; }
.hb-list ul { margin: 4px 0 6px; padding-left: 20px; list-style: circle; }
.hb td, .hb th { white-space: normal; }
.new { display: inline-block; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; vertical-align: middle; }
.hb-cal tr.past td { color: var(--muted); }
.done { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
.hb-order td:first-child { text-align: center; width: 54px; }

/* phone menu: a dropdown that opens straight down from the header */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 2; }
.menu-btn { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 44px; height: 44px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; flex: none; }
.menu-btn span { display: block; height: 2px; border-radius: 2px; background: var(--text); transition: transform .2s ease, opacity .2s ease; }
.menu-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.menu-btn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.menu-btn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.drawer { display: none; }
@media (max-width: 720px) {
  header { padding: 8px 14px 8px; }
  nav#nav { display: none; }
  .menu-btn { display: flex; }
  h1.brand { margin: 0; gap: 10px; min-width: 0; }
  h1.brand .logo { height: 44px; }
  h1.brand .tag { font-size: 12px; letter-spacing: .04em; }
  main { padding: 12px; }
  .drawer { display: block; position: absolute; top: calc(100% + 3px); left: 0; right: 0; z-index: 1; visibility: hidden; transition: visibility 0s linear .25s; }
  .drawer.open { visibility: visible; transition-delay: 0s; }
  .drawer-backdrop { position: absolute; top: 0; left: 0; right: 0; height: 100vh; width: 100%; border: 0; padding: 0; background: rgba(10, 19, 48, .45); opacity: 0; transition: opacity .25s ease; cursor: pointer; }
  .drawer.open .drawer-backdrop { opacity: 1; }
  .drawer-links { position: relative; display: block; background: var(--card); border-bottom: 3px solid var(--gold); box-shadow: 0 14px 24px rgba(0, 0, 0, .2); max-height: 0; overflow: hidden; transition: max-height .25s ease; }
  .drawer.open .drawer-links { max-height: calc(100vh - 90px); overflow-y: auto; }
  .drawer-links a { display: block; padding: 15px 20px; font-size: 17px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); border-left: 4px solid transparent; }
  .drawer-links a:last-child { border-bottom: 0; }
  .drawer-links a.active { background: var(--accent-soft); border-left-color: var(--gold); color: var(--accent); font-weight: 700; }
  body.menu-open { overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) { .drawer-links, .drawer-backdrop, .menu-btn span { transition: none; } }

/* theme: white, blue and gold */
header { border-bottom: 3px solid var(--gold); }
nav a.active { color: var(--accent); border-bottom-color: var(--gold); }
h2 { color: var(--navy); border-left: 4px solid var(--gold); padding-left: 10px; }
th { color: var(--accent); background: var(--accent-soft); }
tbody tr:hover { background: var(--gold-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.new, .kp { background: var(--gold); color: #14213d; }
.big, .tile .v, .h2h-num, .h2h-name { color: var(--navy); }
.h2h-side.lead { border-color: var(--gold); background: var(--gold-soft); }
.banner { background: var(--gold-soft); border-color: var(--gold); }
.banner.error { background: var(--loss); border-color: var(--line); }
.chip:hover { border-color: var(--gold); background: var(--gold-soft); }
.drawer-links a.active { border-left-color: var(--gold); }
.card.manager { border-top: 3px solid var(--gold); }
.trade { border-left: 3px solid var(--gold); }

/* sortable columns */
th.sortable { cursor: pointer; user-select: none; -webkit-user-select: none; }
th.sortable:hover { color: var(--navy); }
th.sortable:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
th.sortable::after { content: "\2195"; margin-left: 5px; font-size: 11px; opacity: .35; }
th.sortable[aria-sort="ascending"]::after { content: "\25B2"; opacity: 1; color: var(--gold); }
th.sortable[aria-sort="descending"]::after { content: "\25BC"; opacity: 1; color: var(--gold); }

/* managers page */
.mgr-head .hb-head { margin-bottom: 4px; }
.mgr-head label.inline { margin: 0; }
.cards.mgr-grid { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-bottom: 16px; }
.mgr { border-top: 3px solid var(--gold); display: flex; flex-direction: column; gap: 10px; }
.mgr-top { display: flex; align-items: center; gap: 12px; }
.avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--on-accent); border: 2px solid var(--gold); display: grid; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: .02em; }
.mgr-id { min-width: 0; flex: 1; }
.mgr-id h3 { margin: 0; font-size: 17px; color: var(--navy); line-height: 1.2; }
.mgr-id .muted { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mgr-titles { flex: none; text-align: center; min-width: 54px; padding: 4px 8px; border-radius: 10px; background: var(--gold-soft); border: 1px solid var(--gold); }
.mgr-n { display: block; font-size: 24px; font-weight: 800; line-height: 1; color: var(--navy); }
.mgr-l { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.mgr-row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.mgr-k { flex: none; width: 92px; color: var(--muted); }
.mgr-row > span:last-child { display: flex; flex-wrap: wrap; gap: 4px; }
.yr { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--even); border: 1px solid var(--line); color: var(--text); }
.yr.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--navy); }
.mgr-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.mgr-stats .k { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.mgr-stats .v { font-size: 15px; font-weight: 700; color: var(--navy); white-space: nowrap; }
.bar { height: 6px; border-radius: 99px; background: var(--even); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }
.mgr-h2h { align-self: flex-start; font-size: 13px; }
@media (max-width: 520px) { .cards.mgr-grid { grid-template-columns: 1fr; } }

/* the paper */
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.award { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--card); border-top: 3px solid var(--gold); }
.award-k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.award-v { margin: 2px 0 4px; }
.award-t p { margin: 0; font-size: 13px; }
textarea#recap-json { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.paper { --rule: var(--navy); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 26px 28px; margin-bottom: 16px; font-family: Georgia, "Times New Roman", Times, serif; color: var(--text); }
.paper p { line-height: 1.55; }
.np-top { display: flex; justify-content: space-between; gap: 10px; font: 600 11px/1.2 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.np-name { text-align: center; font-size: 46px; font-weight: 900; line-height: 1.05; margin: 12px 0 2px; color: var(--navy); letter-spacing: .01em; }
.np-tag { text-align: center; font-style: italic; color: var(--muted); font-size: 14px; }
.np-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 12px 0 16px; padding: 6px 0; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); font: 700 13px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--navy); }
.np-bar .np-lbl { color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.np-bar select { font: 600 13px var(--font); text-transform: none; letter-spacing: 0; }
.np-banner { margin: 6px 0 4px; text-align: center; font-size: 30px; line-height: 1.12; font-weight: 900; color: var(--navy); border: 0; padding: 0; }
.np-deck { font-style: italic; color: var(--muted); font-size: 16px; margin: 0 0 8px; }
.np-center { text-align: center; }
.np-ticker { display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: center; font: 13px var(--font); padding: 8px 0; margin: 8px 0 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.np-sec-h, .np-box-h { font: 800 11px var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--navy); border-bottom: 2px solid var(--gold); padding-bottom: 3px; margin-bottom: 8px; display: inline-block; }
.np-editor { margin: 4px 0 18px; padding: 10px 14px; background: var(--gold-soft); border-left: 4px solid var(--gold); }
.np-editor p { margin: 0 0 8px; } .np-editor p:last-child { margin: 0; }
.np-story { margin: 0 0 6px; }
.np-kicker { font: 700 11px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.np-h { margin: 0 0 6px; font-weight: 900; color: var(--navy); line-height: 1.12; border: 0; padding: 0; }

.pc-hit { background: var(--gold-soft); border-color: var(--gold); color: var(--navy); } .pc-miss { background: var(--loss); border-color: #e5b8b8; color: #a33; }

.do-traded td { background: var(--gold-soft); }

const RECAPS = {"2026": {"7-recap": {"date": "Tuesday, October 27, 2026", "title": "BRYCE BENCHES MAYE, STILL ESCAPES JUSTIN BY 2.54", "deck": "A six-game skid for Justin, a 175-point Bandman, and Schub starts Mahomes with Pollard on the pine.", "intro": "Welcome to the first edition of the Weekly Roundup. Week 7 gave us a two-point thriller, a 175-point eruption, and a league that left a combined **246.98 points** on its benches.\n\nRecords here count both the weekly head-to-head and the league-median game, the same way Sleeper does. The roasting is aimed at lineups, never at people. Mostly.", "stories": [{"a": 9, "b": 11, "size": "lead", "score": [106.72, 104.18], "tag": "Game of the week", "headline": "Bryce Benches Drake Maye, Still Escapes Justin by 2.54", "deck": "Justin left the winning points on his own bench, and the running back Bryce traded him scored a touchdown there.", "text": "Hay Jay Maye All Day beat Steve Stiffler 106.72 to 104.18, and the winner spent the week acting like he was trying to lose. Bryce (11-3, four straight head-to-head wins) sat Drake Maye, the quarterback he took off Lutz's hands in July, in favor of C.J. Stroud. Maye threw for 321 yards and two touchdowns and ran for another in Thursday night's loss to Chicago, good for **32.44**. Stroud, whose Texans fell to the Giants in overtime, managed 20.52. That is 11.92 points handed back to the universe in a game decided by 2.54. Bryce's 106.72 was also below the league median of 115.32, so he lost the median game and won the matchup. A Howie Roseman special.\n\n**How it could have gone better for Justin:** all of it. Dak Prescott (29.28, three touchdowns in Monday night's win over Philadelphia) and Michael Penix Jr. (26.42, three touchdowns and no turnovers as Atlanta knocked off the unbeaten 49ers) both sat while Aaron Rodgers started for 15.08. Either swap wins the game. Dak alone is worth 14.2 points and an 11.66-point victory.\n\nThen the twist. Dameon Pierce, the running back Bryce shipped to Justin on October 21 for a 2027 third-round pick, scored a five-yard touchdown Monday night for 11.8 points, on Justin's bench. At flex instead of Wan'Dale Robinson (4.7) he wins the game too. Justin also started Carolina's defense, which scored minus-3 in a 43-13 loss to Tampa Bay, and left 22.8 points on the pine.\n\nHere is the sympathy: this roster is good. Justin's full roster has scored 1,516.68 points, third-most in the league, and he owns the second-worst record in it (2-12, six straight head-to-head losses). His bench has scored 749.64 points, more than any team in the league and 98 percent of what his starters have put up. The team is fine. The lineup is a crime scene."}, {"a": 4, "b": 6, "size": "feature", "score": [123.92, 131.2], "tag": "Lineup crimes", "headline": "Schub Starts Mahomes, Sits Pollard, and Still Beats Blake by 7.28", "deck": "Two lineups, two avoidable losses, and only one scoreboard.", "text": "schuby7 beat Petey Jones..Running Back 131.20 to 123.92 in a game both managers should have lost on process. Schub started Patrick Mahomes (6.00, in a 20-3 Chiefs loss to Seattle) while Tony Pollard (38.50, three touchdowns against Cleveland), Tyler Huntley (17.12) and J.J. McCarthy (10.18) sat. He left **49.72 points** on the bench, the worst in the league, and a perfect lineup would have scored 180.92, more than Baskwell's league-best 175.62. A man who once won a league off an autodraft appears to still let the robot set his lineup.\n\nWhat saved him was the flex spots: Tee Higgins (28.80, six catches for 148 yards and a score) and Luther Burden III (25.70, four for 130 and a touchdown) did the heavy lifting, with Rhamondre Stevenson (23.50) adding a touchdown catch in Thursday's loss.\n\nBlake, the league's most serious fantasy player, has no such luck and no such excuse. He lost by 7.28 with Darren Waller (12.00, a 50-yard touchdown from Bryce Young) on his bench while Darius Cooper (2.70), a waiver pickup, started at flex. Waller in, and Blake wins 133.22 to 131.20. He has made four waiver and free-agent moves in the last ten days. This week, the best move on the board was starting the guy already on his roster."}, {"a": 2, "b": 10, "size": "feature", "score": [175.62, 78.04], "tag": "Skid snapped", "headline": "Baskwell Hangs 175.62 on Go Birds and Snaps the Skid", "deck": "The Bandman finally plays his greatest hits, and the Go Birds start three tight ends.", "text": "Delicious Sugar Daddies scored 175.62, the high of the week and the 97th-best score in league history out of 2,642, then beat Go Birds by 97.58. That is the 18th-largest margin ever recorded and it ended a five-game head-to-head losing streak for the Bandman (5-9). Javonte Williams ran for a career-high 155 yards and a score in Monday's win over Philadelphia (23.50), Bucky Irving went for 106 yards and two touchdowns in Tampa Bay's 43-13 rout of Carolina (26.00), and Caleb Williams threw for 308 yards (27.12). The Bandman has his tune back.\n\nThe Go Birds are 1-13 and are the only team in the league without a single win against the median (0-7). Bill 2.0 started three tight ends (Dalton Schultz, Tyler Higbee and Dallas Goedert) for **22.70** combined points, and sat Makai Lemon, the Eagles rookie who caught his first NFL touchdown Monday night, for 19.70 on his own. For a man who loves Eagles players, he benched the one who scored. Philadelphia has lost five straight, so this may be a healthy boundary.\n\nIt is not the first time the Go Birds have been an extra in a historic result. In 2025, Brett's TuaEZ beat them by 133.72, still the biggest margin in league history."}, {"a": 5, "b": 12, "size": "feature", "score": [125.72, 99.56], "tag": "Streak snapped", "headline": "Brett Sweeps the Week; Weidaw's Streak Ends at Four", "deck": "A 32.28-point bench mistake, and it still was not close.", "text": "FirstTuaWorst beat e2weidaw 125.72 to 99.56, a sweep of both the head-to-head and median games that lifts Brett from 5-7 to 7-7 and ended Weidaw's four-game winning streak. Jaxon Smith-Njigba (33.30) and Jameson Williams (26.10) were the engines, and George Pickens added a 21-yard touchdown (15.70).\n\nBrett now leads the league in points left on the bench: **234.14** across seven weeks, 33.45 a week. This week it was Matthew Stafford (23.50) on the pine while Bryce Young (7.42) started in Carolina's 43-13 loss. The pattern is no longer a blip; it is a lifestyle.\n\nBig Game Weidaw went small. He started Jordan Love (20.96) with Bo Nix (28.28, plus a 62-yard touchdown run) on the bench, and started tight end Jake Ferguson (0.00) while Darnell Washington (7.40) sat. That is 23.02 points left behind, in a week CeeDee Lamb (24.40, two touchdowns) did his part."}, {"a": 1, "b": 8, "size": "brief", "score": [98.28, 126.2], "headline": "Nils Moves in Silence, Sweeps the Week, and Moves Into the Money", "text": "The Bada Bing Boys beat The Hart Foundation 126.20 to 98.28 and are 8-6, holding the sixth and final playoff spot. Trey McBride's 10 catches, 111 yards and a touchdown (29.10) did the damage, and Nils has left just 117.28 points on his bench all season, the cleanest lineup in the league. Lutz got Joe Burrow's 36.88 (four touchdowns in Cincinnati's comeback) and only 61.40 from everyone else, including Derrick Henry (5.90) and Isaiah Likely (3.20), the other half of the Maye trade. He has lost two straight and is still 10-4. Be nice."}, {"a": 3, "b": 7, "size": "brief", "score": [125.02, 85.3], "headline": "William Wins and Is Still the League's Unluckiest 10-4 Team", "text": "wjgallag beat Ain't No Kids Game 125.02 to 85.30 and sits at 10-4, but William is 6-1 against the median and only 4-3 head-to-head, tied with Nils for the biggest gap between how his team scores and how it wins. Quinshon Judkins (24.40, two rushing touchdowns) and Emanuel Wilson (20.50) carried the flex spots. Guad (5-9) started Saquon Barkley (15.10, a touchdown before a back injury) and Baltimore's defense (minus-3), while Mark Andrews (5.30) sat behind Roschon Johnson (1.30). His rookie Jeremiyah Love missed a second straight game. Guad left only 5.90 points on his bench, the cleanest sheet of the week, which was the one thing that went right."}], "sidebars": [{"title": "By the numbers", "items": ["**175.62**: Baskwell's score, the high of the week", "**78.04**: Go Birds' score, the low of the week", "**115.32**: the league median", "**246.98**: points left on benches across the league", "**2.54**: margin in the closest game, Bryce over Justin", "**749.64**: points scored by Justin's bench this season, the most in the league"]}], "sections": [{"title": "Storylines", "wide": true, "deck": "The threads we are following all season. Each week gets an update.", "items": ["**The Heel vs. the Field:** Bryce is 11-3 and leads the league in points (997.72) and total points (1,683.26, 165 clear of second place). He benched a 32-point quarterback this week and still won. The Maye and Pierce trades both went his way again.", "**The Race to 1.01:** Go Birds (962.24 total points) lead Guad (1,141.84) by 179.6 for the first pick, and the caddie duty that comes with it.", "**The Sixth Seed:** Nils (8-6) is one game clear of Brett and Schub (both 7-7) with seven weeks to play.", "**The Best 2-12 Team Ever:** Justin's roster has scored the third-most points in the league. His record is the second-worst. The bench is the story.", "**The Deadline:** Week 11, four weeks out. Everyone below the line is a seller, and everyone above it is shopping."]}, {"title": "League happenings", "wide": true, "items": ["**The trade:** On October 21 Bryce sent running back Dameon Pierce to Justin for a 2027 third-round pick. Pierce scored Monday night, on Justin's bench, then left the game in the fourth quarter with an undisclosed injury. Bryce kept the pick, kept the win, and feels fine.", "**Waivers:** Guad spent $15 of FAAB on Jahan Dotson (1.60 points, on his bench) and dropped Jameis Winston. Brett added running backs Dylan Sampson and Zonovan Knight. Justin picked up Carolina's defense, which scored minus-3 in a 43-13 loss.", "**Busiest manager:** Blake, with four waiver and free-agent moves in ten days. The pickups in his starting lineup scored 3.70 combined: Darius Cooper (2.70) and the Titans defense (1.00)."]}, {"title": "The playoff fight", "wide": true, "deck": "Six make it. Nils holds the last spot at 8-6, one game clear of Brett and Schub (both 7-7), with seven weeks to play.", "table": {"heads": ["#", "Team", "Record", "PF", "Vs. the line"], "rows": [["1", "**Hay Jay Maye All Day** (Bryce)", "11-3", "997.72", "+4"], ["2", "**wjgallag** (William)", "10-4", "925.52", "+3"], ["3", "**The Hart Foundation** (Lutz)", "10-4", "924.38", "+3"], ["4", "**e2weidaw** (Weidaw)", "9-5", "868.99", "+2"], ["5", "**Petey Jones..Running Back** (Blake)", "9-5", "858.10", "+2"], ["6", "**The Bada Bing Boys** (Nils)", "8-6", "938.56", "+1"], ["7", "FirstTuaWorst (Brett)", "7-7", "934.32", "1 back"], ["8", "schuby7 (Schub)", "7-7", "867.98", "1 back"], ["9", "Delicious Sugar Daddies (Baskwell)", "5-9", "918.86", "3 back"], ["10", "Ain't No Kids Game (Guad)", "5-9", "723.30", "3 back"], ["11", "Steve Stiffler (Justin)", "2-12", "767.04", "6 back"], ["12", "Go Birds (Bill 2.0)", "1-13", "593.32", "7 back"]]}}, {"title": "The luck meter", "deck": "Luck is head-to-head wins minus median wins. Negative means the schedule is working against you.", "table": {"heads": ["Team", "H2H", "Median", "Luck"], "rows": [["**William**", "4-3", "6-1", "-2 unlucky"], ["**Nils**", "3-4", "5-2", "-2 unlucky"], ["**Brett**", "3-4", "4-3", "-1"], ["**Baskwell**", "2-5", "3-4", "-1"]]}, "text": "William and Nils score like contenders (6-1 and 5-2 against the median) but have won only four and three head-to-head games. Nobody in the league is more than one win lucky."}, {"title": "Streaks", "items": ["**Bryce:** four straight head-to-head wins.", "**Brett:** three straight median wins, plus a sweep this week.", "**Weidaw:** a four-game head-to-head winning streak, snapped by Brett.", "**Lutz:** two straight losses, head-to-head and median.", "**Justin:** six straight head-to-head losses.", "**Bill 2.0:** still has not beaten the league median (0-7).", "**Baskwell:** snapped a five-game losing streak."]}, {"title": "Bench blunders", "deck": "Points left on the bench against the best possible lineup. IR and taxi players never count.", "table": {"heads": ["Week 7", "Left on bench"], "rows": [["**Schub**", "49.72"], ["**Brett**", "32.28"], ["**Bryce**", "26.82"], ["**Weidaw**", "23.02"], ["**Justin**", "22.80"]]}, "items": ["**Season leader:** Brett, 234.14 points (33.45 a week), then Schub (228.48) and Justin (215.22).", "**Cleanest lineups:** Nils (117.28), Lutz (129.14) and Blake (131.98)."]}, {"title": "Draft watch: the race for 1.01", "wide": true, "deck": "Teams outside the playoff line, fewest total points (starters plus bench) pick first. Whoever lands 1.01 caddies for the champ.", "table": {"heads": ["Pick", "Team", "Total pts"], "rows": [["1.01", "**Go Birds** (Bill 2.0)", "962.24"], ["1.02", "**Ain't No Kids Game** (Guad)", "1,141.84"], ["1.03", "**Delicious Sugar Daddies** (Baskwell)", "1,331.14"], ["1.04", "**schuby7** (Schub)", "1,486.10"], ["1.05", "**FirstTuaWorst** (Brett)", "1,507.36"], ["1.06", "**Steve Stiffler** (Justin)", "1,516.68"]]}, "text": "Go Birds lead the race to the bottom by 179.6 points over Guad. Justin's 2-12 record would only land him 1.06, because his bench scores so much. Bad lineup, decent roster, no draft capital."}, {"title": "This week in league history", "items": ["**2018:** Baskwell and Kane finished in a 122-122 tie in Week 7.", "**2010:** Weidaw put up 188 on Lutz, still the highest Week 7 score on record.", "**2012:** Nils scored 57 in Week 7, the lowest score of any Week 7 in league history.", "**2025:** Go Birds took the biggest loss ever recorded, 133.72, in Brett's record-setting 231.64 night."]}, {"title": "Records watch", "text": "Baskwell's 175.62 is the 97th-highest score in league history out of 2,642 (his Week 1 score of 210.16 is 7th). The 97.58-point margin over Go Birds is the 18th largest ever. Bryce is averaging 142.5 points a week; Brett's 2025 season record of 2,299.7 works out to 164.3 a week."}, {"title": "Rookie report", "items": ["**Caleb Douglas (Lutz):** two catches, two touchdowns, including a 63-yarder, in Miami's win over the Jets. 21.00 points, and the difference between 98 and 77.", "**Omar Cooper Jr. (Justin):** five catches for 115 yards in the Jets' loss, 24.50 at flex. The one lineup decision Justin got right.", "**Makai Lemon (Bill 2.0):** first NFL touchdown, on the bench. See above.", "**Jeremiyah Love (Guad):** the No. 3 overall pick missed a second straight game with a high-ankle sprain. Arizona is not talking about IR.", "**Carnell Tate (Schub):** five catches for 69 yards in Tennessee (9.90), on a bench that was already loaded."]}, {"title": "Trade deadline pressure", "wide": true, "text": "The deadline is Week 11, four weeks away. **Buyers:** Bryce, William, Lutz, Weidaw, Blake and Nils, all inside the line. **The bubble:** Brett and Schub, at 7-7, rank fourth and fifth in total points and have no excuse to sell. **Sellers:** Guad, Baskwell, Justin and Bill 2.0, a combined 13-43, who should be shopping for 2027 picks.\n\n**Dynasty windows:** Nils has the oldest roster in the league (average age 28.3, with eight players 29 or older, including Kirk Cousins at 38), so it is now or never. Justin's veterans (Aaron Rodgers 42, Travis Kelce 37, Keenan Allen 34, Dak Prescott 33) are cash he should be spending. Bill 2.0 owns eight rookies and the 1.01 spot: the league's most obvious rebuild."}], "awards": [{"label": "Manager of the Week", "team": 2, "text": "175.62, the best score of the week, a five-game skid snapped, and a 97.58-point margin."}, {"label": "Lineup Genius", "team": 7, "text": "Only 5.90 points left on the bench, the cleanest sheet of the week, in a loss. The veterans were fine. The veterans were not enough."}, {"label": "Bench Blunder of the Week", "team": 6, "text": "49.72 points left on the bench, including 38.50 from Tony Pollard, and he still won. Nobody should be allowed to do that."}, {"label": "The Howie Roseman Award", "team": 9, "text": "Benched a 32-point quarterback, lost the median game, traded away the back who scored for the other side, and won by 2.54. Nobody walks away feeling good."}, {"label": "Unluckiest Manager", "team": 3, "text": "10-4 with a 6-1 median record and only four head-to-head wins."}]}, "8-recap": {"date": "Tuesday, November 3, 2026", "title": "SCHUB DROPS 197, GRABS THE SIXTH SEED; THE BOTTOM GETS AN ODD COUPLE", "deck": "Four teams are tied at 9-7 for two playoff spots, Lamar Jackson is headed to IR, and Nils’s bench outscored Weidaw’s lineup.", "intro": "Welcome back. Week 8 produced a 197.54 that ranks 21st in league history, a 63.70 that is the second-lowest score of the Sleeper era, a four-way tie at 9-7 for the last two playoff spots, and **226.40 points** left on benches across the league.\n\nA reminder that records count both the weekly head-to-head and the league-median game. The roasts are for lineups, not for people.", "stories": [{"a": 6, "b": 3, "size": "lead", "score": [197.54, 117.26], "tag": "Week high", "headline": "Schub Drops 197.54, Sits Pollard Again, and Takes the Sixth Seed", "deck": "The autodraft is on a heater, and it is doing something rude to the standings.", "text": "schuby7 hung 197.54 on wjgallag, the highest score in the league this week and the 21st-best in league history. Schub (9-7) has now won three straight and climbed from 5-7 to the sixth seed in two weeks. Patrick Mahomes remembered he is Patrick Mahomes (32.44, in a 28-24 loss to Denver), Tee Higgins went for **39.50** (10 catches, 155 yards and two touchdowns in Cincinnati’s overtime shootout), Michael Wilson added 28.80 in Arizona’s overtime comeback in Dallas, and Harold Fannin Jr. and Jaylen Warren chipped in 25.40 and 23.30. We are obligated to report this. We are not obligated to enjoy it.\n\n**How it could have gone better:** it could have been absurd. Tony Pollard (30.70, 117 yards and two touchdowns against Cincinnati) sat on the bench for the second straight week after 38.50 last Sunday. That is 69.20 points in two weeks left on the pine, and Schub still left 25.50 on the bench this week and leads the league for the season at 253.98. A perfect lineup scores 223.04. The robot is not a good manager. The robot is a lucky one.\n\n**For William:** 117.26 would have beaten five of the other 11 teams this week, and he lost anyway. He is 10-6 and still the league’s unluckiest good team, 6-2 against the median and 4-4 head-to-head. He lost the median game too this time, so there is no hiding behind the schedule: Emanuel Wilson’s zero at flex was the culprit, with Michael Mayer (10.30) sitting on the bench."}, {"a": 10, "b": 11, "size": "feature", "score": [112.16, 75.78], "tag": "Odd couple", "headline": "The Odd Couple at the Bottom: One Lineup, One Roster, Two Wins Each", "deck": "Go Birds and Steve Stiffler are tied for last at 2-14, and no two managers have ever been less alike.", "text": "Go Birds beat Steve Stiffler 112.16 to 75.78 in what was, technically, the Basement Bowl, and the two teams now share a 2-14 record. On paper, they are the same team. In every other way they are opposites: the tech nerd and the ballplayer, the Eagles diehard and the guy with the veterans, eight rookies on one side and Aaron Rodgers (42) and Travis Kelce (37) on the other.\n\nThey are also each other’s missing half. Bill 2.0 started the cleanest lineup in the league this week, leaving only **3.80** points on his bench, and owns the weakest roster by 266.54 total points. Justin owns the fifth-most total points in the league (1,642.06) and left a league-high **33.82** on his bench, starting Aaron Rodgers (4.88) over Dak Prescott (21.80) for the second week in a row. Combine them and you have a contender. Separately, you have a very nice 2-14.\n\nThe Eagles lost their sixth straight Sunday night, which both managers can agree is bad and one of them takes personally. Bill 2.0 has won two of his last three, started Makai Lemon this time (11.70), and got Cam Ward’s best game of the season (31.26 on 304 yards and two touchdowns). Congratulations to him and his family on the newest addition. The lineup is the only thing getting roasted in that house.\n\nJustin has lost seven straight head-to-head games, three short of the league record of 10 shared by Blake (2018) and the Go Birds (across 2025 and 2026). His bench has scored 799.24 points this season, the most in the league and 95 percent of what his starters have scored."}, {"a": 4, "b": 9, "size": "feature", "score": [63.7, 149.36], "tag": "Trade watch", "headline": "Blake Buys Malik Washington, Benches Him, and Bryce Collects Another Pick", "deck": "Lamar Jackson heads for IR, Zay Flowers goes zero, and the villain keeps winning.", "text": "Petey Jones..Running Back put up 63.70, the lowest score in the league this week and the second-lowest of the Sleeper era (only Guad’s 60.66 in Week 2 was worse). Much of it was out of Blake’s hands: Lamar Jackson left Baltimore’s 36-10 loss to Buffalo early and is headed to injured reserve, so his quarterback scored zero, and Zay Flowers added a second zero in the same game. Blake has had worse weeks, but we are struggling to name one.\n\n**Where he did have a say:** Blake acquired receiver Malik Washington from Bryce this week for a 2029 second-round pick, then started Flowers (0.00) over him while Washington posted a season-high 15.00 in Miami’s loss to New England. The Raiders defense he picked up added 6.00, and tight end Greg Dulcich (8.30) sat on the bench. He made four more moves on the wire this week. The wire was not the problem.\n\nBryce, meanwhile, put up 149.36, collected the pick, and started Drake Maye this time (26.46, with two touchdown passes of 40-plus yards and a rushing score) so nobody had to get benched. He is 13-3 with five straight head-to-head wins and leads the league in points and total points (1,887.76, 88.44 clear of Nils). It is the second trade in two weeks that ended with Bryce smiling. We keep writing it down because someone has to."}, {"a": 5, "b": 7, "size": "feature", "score": [147.18, 132.0], "tag": "Playoff race", "headline": "Brett Holds Off Guad by 15.18 to Keep a Playoff Seat", "deck": "Guad scored above the median and still lost the matchup, the cruelest way to be a seller.", "text": "FirstTuaWorst beat Ain’t No Kids Game 147.18 to 132.00 and stays in the fifth seed at 9-7, one of four teams tied for the last two spots. Brock Bowers (28.20, in Las Vegas’s 38-33 win over the Jets), Jaxon Smith-Njigba (25.80) and Jacksonville’s defense (21.00, in a 42-7 rout of Indianapolis) did the work. Brett has won two straight head-to-head games and four straight median games, and left just 10.80 on the bench, his cleanest week of the season.\n\nGuad got 25.90 from Chuba Hubbard, 25.40 from Trevor Lawrence (three touchdowns in that same Jacksonville rout) and 20.90 from Matthew Golden, and still lost by 15.18 after starting Jeremiyah Love (2.30) over Chris Rodriguez Jr. (12.80). He is 6-10 and three games out of the final spot.\n\nBrett, who we know reads this: you won. Enjoy it. The Rumor Mill is below."}, {"a": 1, "b": 2, "size": "brief", "score": [135.18, 115.18], "headline": "Burrow Throws Six Touchdowns, Lutz Wins by 20, and the Bandman Stays Stuck", "text": "The Hart Foundation beat Delicious Sugar Daddies 135.18 to 115.18 and sits at 12-4, the second seed. Joe Burrow supplied 51.48 of it with six touchdowns (including the winning rush in overtime) and three interceptions against Tennessee. Lutz left 15.60 on his bench, mostly because Green Bay’s defense (14.00) sat while Cincinnati’s (4.00) played. Baskwell is the one to feel for: seventh in the league in points (1,034.04), 10th in the standings (5-11), starting Tre Tucker (0.00) with DJ Moore (16.60) on the bench, even with D’Andre Swift’s three Monday-night touchdowns (27.90). The Bandman deserves better."}, {"a": 8, "b": 12, "size": "brief", "score": [158.76, 99.32], "headline": "Nils’s Bench Outscores Weidaw’s Entire Lineup", "text": "The Bada Bing Boys beat e2weidaw 158.76 to 99.32 and are 10-6, the third seed, on a two-game winning streak. Nils’s bench alone scored **122.10** points, more than Weidaw’s starters did. Josh Allen (30.56), Ja’Marr Chase (33.10) and Jonah Coleman (21.40) did the real work, quietly, as always. Weidaw (9-7, two straight losses) got 38.10 from Tyler Allgeier and still lost by 59.44. He started Jake Ferguson (0.00) at tight end for the second week in a row with Darnell Washington (12.40) on the bench, and he fell out of the playoff picture on a points-for tiebreaker."}], "sidebars": [{"title": "By the numbers", "items": ["**197.54**: Schub’s score, the high of the week and 21st all-time", "**63.70**: Blake’s score, the low of the week", "**124.63**: the league median", "**226.40**: points left on benches across the league", "**15.18**: margin in the closest game, Brett over Guad", "**122.10**: points scored by Nils’s bench, more than Weidaw’s entire lineup"]}], "sections": [{"title": "Storylines", "wide": true, "deck": "The threads we are following all season. Each week gets an update.", "items": ["**The Heel vs. the Field:** Bryce is 13-3 with five straight head-to-head wins and 1,887.76 total points, 88.44 clear of Nils. He started Drake Maye this time and nobody had to be benched. He also took a 2029 second-round pick from Blake for a receiver who then posted a season-high on Blake’s bench.", "**The Race to 1.01:** Go Birds (1,083.70 total points) lead Guad (1,350.24) by 266.54. Justin is also 2-14 but sits sixth in the draft race at 1,642.06. The last-place caddie duty belongs to Bill 2.0 for now.", "**Four Teams, Two Spots:** Brett, Schub, Weidaw and Blake are all 9-7 for the final two playoff seats. Points for is the tiebreaker, and right now it puts Brett and Schub in.", "**The Odd Couple:** Go Birds and Justin are tied for last at 2-14. One has the cleanest lineup in the league and no roster. The other has a good roster and no lineup.", "**The Deadline:** Week 11, three weeks out. The four-way logjam is the story: somebody at 9-7 has to decide whether to buy or hold."]}, {"title": "League happenings", "wide": true, "items": ["**The trade:** Blake sent a 2029 second-round pick to Bryce for receiver Malik Washington. Washington posted 15.00 on Blake’s bench and Bryce kept the pick. That is two trades with Bryce in two weeks that ended with Bryce smiling.", "**Waivers:** Weidaw spent $5 of FAAB on Elijah Mitchell (7.70, on his bench). Justin added Sione Vaki (8.00 as a starter). Lutz added Marquise Brown (3.70, on his bench).", "**Busiest manager:** Blake, again, with four more moves: tight end Greg Dulcich (8.30, bench) and the Raiders defense (6.00, started). Brett swapped Christian Kirk for tight end Mason Taylor (4.90, bench)."]}, {"title": "The playoff fight", "wide": true, "deck": "Top six make it. Four teams are tied at 9-7 for the last two seats, and points for breaks the tie: Brett (1,081.50) and Schub (1,065.52) are in, Weidaw (968.32) and Blake (921.80) are out. Six weeks to play.", "table": {"heads": ["#", "Team", "Record", "PF", "Vs. the line"], "rows": [["1", "**Hay Jay Maye All Day** (Bryce)", "13-3", "1,147.08", "+4"], ["2", "**The Hart Foundation** (Lutz)", "12-4", "1,059.56", "+3"], ["3", "**The Bada Bing Boys** (Nils)", "10-6", "1,097.32", "+1"], ["4", "**wjgallag** (William)", "10-6", "1,042.78", "+1"], ["5", "**FirstTuaWorst** (Brett)", "9-7", "1,081.50", "on the line, in"], ["6", "**schuby7** (Schub)", "9-7", "1,065.52", "on the line, in"], ["7", "e2weidaw (Weidaw)", "9-7", "968.32", "tied, out on points"], ["8", "Petey Jones..Running Back (Blake)", "9-7", "921.80", "tied, out on points"], ["9", "Ain’t No Kids Game (Guad)", "6-10", "855.30", "3 back"], ["10", "Delicious Sugar Daddies (Baskwell)", "5-11", "1,034.04", "4 back"], ["11", "Steve Stiffler (Justin)", "2-14", "842.82", "7 back"], ["12", "Go Birds (Bill 2.0)", "2-14", "705.48", "7 back"]]}}, {"title": "The luck meter", "deck": "Luck is head-to-head wins minus median wins. Negative means the schedule is working against you.", "table": {"heads": ["Team", "H2H", "Median", "Luck"], "rows": [["**Bill 2.0**", "2-6", "0-8", "+2 lucky"], ["**William**", "4-4", "6-2", "-2 unlucky"], ["**Nils**", "4-4", "6-2", "-2 unlucky"], ["**Brett**", "4-4", "5-3", "-1"], ["**Baskwell**", "2-6", "3-5", "-1"]]}, "text": "Bill 2.0 has won two games without beating the median once (0-8), which makes him the luckiest manager in the league. William and Nils are the opposite: 10-6 teams that win the scoreboard far more often than the schedule lets them."}, {"title": "Streaks", "items": ["**Bryce:** five straight head-to-head wins.", "**Schub:** three straight head-to-head wins, from 5-7 to the playoff line.", "**Brett:** four straight median wins and two straight head-to-head wins.", "**Nils:** two straight wins and the third seed.", "**Justin:** seven straight head-to-head losses, three short of the league record of 10.", "**Weidaw and Blake:** two straight losses each, and both just fell out of the playoff seats.", "**Bill 2.0:** 0-8 against the median, the only team without a median win."]}, {"title": "Bench blunders", "deck": "Points left on the bench against the best possible lineup. IR and taxi players never count.", "table": {"heads": ["Week 8", "Left on bench"], "rows": [["**Justin**", "33.82"], ["**Blake**", "31.26"], ["**Schub**", "25.50"], ["**Weidaw**", "24.10"], ["**Baskwell**", "23.10"]]}, "items": ["**Season leader:** Schub moves into first with 253.98 points left on the bench (31.75 a week), ahead of Brett (244.94) and Justin (242.64).", "**Pollard watch:** Schub has now benched Tony Pollard for 38.50 and 30.70 in back-to-back weeks. That is 69.20 points.", "**Cleanest lineups:** Guad (120.88 for the season), Lutz (144.74) and Nils (152.90). Go Birds left just 3.80 this week, the best in the league."]}, {"title": "Draft watch: the race for 1.01", "wide": true, "deck": "Teams outside the playoff line, fewest total points (starters plus bench) pick first. Whoever lands 1.01 caddies for the champ.", "table": {"heads": ["Pick", "Team", "Total pts"], "rows": [["1.01", "**Go Birds** (Bill 2.0)", "1,083.70"], ["1.02", "**Ain’t No Kids Game** (Guad)", "1,350.24"], ["1.03", "**Petey Jones..Running Back** (Blake)", "1,444.18"], ["1.04", "**Delicious Sugar Daddies** (Baskwell)", "1,498.52"], ["1.05", "**e2weidaw** (Weidaw)", "1,547.26"], ["1.06", "**Steve Stiffler** (Justin)", "1,642.06"]]}, "text": "Go Birds lead the race by 266.54 points. The twist is the middle of the board: two of the six picks belong to 9-7 teams that are on the wrong side of a tiebreaker. If the season ended today, Blake would pick third and Weidaw fifth."}, {"title": "This week in league history", "items": ["**2024:** Nils scored 214.54 in Week 8, the highest Week 8 score on record.", "**2021:** Bryce and Weidaw finished a Week 8 game in a 150-150 tie.", "**2011:** the lowest Week 8 score on record, 50, belonged to Bryce. Every villain has an origin story.", "**2026:** Guad’s 60.66 in Week 2 is still the lowest score of the Sleeper era. Blake’s 63.70 this week is second."]}, {"title": "Records watch", "text": "Schub’s 197.54 ranks 21st among 2,654 scores in league history. Blake’s 85.66-point loss is the 42nd-largest margin ever. Justin’s seven straight head-to-head losses are three short of the league record of 10, set by Blake in 2018 and matched by Go Birds across 2025 and 2026. Bryce is averaging 143.4 points a week; Brett’s 2025 season record of 2,299.7 works out to 164.3 a week."}, {"title": "Rookie report", "items": ["**Jonah Coleman (Nils):** the Broncos rookie ran his way to 21.40 at flex in Denver’s 28-24 comeback over Kansas City.", "**Makai Lemon (Bill 2.0):** started this time and delivered 11.70 in the Eagles’ sixth straight loss. Progress.", "**Jeremiyah Love (Guad):** back in Arizona’s lineup after his ankle injury and started at flex for 2.30. Welcome back.", "**Omar Cooper Jr. (Justin):** a zero in the Jets’ loss at Las Vegas while Gunnar Helm (14.60) sat. Justin’s rookie, Justin’s call.", "**Carnell Tate (Schub):** missed Tennessee’s overtime loss to Cincinnati. Cam Ward still threw for 304 yards without him."]}, {"title": "Trade deadline pressure", "wide": true, "text": "The deadline is Week 11, three weeks away. **Buyers:** Bryce, Lutz, Nils and William, comfortably in. **The four-way bubble:** Brett, Schub, Weidaw and Blake, all 9-7, have to decide whether to buy or hold with two seats up for grabs. Schub and Brett, third and fourth in total points, look like buyers. **Sellers:** Guad, Baskwell, Justin and Bill 2.0, a combined 15-49, with picks to collect.\n\n**Dynasty windows:** Nils has the oldest roster in the league (average age 27.5, with eight players 29 or older, including Kirk Cousins at 38), so for him it is now. Weidaw’s veterans (Christian McCaffrey, Aaron Jones, and Davante Adams, 33 and on IR) are the natural pieces of a firesale if he slips further. Blake loses Lamar Jackson to IR and has a quarterback decision to make. Bill 2.0 has eight rookies and the 1.01 spot: a rebuild with a plan."}], "rumors": {"title": "The Rumor Mill", "deck": "Sources say a lot of things. We print all of them.", "items": [{"heat": 3, "source": "someone who has seen Weidaw’s bench", "headline": "Weidaw Firesale Possible", "text": "After a second straight loss and a tumble out of the playoff seats, Weidaw is reportedly open to moving veterans. Christian McCaffrey, Aaron Jones and an injured Davante Adams are said to be on the table, and the asking price is described as a lot of 2027 picks and a tight end who scores."}, {"heat": 3, "source": "a Guad associate, loudly", "headline": "Guad Fielding Offers for Saquon and Golden", "text": "Guad is taking calls on Saquon Barkley and Matthew Golden, a pair of big names he does not usually sell. Buyers want a discount on Barkley, whose 12.40 this week kept him in the lineup but not in the conversation. Guad wants a lot more than a discount."}, {"heat": 2, "source": "someone Nils did not text back", "headline": "Blake Wants a Quarterback; Nils Has Four", "text": "With Lamar Jackson headed to injured reserve, Blake has reportedly asked about one of the spare quarterbacks on Nils’s bench, where Kirk Cousins (34.18), Geno Smith (22.00) and Sam Darnold (21.52) outscored a lot of starters this week. Nils has not responded. He moves in silence."}, {"heat": 1, "source": "a taxi squad", "headline": "Brett Shopping His Rookies", "text": "Brett has three rookies stashed on the taxi squad (Ty Simpson, Chris Bell and Bryce Lance) and is reportedly willing to move them for a veteran who plays. He is said to be asking for a lot."}]}, "awards": [{"label": "Manager of the Week", "team": 6, "text": "197.54, the high of the week and 21st all-time. We would like to say we are happy for him."}, {"label": "Lineup Genius", "team": 10, "text": "Only 3.80 points left on the bench, the cleanest lineup in the league, and a win."}, {"label": "Bench Blunder of the Week", "team": 11, "text": "33.82 points left on the bench, starting Aaron Rodgers (4.88) over Dak Prescott (21.80) for the second week in a row."}, {"label": "Villain of the Week", "team": 9, "text": "An 85.66-point win, a 2029 second-round pick, and Drake Maye in the lineup. We hate it here."}, {"label": "Roughest Week", "team": 4, "text": "63.70, the second-lowest score of the Sleeper era, and no Lamar Jackson going forward."}], "lookAhead": {"title": "Look ahead: Week 9", "deck": "League-wide. This week’s data did not include the pairings, so we are watching the races.", "items": [{"tag": "Playoff line", "headline": "Four teams, two seats", "text": "Brett, Schub, Weidaw and Blake are all 9-7 with six weeks to play. Points for is the tiebreaker, so the biggest scores in the next few weeks decide who is in."}, {"tag": "The race for 1.01", "headline": "Go Birds hold the pole", "text": "Go Birds lead Guad by 266.54 total points for 1.01. Justin sits sixth at 1,642.06; start his best lineup and he climbs away from the top pick and toward some wins."}, {"tag": "Streaks", "headline": "Bryce’s five, Justin’s seven", "text": "Bryce is riding five straight head-to-head wins. Justin has seven straight losses, three short of the league record of 10. One of those streaks has to end soon."}, {"tag": "Records", "headline": "The scoring record and the losing streak", "text": "Bryce is on pace to finish about 290 points short of Brett’s season scoring record. Justin has to lose three more in a row to tie the league’s longest losing streak."}, {"tag": "Deadline", "headline": "Three weeks", "text": "The deadline is Week 11. Expect the Rumor Mill to get louder, and its report card to get embarrassing for someone."}]}}}};
