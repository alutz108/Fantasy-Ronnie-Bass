/* ---------- Trade Finder ---------- */
// Pick a player and the Finder builds trades around him with the other teams, using the Trade Machine's own values, team modes,
// lineup numbers and roster checks, so a trade called fair here is called fair in the Machine too.
//   Shop him: for every other team, the best package that team could send back for him.
//   Get him:  the best ways for one team to pay for him.
const TF = { junk: 0.06, topShare: 1 / 3, pre: 60, keep: 5, keepGet: 10, show: 3, accept: -0.05, tiny: 150, nodes: 60000, needGain: 3 };
const tfPts = (n) => (n >= 0 ? "+" : "\u2212") + Math.abs(n).toFixed(1);
const TF_POS = { QB: ["quarterback", "quarterbacks", "QBs"], RB: ["running back", "running backs", "RBs"], WR: ["receiver", "receivers", "WRs"], TE: ["tight end", "tight ends", "TEs"] };
const TF_FLEX = { FLEX: ["RB", "WR", "TE"], WRRB_FLEX: ["RB", "WR"], REC_FLEX: ["WR", "TE"], SUPER_FLEX: ["QB", "RB", "WR", "TE"] };

// the trade value another team can send and still leave the trade inside the "slight edge" line (the Machine's own 15% cut-off)
function tfBounds(P) { const r = TM.gap[1] / 2; return { lo: P.mkt * (1 - r) / (1 + r), hi: P.mkt * (1 + r) / (1 - r) }; }

/* ---- what each team needs ---- */
// what a starter-level player at each position scores, so we can ask "how many points would one more starter add?"
function tfStarterLevel(D) {
  const out = {};

  else if (R.state === "none") body = `<p class="tm-hint muted">I couldn\u2019t find an even trade for ${esc(R.P.name)}${f.picks ? "" : " without draft picks. Try including them"}.</p>`;
  else {
    const groups = R.groups.map((g) => ({ ...g, offers: f.only ? g.offers.filter(isBig) : g.offers })).filter((g) => g.offers.length), total = groups.reduce((n, g) => n + g.offers.length, 0), fill = R.results.filter(isBig).length;
    const first = f.goal === "get" ? 6 : TF.show;
    const sections = groups.map((g) => {
      const shown = S.fmore[g.T] ? g.offers : g.offers.slice(0, first), rest = g.offers.length - shown.length;
      const head = f.goal === "get" ? "" : `<header class="tf-teamh"><h4>${esc(tmWho(D, g.T))} <span class="muted">(${esc(tmTeam(D, g.T).name)})</span></h4>${tfChips(D, R.needs, g.T, true).map(tfChipHtml).join(" ")}<span class="tm-small muted">${g.offers.length} offer${g.offers.length === 1 ? "" : "s"}</span></header>`;
      return `<section class="tf-team">${head}<div class="tf-grid">${shown.map((r) => tfCard(S, D, f, R.P, r)).join("")}</div>${rest > 0 ? `<button class="btn tf-more" data-tm="f-more" data-rid="${g.T}">Show ${rest} more offer${rest === 1 ? "" : "s"}${f.goal === "get" ? "" : " from " + esc(tmWho(D, g.T))}</button>` : ""}</section>`;
    }).join("");
    body = !total ? `<p class="tm-hint muted">None of the ${R.results.length} offers fill a big need. Switch Show back to All offers to see them.</p>`
      : `${dl}<p class="tm-small muted">${f.goal === "get" ? `${total} way${total === 1 ? "" : "s"} to get ${esc(R.P.name)} from ${esc(tmWho(D, R.O))}` : `${total} offer${total === 1 ? "" : "s"} from ${groups.length} team${groups.length === 1 ? "" : "s"} for ${esc(R.P.name)}, best teams first`}. ${fill ? `<strong>${fill}</strong> fill${fill === 1 ? "s" : ""} a big need and ${fill === 1 ? "is" : "are"} highlighted. ` : ""}Every trade looks fair to both sides in each team\u2019s mode.</p>${sections}
      <details class="tm-help"><summary>How are these picked?</summary><p>I look through every player and pick the other team could send, in any number, and keep every package that lands inside the Machine\u2019s fair or slight-edge range (within about 15% of his trade value). Each trade has to look fair to both teams in their own mode (Win now, Balanced or Rebuild), fit both rosters and stay inside the league\u2019s position limits. The biggest piece has to be at least a third of his price, so a pile of small pieces never stands in for one big piece. Offers that fill a team\u2019s biggest gap (like having no running backs) or give a rebuilding team a first-round pick are highlighted in green and ranked higher. Smaller helps show as quiet notes. Offers that would leave a team with a hole are flagged.</p></details>`;
  }
  html += `<section class="card tm-step"><h3><span class="tm-num">3</span> ${f.goal === "get" ? "Ways to get him" : "Offers"}</h3>${body}</section>`;
  return html;
}

/* ---------- Trade Grades ---------- */
// A letter for each team in a trade, an overall verdict and a one-line reason, using the Trade Machine's own values.
// Graded on TODAY'S values, so a player who has risen or fallen since the trade counts. A traded pick counts as the player it became.
const TG = { years: null, faab: 12, def: 100 };   // years: null = the current season only; faab: trade value of one FAAB dollar; def: what a defence is worth

// how a side did: s is (what it got - what it gave) divided by the average of the two sides. The same measure the Machine's verdicts use.
function tgLetter(s) {
  if (s >= 0.45) return "A+";
  if (s >= 0.30) return "A";
  if (s >= 0.15) return "A-";
  if (s >= TM.gap[0]) return "B+";
  if (s > -TM.gap[0]) return "B";
  if (s > -0.15) return "B-";
  if (s > -0.30) return "C+";
  if (s > -0.45) return "C";
  if (s > -0.60) return "C-";
  if (s > -0.80) return "D";
  return "F";
}
const tgShow = (g) => g.replace("-", "\u2212");                 // a real minus sign
const tgClass = (g) => "tg-" + g[0];
const tgSeasons = (cx) => (TG.years || [Math.max(...cx.seasons.map((s) => s.year))]);

// the value of every item a side received. Returns null for a piece that can't be valued.
function tgItemValue(D, g, raw) {
  const env = D.env, known = (a) => a && (a.hasMarket || (a.parts && a.parts.lg != null));
  if (g.kind === "player") {
    const a = env.lookup(g.text, g.pos);
    if (known(a)) return { label: g.text, value: a.mkt, pos: g.pos };
    return { label: g.text, value: g.pos === "DEF" ? TG.def : null, pos: g.pos };          // a defence is worth next to nothing here
  }
  if (g.kind === "pick") {
    if (g.resolved) { const a = env.lookup(g.resolved.player, g.resolved.pos); return { label: `${g.text} (became ${g.resolved.player})`, short: g.resolved.player, value: known(a) ? a.mkt : null, pick: true, became: g.resolved.player }; }
    const m = String(g.text).match(/(20\d\d)\s*Round\s*(\d)/i); if (!m) return { label: g.text, value: null, pick: true };
    const y = Number(m[1]), r = Number(m[2]), a = raw && raw.o != null ? D.assets.get(`k:${y}-${r}-${raw.o}`) : null;
    return { label: g.text, value: a ? a.mkt : env.pickMid(y, r), pick: true, future: true };
  }
  const m = String(g.text).match(/\$(\d+)/); return { label: g.text, value: m ? Number(m[1]) * TG.faab : null, faab: true };
}

function tgGrade(cx, D, t) {
  if (t.sides.length !== 2) return { skip: "multi" };
  const rawT = (cx.data.trades || []).find((x) => x.id === t.id);
  const sides = t.sides.map((s, si) => {
    const items = s.got.map((g, gi) => tgItemValue(D, g, rawT && rawT.sides[si] && rawT.sides[si].got[gi]));
    const known = items.filter((i) => i.value != null);
    const team = D.teams.find((x) => x.id === s.r);
    return { r: s.r, mgr: (s.managerId && cx.name(s.managerId)) || s.team, team: s.team, items, get: known.reduce((a, i) => a + i.value, 0), unknown: items.length - known.length, window: team && team.autoWindow };
  });
  if (sides.some((s) => s.unknown > 0) || sides.every((s) => !s.items.length)) return { skip: "values" };
  const [a, b] = sides, avg = (a.get + b.get) / 2 || 1;
  a.s = (a.get - b.get) / avg; b.s = -a.s;
  sides.forEach((s) => { s.grade = tgLetter(s.s); });
  const gap = Math.abs(a.s), hi = a.get >= b.get ? a : b, lo = hi === a ? b : a;
  const key = gap < TM.gap[0] ? "fair" : gap < TM.gap[1] ? "edge" : gap < TM.gap[2] ? "lop" : "rob";
  return { sides, key, gap, hi, lo, note: tgContext(key, lo) };
}

// the one thing worth saying beyond the letters: real context that the numbers hide
function tgContext(key, lo) {
  if (key !== "fair" && lo.window === "reb" && lo.items.some((i) => i.pick)) return `${lo.mgr} is rebuilding, so the picks help more than the numbers say.`;
  return "";
}

// the cache is thrown away whenever the Trade Machine's values change
const tgCache = { key: "", map: new Map() };
function tgGet(cx, D, t) {
  const key = D.loadedAt + ":" + tmS.useLeague;
  if (tgCache.key !== key) { tgCache.key = key; tgCache.map = new Map(); }
  if (!tgCache.map.has(t.id)) { let g; try { g = tgGrade(cx, D, t); } catch (e) { g = { skip: "error" }; } tgCache.map.set(t.id, g); }
  return tgCache.map.get(t.id);
}

// shown inside each trade card on the Trades page (current season only)
function tgHtml(cx, t) {
  if (!tgSeasons(cx).includes(t.ls)) return "";
  if (!tmS.started && !tmS.data) { tmCtx = cx; tmS.started = true; setTimeout(() => tmLoad(cx), 0); }
  const D = tmS.data;
  if (!D) return tmS.error ? "" : `<div class="tg tg-wait" role="status">Grading on today\u2019s values\u2026</div>`;
  const g = tgGet(cx, D, t);
  if (g.skip === "multi") return `<div class="tg"><p class="tg-over muted">Not graded: this was a trade between three or more teams.</p></div>`;
  if (g.skip) return `<div class="tg"><p class="tg-over muted">Not graded: some of these players don\u2019t have a trade value yet.</p></div>`;
  const chip = (s) => `<span class="tg-g"><span class="tg-mgr">${esc(s.mgr)}</span><span class="tg-l ${tgClass(s.grade)}" aria-label="Grade ${esc(tgShow(s.grade))}">${esc(tgShow(s.grade))}</span></span>`;
  return `<div class="tg"><div class="tg-grades">${g.sides.map(chip).join("")}</div>${g.note ? `<p class="tg-over tg-ctx">${esc(g.note)}</p>` : ""}</div>`;
}

// a short note above the list when any trade on screen is graded
function tgNote(cx, shown) {
  if (!shown.some((t) => tgSeasons(cx).includes(t.ls)) || !tmS.data) return "";
  return `<p class="note tg-note">Grades show how each ${tgSeasons(cx).join(", ")} trade looks on today\u2019s trade values from the <a href="#trade">Trade Machine</a>, so players who have risen or fallen since count. They are estimates for fun, not verdicts.</p>`;
}

/* ---------- Draft Order ---------- */
// The next rookie draft, all rounds, with traded picks. The order follows the handbook's rule for the 2027 draft:
//   1-6    teams outside the playoffs, by total team points (starters plus bench). Fewest points picks first.
//   7-8    playoff teams knocked out in round 1 (the lowest seed to lose gets 7)
//   9-10   the 3rd place game: loser 9, winner 10
//   11-12  the championship game: loser 11, champion 12
const DO = { started: false, loading: false, error: "", data: null, year: null, at: 0, retried: 0 };
const doPad = (n) => String(n).padStart(2, "0");

// which draft is next, and which season's results decide its order
function doInfo(cx) {
  const years = (cx.seasons || []).map((s) => s.year).filter(Number.isFinite);
  if (!years.length) return null;
  const latest = Math.max(...years), upcoming = draftOf(cx, latest) ? latest + 1 : latest;
  const season = cx.seasons.find((s) => s.year === upcoming - 1) || null;
  return season ? { latest, upcoming, season } : null;
}

// the six playoff teams, in the order they will pick (7 to 12), from what has happened in the bracket so far
function doPlayoffOrder(seeded, bracket) {
  const seedOf = (id) => (seeded.find((t) => t.id === id) || {}).seed;
  const worstFirst = (ids) => [...ids].sort((a, b) => seedOf(b) - seedOf(a));
  const chalk = worstFirst(seeded.map((t) => t.id));                       // if the better seed always wins, the worst seed picks first
  const out = { ids: chalk, final: chalk.map(() => false) };
  if (seeded.length !== 6 || !Array.isArray(bracket) || !bracket.length) return out;
  const known = new Set(seeded.map((t) => t.id)), ok = (id) => id != null && known.has(id);
  const games = bracket.filter((m) => m && typeof m === "object");
  const r1 = games.filter((m) => m.r === 1), r2 = games.filter((m) => m.r === 2), r3 = games.filter((m) => m.r === 3);
  const fin = r3.find((m) => m.p === 1), third = r3.find((m) => m.p === 3);
  const slot = new Array(6).fill(null), exact = new Array(6).fill(false);
  const put = (i, id, isExact) => { if (slot[i] == null && ok(id) && !slot.includes(id)) { slot[i] = id; exact[i] = !!isExact; } };
  if (fin && ok(fin.w) && ok(fin.l)) { put(5, fin.w, true); put(4, fin.l, true); }
  if (third && ok(third.w) && ok(third.l)) { put(3, third.w, true); put(2, third.l, true); }
  const r1l = r1.map((m) => m.l).filter(ok);
  if (r1.length === 2 && r1l.length === 2) { const w = worstFirst(r1l); put(0, w[0], true); put(1, w[1], true); }
  const r2done = r2.length === 2 && r2.every((m) => ok(m.w) && ok(m.l));
  if (r2done) {   // both semifinals are in: the losers play for 9 and 10, the winners for 11 and 12
    worstFirst(r2.map((m) => m.l)).forEach((id, i) => put(2 + i, id, false));
    worstFirst(r2.map((m) => m.w)).forEach((id, i) => put(4 + i, id, false));
  }
  const rest = chalk.filter((id) => !slot.includes(id));
  for (let i = 0; i < 6; i++) if (slot[i] == null) slot[i] = rest.shift();
  return { ids: slot, final: exact };
}

function doRank(season, playoffTeams, bracket) {
  const rows = season.teams.map((t) => ({ id: t.teamId, team: t.name, managerId: t.managerId, wins: t.wins || 0, losses: t.losses || 0, ties: t.ties || 0, pf: t.pf || 0, rosterPts: t.rosterPts == null ? null : t.rosterPts }));
  rows.sort((a, b) => b.wins - a.wins || a.losses - b.losses || b.pf - a.pf).forEach((r, i) => { r.seed = i + 1; r.status = r.seed <= playoffTeams ? "in" : "out"; });
  const outRows = rows.filter((r) => r.status === "out"), inRows = rows.filter((r) => r.status === "in");
  const useBench = outRows.length > 0 && outRows.every((r) => r.rosterPts != null);
  const key = (r) => (useBench ? r.rosterPts : r.pf);
  outRows.sort((a, b) => key(a) - key(b));
  const po = doPlayoffOrder(inRows, bracket), byId = new Map(inRows.map((r) => [r.id, r]));
  const order = [...outRows.map((r) => ({ ...r, final: false })), ...po.ids.map((id, i) => ({ ...byId.get(id), final: po.final[i] }))].map((r, i) => ({ ...r, slot: i + 1, pts: key(r) }));
  return { order, useBench, outCount: outRows.length };
}

// everyone who has held each future pick, oldest first, replayed from the league's trade history ("2027-1-7" = round 1 of 2027, originally team 7)
function doChains(cx) {
  const chains = new Map(), trades = [...((cx.data && cx.data.trades) || [])].sort((a, b) => (a.at || 0) - (b.at || 0));
  for (const t of trades) for (const sd of t.sides || []) for (const g of sd.got || []) {
    if (!g || g.k !== "d" || g.o == null) continue;
    const key = `${g.y}-${g.rd}-${g.o}`, list = chains.get(key) || [g.o];
    if (list[list.length - 1] !== sd.r) list.push(sd.r);
    chains.set(key, list);
  }
  return chains;
}

// the teams a traded pick came through, most recent first and the original team last. The trade history gives the whole chain when it agrees
// with Sleeper about who holds the pick and who held it before. Otherwise only Sleeper's own previous owner is used.
function doVia(hist, orig, owner, prevId) {
  if (hist && hist.length >= 2 && hist[hist.length - 1] === owner && (prevId == null || hist[hist.length - 2] === prevId)) return hist.slice(0, -1).reverse();
  return prevId != null && prevId !== orig && prevId !== owner ? [prevId, orig] : [orig];
}

// every pick of the draft with its owner. For a draft that has no order yet, teams are listed A to Z.
function doBuild(cx, info, data, year) {
  const settings = (data && data.league && data.league.settings) || {};
  const playoffTeams = Number(settings.playoff_teams) || 6, rounds = Number(settings.draft_rounds) || 3;
  const ranked = doRank(info.season, playoffTeams, data && data.bracket), ordered = year === info.upcoming;
  const nm = (t) => cx.name(t.managerId);
  const order = ordered ? ranked.order : [...ranked.order].sort((a, b) => nm(a).localeCompare(nm(b))).map((r, i) => ({ ...r, slot: null }));
  const ids = new Set(order.map((t) => t.id)), owner = new Map(), prev = new Map(), chains = doChains(cx);
  order.forEach((t) => { for (let r = 1; r <= rounds; r++) owner.set(r + "-" + t.id, t.id); });
  for (const tp of (data && data.tradedPicks) || []) {
    const r = Number(tp.round), k = r + "-" + tp.roster_id;
    if (Number(tp.season) === year && r >= 1 && r <= rounds && ids.has(tp.roster_id) && ids.has(tp.owner_id) && owner.has(k)) { owner.set(k, tp.owner_id); prev.set(k, tp.previous_owner_id); }
  }
  const byId = new Map(order.map((t) => [t.id, t])), picks = [];
  for (let r = 1; r <= rounds; r++) for (const t of order) {
    const oid = owner.get(r + "-" + t.id), traded = oid !== t.id;
    picks.push({ round: r, slot: t.slot, label: t.slot ? `${r}.${doPad(t.slot)}` : `Round ${r}`, from: t, owner: byId.get(oid), traded, via: traded ? doVia(chains.get(`${year}-${r}-${t.id}`), t.id, oid, prev.get(r + "-" + t.id)).map((id) => byId.get(id)).filter(Boolean) : [] });
  }
  return { year, ordered, rounds, playoffTeams, order, useBench: ranked.useBench, outCount: ranked.outCount, picks, traded: picks.filter((p) => p.traded), nm };
}

async function doLoad(cx) {
  DO.loading = true;
  try {
    let raw;
    if (typeof DRAFT_ORDER_DEMO !== "undefined") raw = DRAFT_ORDER_DEMO;
    else {
      const id = (typeof liveInfo !== "undefined" && liveInfo && liveInfo.leagueId) || SLEEPER_DEFAULT.leagueId;
      const [league, tradedPicks, bracket] = await Promise.all([sleeperGet(`/league/${id}`), sleeperGet(`/league/${id}/traded_picks`), sleeperGet(`/league/${id}/winners_bracket`).catch(() => [])]);
      raw = { league, tradedPicks: Array.isArray(tradedPicks) ? tradedPicks : [], bracket: Array.isArray(bracket) ? bracket : [] };
    }
    DO.data = raw; DO.error = ""; DO.at = Date.now();
  } catch (e) { DO.error = "Couldn\u2019t check Sleeper for traded picks, so every team is shown with its own picks."; DO.at = Date.now(); }
  DO.loading = false;
  if (location.hash === "#draftorder") render();
}

function draftOrderView(cx) {
  const info = doInfo(cx);
  if (!info) return `<div id="do-root"><section class="card"><h2>Draft Order</h2><p class="muted">There isn\u2019t a season to build a draft order from yet.</p></section></div>`;
  if (!DO.loading && (!DO.at || Date.now() - DO.at > 300000)) { DO.loading = true; setTimeout(() => doLoad(cx), 0); }
  const years = [info.upcoming, info.upcoming + 1, info.upcoming + 2];
  if (!years.includes(DO.year)) DO.year = info.upcoming;
  const B = doBuild(cx, info, DO.data, DO.year), nm = B.nm, demo = typeof DRAFT_ORDER_DEMO !== "undefined";
  const phone = typeof matchMedia === "function" && matchMedia("(max-width: 720px)").matches;
  const tname = (t) => esc(nm(t));
  const rec = (t) => `${t.wins}-${t.losses}${t.ties ? "-" + t.ties : ""}`;
  const through = info.season.live ? (info.season.rosterLastScored ? `Live from Sleeper, through Week ${esc(info.season.rosterLastScored)}.` : "Live from Sleeper.") : "Based on the last saved standings. It updates when Sleeper loads.";
  const status = DO.error ? `<p class="tm-warn" role="status">\u26a0 ${esc(DO.error)} <button class="btn" data-do="retry">Try again</button></p>` : (!DO.data ? `<p class="tm-small muted" role="status">Checking Sleeper for traded picks\u2026</p>` : "");
  const opts = years.map((y) => `<option value="${y}"${y === DO.year ? " selected" : ""}>${y} draft${y === info.upcoming ? " (next)" : ""}</option>`).join("");
  const head = `<section class="card do-head"><h2>Draft Order</h2>
    <p class="note" style="margin:0">Every pick in the draft, with traded picks marked. ${B.ordered ? "The order is a projection until the season ends." : "The order for this draft isn\u2019t set yet, so teams are listed A to Z."}</p>
    <div class="filters"><label>Draft <select data-do="year" aria-label="Which draft">${opts}</select></label></div>
    ${demo ? `<p class="tm-demo" style="display:inline-block">Demo: the trades on this page are made up, just for trying the layout</p>` : ""}
    ${B.ordered ? `<p class="tm-small muted" style="margin:6px 0 0">${through}</p>` : ""}${status}
    <details class="tm-help"><summary>How is the order set?</summary>
      <p><strong>Picks 1 to 6:</strong> teams that miss the playoffs, by total team points (starters plus bench). Fewest points picks first.<br><strong>Picks 7 and 8:</strong> playoff teams knocked out in round 1. The lowest seed to lose gets 7.<br><strong>Picks 9 and 10:</strong> the 3rd place game. The loser gets 9, the winner 10.<br><strong>Picks 11 and 12:</strong> the championship game. The loser gets 11, the champion 12.</p>
      <p>Until the playoffs are played, picks 7 to 12 assume the better seed always wins, so they can still change. Every round uses the same order. ${B.useBench ? "" : "Total team points aren\u2019t available yet, so points scored by starters are used for now."}</p></details></section>`;

  // the three rounds
  const viaTxt = (p) => p.via.map((t) => `via ${tname(t)}`).join(" ");
  const moved = (p) => (p.traded ? `${phone ? "<br>" : " "}<span class="muted">(${viaTxt(p)})</span>` : "");
  const roundHtml = B.ordered ? Array.from({ length: B.rounds }, (_, i) => i + 1).map((r) => {
    const list = B.picks.filter((p) => p.round === r);
    const rows = list.map((p) => {
      const line = B.outCount && p.slot === B.outCount + 1 ? " do-line" : "";
      const whose = p.traded ? tname(p.from) : `<span class="muted">own</span>`;
      const cells = phone ? [`<strong>${esc(p.label)}</strong>`, `<strong>${tname(p.owner)}</strong>${moved(p)}`, `${whose}<br><span class="tm-small muted">${rec(p.from)}</span>`]
        : [`<strong>${esc(p.label)}</strong>`, `<strong>${tname(p.owner)}</strong>${moved(p)}`, whose, rec(p.from)];
      if (r === 1 && !phone) cells.push(p.slot <= B.outCount ? tmFmt(p.from.pts) : `<span class="muted">playoffs</span>`);
      return `<tr class="${p.traded ? "do-traded" : ""}${line}">${cells.map((c) => `<td>${c}</td>`).join("")}</tr>`;
    }).join("");
    const heads = (phone ? ["Pick", "Who picks", "Whose pick"] : ["Pick", "Who picks", "Whose pick", "Record"]).concat(r === 1 && !phone ? [B.useBench ? "Total pts" : "Points scored"] : []);
    return `<section class="card do-sec"><h3>Round ${r}</h3>${r === 1 ? `<p class="tm-small muted">Gold rows are traded picks. ${B.outCount ? `Picks 1.01 to 1.${doPad(B.outCount)} go to teams outside the playoffs, and the line marks where the playoff teams start (provisional).` : ""}</p>` : ""}<div class="table-wrap"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join("") : "";

  // who holds what
  const mgrs = B.order.map((t) => ({ t, mine: B.picks.filter((p) => p.owner.id === t.id) })).sort((a, b) => b.mine.length - a.mine.length || nm(a.t).localeCompare(nm(b.t)));
  const cell = (list) => list.length ? list.map((p) => (B.ordered ? `${esc(p.label)}${p.traded ? ` <span class="muted">(${viaTxt(p)})</span>` : ""}` : (p.traded ? `<span class="muted">(${viaTxt(p)})</span>` : "own"))).join("<br>") : `<span class="muted">\u2013</span>`;
  const holdRows = mgrs.map(({ t, mine }) => [`<strong>${tname(t)}</strong>`, ...Array.from({ length: B.rounds }, (_, i) => cell(mine.filter((p) => p.round === i + 1))), esc(mine.length)]);
  const holdHeads = ["Manager", ...Array.from({ length: B.rounds }, (_, i) => `Round ${i + 1}`), "Total"];

  // traded picks
  const firsts = mgrs.map(({ t, mine }) => ({ t, n: mine.filter((p) => p.round === 1).length })).sort((a, b) => b.n - a.n);
  const most = firsts[0] && firsts[0].n > 1 ? firsts.filter((x) => x.n === firsts[0].n) : [];
  const top = B.ordered ? B.picks.find((p) => p.slot === 1 && p.round === 1) : null;
  const tiles = `<div class="tm-teams pc-tiles">
    ${top ? `<div class="tm-team"><div class="tm-small muted">Projected 1.01</div><div class="tm-tname">${tname(top.owner)}</div><div class="tm-small">${top.traded ? `Earned by ${tname(top.from)}` : "Own pick"} \u00b7 ${rec(top.from)}</div></div>` : ""}
    <div class="tm-team"><div class="tm-small muted">Picks that have moved</div><div class="tm-tname">${B.traded.length} of ${B.picks.length}</div><div class="tm-small">${B.traded.length ? "shown in gold below" : "none traded yet"}</div></div>
    <div class="tm-team"><div class="tm-small muted">Most 1st-round picks</div><div class="tm-tname">${most.length ? most.map((x) => tname(x.t)).join(", ") : "No one"}</div><div class="tm-small">${most.length ? `${most[0].n} each` : "everyone has one or none"}</div></div></div>`;
  const holdSec = `<section class="card do-sec"><h3>Who holds what</h3><p class="tm-small muted">${B.ordered ? "Pick numbers, with where each traded pick came from in brackets." : "\u201cown\u201d is the manager\u2019s own pick. Otherwise it shows where the pick came from."}</p>${table(holdHeads, holdRows)}</section>`;
  const later = B.ordered ? "" : `<section class="card"><p class="muted">The ${DO.year} order will be set by the ${DO.year - 1} season, so only ownership is shown.</p></section>`;
  return `<div id="do-root">${head}${tiles}${later}${roundHtml}${holdSec}</div>`;
}

// Subscribes to the saved seasons and scores. Called once by the boot code for each build.
function startData() {
  const onErr = (e) => {
    if (e && e.code === "permission-denied") storageNote = "Firebase blocked access. Check your Firestore rules.";
    render();
  };
  db.collection("seasons").onSnapshot(
    (snap) => { dbRows = snap.docs.map((d) => d.data()).filter((d) => d && Number.isInteger(d.year)); mergeData(); refresh(); render(); },
    onErr
  );
  db.collection("games").onSnapshot(
    (snap) => {
      dbGameDocs = new Map(snap.docs.map((d) => d.data()).filter((d) => d && Number.isInteger(d.year)).map((d) => [d.year, d]));
      mergeData(); refresh(); render();

    onErr
  );
}


// Pulls the current Sleeper season straight from Sleeper whenever the page opens (GitHub build only).
// Sleeper's data API is public and read-only, so no login or keys are needed.
const SLEEPER_API = "https://api.sleeper.app/v1";
const SLEEPER_CACHE_SCHEMA = 2;   // bump when the saved data changes shape, so old saved copies are ignored

// Raw Sleeper data for one season -> the same season and games documents the rest of the app uses.
function sleeperToDocs(raw, names) {
  const { league, users, rosters, bracket, matchups, drafts } = raw;
  const playerNames = arguments[2] || {};
  // total roster points (starters + bench, never IR or taxi) are only used when they check out against Sleeper's own starter scores
  const rt = raw.rosterTotals && raw.rosterTotals.ok ? raw.rosterTotals : null;
  const nameMap = names || {};
  const year = Number(league.season);
  const start = (league.settings && league.settings.playoff_week_start) || 15;
  // Weeks I have frozen (see the lock page) win over whatever Sleeper says today; later weeks are worked out live.
  const lockedYear = (typeof LOCKED_WEEKS !== "undefined" && LOCKED_WEEKS && LOCKED_WEEKS[year]) || {};
  const lockedWeeks = Object.keys(lockedYear).map(Number).filter((w) => w < start).sort((a, b) => a - b);
  const weekPts = (rid, w) => {
    const frozen = lockedYear[w] && lockedYear[w][rid];
    if (frozen !== undefined && frozen !== null) return frozen;
    const live = rt && rt.totals[rid] && rt.totals[rid].byWeek[w];
    return live || 0;
  };
  const weeksOf = (rid) => [...new Set([...lockedWeeks, ...Object.keys((rt && rt.totals[rid] && rt.totals[rid].byWeek) || {}).map(Number)])].filter((w) => w < start).sort((a, b) => a - b);
  const rosterOf = (rid) => Math.round(weeksOf(rid).reduce((t, w) => t + weekPts(rid, w), 0) * 100) / 100;
  const rosterInfo = raw.rosterTotals ? {
    live: true, rosterCheck: { checked: raw.rosterTotals.checked, matched: raw.rosterTotals.matched }, rosterMissing: !raw.rosterTotals.ok,
    ...(rt ? { rosterLastScored: rt.lastScored || 0, rosterLockedWeeks: lockedWeeks,
      // each team's number for every week: frozen weeks use the frozen value, the rest come from Sleeper right now
      rosterWeeks: Object.fromEntries(Object.keys(rt.totals).map((rid) => [rid, Object.fromEntries(weeksOf(rid).map((w) => [w, weekPts(rid, w)]))])) } : {}),
  } : {};
  const byId = new Map(users.map((u) => [u.user_id, u]));
  const sorted = [...rosters].sort((a, b) => a.roster_id - b.roster_id);
  const idx = new Map();
  const teams = sorted.map((r, i) => {
    const u = byId.get(r.owner_id) || {};
    const uname = u.display_name || "Unknown";
    const tname = String((u.metadata && u.metadata.team_name) || "").trim() || uname;
    const st = r.settings || {};
    idx.set(r.roster_id, i);
    return { name: tname, manager: nameMap[uname] || uname, wins: st.wins || 0, losses: st.losses || 0, ties: st.ties || 0,
      ...(rt ? { rosterPts: rosterOf(r.roster_id) } : {}),
      pf: Math.round(((st.fpts || 0) + (st.fpts_decimal || 0) / 100) * 100) / 100,
      pa: Math.round(((st.fpts_against || 0) + (st.fpts_against_decimal || 0) / 100) * 100) / 100 };
  });

  const bk = Array.isArray(bracket) ? bracket : [];
  const final = bk.find((b) => b.p === 1);
  const champIdx = final && final.w != null && idx.has(final.w) ? idx.get(final.w) : -1;
  const runnerIdx = final && final.l != null && idx.has(final.l) ? idx.get(final.l) : -1;

  // playoff games are the bracket games (not the 3rd/5th place games), found by week = start + round - 1
  const playoff = new Set();
  for (const b of bk) {
    if (b.p === 3 || b.p === 5 || !Number.isInteger(b.t1) || !Number.isInteger(b.t2)) continue;
    playoff.add(`${start + b.r - 1}|${Math.min(b.t1, b.t2)}|${Math.max(b.t1, b.t2)}`);
  }

  const games = [];
  const weeks = Object.keys(matchups || {}).map(Number).sort((a, b) => a - b);
  for (const wk of weeks) {
    const groups = new Map();
    for (const x of matchups[wk]) {
      if (x.matchup_id === null || x.matchup_id === undefined) continue;
      const g = groups.get(x.matchup_id) || [];
      g.push(x);
      groups.set(x.matchup_id, g);
    }
    for (const g of groups.values()) {
      if (g.length !== 2) continue;
      const [a, b] = g;
      if (!(a.points || 0) && !(b.points || 0)) continue;
      const key = `${wk}|${Math.min(a.roster_id, b.roster_id)}|${Math.max(a.roster_id, b.roster_id)}`;
      const type = wk < start ? "regular" : playoff.has(key) ? "playoff" : "consolation";
      games.push({ week: wk, type, home: teams[idx.get(a.roster_id)].name, homeScore: a.points,
        away: teams[idx.get(b.roster_id)].name, awayScore: b.points });
    }
  }

  // the draft with the most picks becomes the season's draft
  let draft = null;
  const best = (drafts || []).filter((x) => x.picks && x.picks.length).sort((a, b) => b.picks.length - a.picks.length)[0];
  if (best) {
    const picks = [];
    for (const k of best.picks) {
      if (!idx.has(k.roster_id)) continue;
      const md = k.metadata || {};
      const pos = md.position === "DEF" || md.position === "DST" ? "D/ST" : md.position || "";
      picks.push({ n: k.pick_no, r: k.round, t: teams[idx.get(k.roster_id)].name,
        p: ((md.first_name || "") + " " + (md.last_name || "")).trim() || "Player " + k.player_id, pos, k: k.is_keeper ? 1 : 0,
        s: k.draft_slot === undefined ? null : k.draft_slot });
    }
    picks.sort((a, b) => a.n - b.n);
    // which roster owned each draft slot, so a traded pick can be matched to the player it became
    const ownerRoster = new Map();
    for (const r of rosters) {
      if (r.owner_id) ownerRoster.set(r.owner_id, r.roster_id);
      for (const c of r.co_owners || []) if (!ownerRoster.has(c)) ownerRoster.set(c, r.roster_id);
    }
    const slots = {};
    for (const [uid, slot] of Object.entries((best.draft && best.draft.draft_order) || {})) if (ownerRoster.has(uid)) slots[String(slot)] = ownerRoster.get(uid);
    if (picks.length) draft = { year, platform: "sleeper", type: (best.draft && best.draft.type) || "snake", rounds: Math.max(...picks.map((x) => x.r)), slots, picks };
  }

  // completed trades: what each side received (players, draft picks, FAAB money)
  const trades = [];
  const seenTx = new Set();
  for (const t of raw.transactions || []) {
    if (t.type !== "trade" || t.status !== "complete" || seenTx.has(t.transaction_id)) continue;
    seenTx.add(t.transaction_id);
    const sides = (t.roster_ids || []).map((rid) => {
      const got = [];
      for (const [pid, r] of Object.entries(t.adds || {})) {
        if (r === rid) { const pl = playerNames[pid] || {}; got.push({ k: "p", name: pl.name || "Player " + pid, pos: pl.pos || "" }); }
      }
      got.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
      for (const p of t.draft_picks || []) if (p.owner_id === rid) got.push({ k: "d", y: Number(p.season), rd: p.round, o: p.roster_id });
      for (const w of t.waiver_budget || []) if (w.receiver === rid) got.push({ k: "f", amt: w.amount });
      return { r: rid, got };
    });
    trades.push({ id: t.transaction_id, ls: year, at: t.created, sides });
  }
  trades.sort((a, b) => a.at - b.at);
  return { season: { year, platform: "sleeper", teams, champIdx, runnerIdx, ...rosterInfo }, games: { year, games }, draft, trades };
}

async function sleeperGet(path) {
  const r = await fetch(SLEEPER_API + path);
  if (!r.ok) throw new Error("Sleeper " + r.status);
  return r.json();
}

async function sleeperFetchRaw(id) {
  const [league, users, rosters, bracket] = await Promise.all([
    sleeperGet(`/league/${id}`), sleeperGet(`/league/${id}/users`), sleeperGet(`/league/${id}/rosters`),
    sleeperGet(`/league/${id}/winners_bracket`).catch(() => []),
  ]);
  const weeks = await Promise.all(Array.from({ length: 18 }, (_, i) => sleeperGet(`/league/${id}/matchups/${i + 1}`).catch(() => [])));
  // Every week's full roster points: starters always count; bench players count; players on IR or taxi do not.
  const startWeek = (league.settings && league.settings.playoff_week_start) || 15;
  const skip = new Map(rosters.map((r) => [r.roster_id, new Set([...(r.reserve || []), ...(r.taxi || [])].map(String))]));
  const totals = {};
  let checked = 0, matched = 0, hasPlayerPoints = false;
  weeks.forEach((m, i) => {
    if (i + 1 >= startWeek || !Array.isArray(m)) return;
    for (const x of m) {
      const pp = x.players_points || {};
      if (Object.keys(pp).length) hasPlayerPoints = true;
      const starters = (x.starters || []).filter((p) => p && p !== "0").map(String);
      const starterSet = new Set(starters);
      const out = skip.get(x.roster_id) || new Set();
      let starterPts = 0, benchPts = 0;
      for (const p of starters) starterPts += pp[p] || 0;
      for (const p of x.players || []) if (!starterSet.has(String(p)) && !out.has(String(p))) benchPts += pp[p] || 0;
      const t = totals[x.roster_id] || (totals[x.roster_id] = { total: 0, byWeek: {} });
      const wkPts = Math.round((starterPts + benchPts) * 100) / 100;
      t.total += wkPts; t.byWeek[i + 1] = wkPts;
      if ((x.points || 0) > 0) { checked++; if (Math.abs(starterPts - (x.points || 0)) <= 0.6) matched++; }
    }
  });
  // the column is shown whenever Sleeper sends per-player scores; the starter check only decides whether we add a warning
  const rosterTotals = { ok: hasPlayerPoints, checked, matched, totals, lastScored: Number(league.settings && league.settings.last_scored_leg) || 0 };
  const matchups = {};
  weeks.forEach((m, i) => {
    if (Array.isArray(m) && m.length) matchups[i + 1] = m.map((x) => ({ roster_id: x.roster_id, matchup_id: x.matchup_id, points: x.points }));
  });
  const dl = await sleeperGet(`/league/${id}/drafts`).catch(() => []);
  const drafts = [];
  for (const d of Array.isArray(dl) ? dl : []) {
    drafts.push({ draft: d, picks: await sleeperGet(`/draft/${d.draft_id}/picks`).catch(() => []) });
  }
  const txw = await Promise.all(Array.from({ length: 19 }, (_, i) => sleeperGet(`/league/${id}/transactions/${i}`).catch(() => [])));
  const transactions = txw.flat().filter((t) => t && t.type === "trade");
  return { league, users, rosters, bracket, matchups, drafts, transactions, rosterTotals };
}

// Next year's league (created when the new season starts) points back at this one.
async function sleeperFindNext(id, year, userIds) {
  for (const uid of userIds) {
    try {
      const list = await sleeperGet(`/user/${uid}/leagues/nfl/${year + 1}`);
      const hit = Array.isArray(list) ? list.find((l) => l.previous_league_id === id) : null;
      if (hit) return hit.league_id;
    } catch (e) { /* try the next person */ }
  }
  return null;
}

// Starts at the configured league and follows any newer seasons. Finished seasons are reused from the cache.
async function sleeperLoadChain(cfg, cached, maxAgeMs) {
  const stale = !cached || Date.now() - cached.t > (maxAgeMs === undefined ? 10 * 60 * 1000 : maxAgeMs);
  const known = Object.assign({}, cfg.players || {}, (cached && cached.players) || {});
  const items = [];
  const seen = new Set();
  let id = cfg.leagueId;
  while (id && !seen.has(id) && items.length < 4) {
    seen.add(id);
    let it = cached && cached.items ? cached.items.find((x) => x.id === id) : null;
    const needFetch = !it || (!it.complete && stale);
    if (needFetch) {
      const raw = await sleeperFetchRaw(id);
      // player names for trades: only download Sleeper's big player list when a traded player isn't known yet
      const unknown = new Set();
      for (const t of raw.transactions) for (const pid of Object.keys(t.adds || {})) if (!known[pid]) unknown.add(pid);
      if (unknown.size) {
        try {
          const all = await sleeperGet("/players/nfl");
          unknown.forEach((pid) => {
            const p = all[pid];
            if (p) known[pid] = { name: p.full_name || ((p.first_name || "") + " " + (p.last_name || "")).trim(), pos: p.position || "" };
          });
        } catch (e) { /* names stay as player ids */ }
      }
      const docs = sleeperToDocs(raw, cfg.names, known);
      it = { id, year: docs.season.year, complete: raw.league.status === "complete" && docs.season.champIdx >= 0,
        season: docs.season, games: docs.games, draft: docs.draft, trades: docs.trades, userIds: raw.users.slice(0, 4).map((u) => u.user_id), next: null };
    }
    if (!it.next && (needFetch || stale)) it.next = await sleeperFindNext(id, it.year, it.userIds);
    items.push(it);
    id = it.next;
  }
  return { t: Date.now(), items, players: known, schema: SLEEPER_CACHE_SCHEMA };
}

// Builds the data Claude needs for a weekly recap and preview. Runs only when you press the button on the hidden #recapdata page.
async function buildRecapData(info, ctx, finishedWeek, part) {
  part = part || "both";
  const id = info.leagueId;
  const [league, rosters, users] = await Promise.all([sleeperGet(`/league/${id}`), sleeperGet(`/league/${id}/rosters`), sleeperGet(`/league/${id}/users`)]);
  const recapWeek = finishedWeek || Number(league.settings && league.settings.last_scored_leg) || 1;
  const previewWeek = recapWeek + 1;
  const weeks = {};
  await Promise.all(Array.from({ length: previewWeek }, (_, i) => sleeperGet(`/league/${id}/matchups/${i + 1}`).catch(() => []).then((m) => { weeks[i + 1] = Array.isArray(m) ? m : []; })));
  const dbAll = await sleeperGet("/players/nfl");
  const season = ctx.seasons.find((s) => s.year === Number(league.season)) || ctx.seasons.at(-1);
  const teamOf = (rid) => (season && season.teams[rid - 1]) || { name: "Team " + rid, managerId: null };
  const mgr = (t) => (t.managerId ? ctx.name(t.managerId) : "");
  const rosterBy = new Map(rosters.map((r) => [r.roster_id, r]));
  const slots = (league.roster_positions || []).filter((s) => s !== "BN" && s !== "IR" && s !== "TAXI");
  const r1 = (n) => Math.round(n * 100) / 100;

  const info1 = (pid) => {
    const p = dbAll[pid] || {};
    const pos = p.position || (p.fantasy_positions && p.fantasy_positions[0]) || "";
    const name = pid === "0" ? "(empty)" : p.full_name || [p.first_name, p.last_name].filter(Boolean).join(" ") || `Player ${pid}`;
    return { name: pos === "DEF" ? `${p.first_name || ""} ${p.last_name || ""}`.trim() || name : name, pos: pos === "DEF" ? "DST" : pos, team: p.team || "FA", inj: p.injury_status || "" };
  };
  const flexOk = { FLEX: ["RB", "WR", "TE"], WRRB_FLEX: ["RB", "WR"], REC_FLEX: ["WR", "TE"], SUPER_FLEX: ["QB", "RB", "WR", "TE"] };
  const optimal = (pool) => {   // best possible lineup from everyone who could have started
    const used = new Set(); let total = 0;
    const strict = slots.filter((s) => !flexOk[s]), flex = slots.filter((s) => flexOk[s]);
    for (const s of strict) { const key = s === "DEF" ? "DST" : s; const best = pool.filter((p) => p.pos === key && !used.has(p.pid)).sort((a, b) => b.pts - a.pts)[0]; if (best) { used.add(best.pid); total += best.pts; } }
    for (const s of flex) { const best = pool.filter((p) => flexOk[s].includes(p.pos) && !used.has(p.pid)).sort((a, b) => b.pts - a.pts)[0]; if (best) { used.add(best.pid); total += best.pts; } }
    return total;
  };

  // ---- recap: every matchup of the finished week, with full lineups
  const recapRows = weeks[recapWeek] || [];
  const byMatch = new Map();
  for (const x of recapRows) { if (x.matchup_id == null) continue; const g = byMatch.get(x.matchup_id) || []; g.push(x); byMatch.set(x.matchup_id, g); }
  const scores = recapRows.map((x) => x.points || 0).sort((a, b) => a - b);
  const median = scores.length ? (scores[Math.floor((scores.length - 1) / 2)] + scores[Math.ceil((scores.length - 1) / 2)]) / 2 : 0;
  const sideRecap = (x) => {
    const r = rosterBy.get(x.roster_id) || {}, t = teamOf(x.roster_id), pp = x.players_points || {};
    const skip = new Set([...(r.reserve || []), ...(r.taxi || [])].map(String));
    const starters = (x.starters || []).map(String);
    const sset = new Set(starters.filter((p) => p !== "0"));
    const bench = (x.players || []).map(String).filter((p) => !sset.has(p) && !skip.has(p));
    const row = (pid, slot) => { const i = info1(pid); return { pid, slot, ...i, pts: r1(pp[pid] || 0) }; };
    const st = starters.map((pid, i) => row(pid, slots[i] || "?")).filter((p) => p.pid !== "0");
    const bn = bench.map((pid) => row(pid, "BN")).sort((a, b) => b.pts - a.pts);
    const pts = r1(x.points || 0), opt = r1(optimal([...st, ...bn]));
    // bench players who would have beaten a starter they could have replaced
    const swaps = [];
    for (const s of st) { const better = bn.filter((b) => b.pts > s.pts && (b.pos === s.pos || (flexOk[s.slot] || []).includes(b.pos))).sort((a, b) => b.pts - a.pts)[0]; if (better) swaps.push({ gain: r1(better.pts - s.pts), text: `${better.name} (${better.pos}, ${better.pts}) sat while ${s.name} (${s.pos}, ${s.pts}) started at ${s.slot}` }); }
    swaps.sort((a, b) => b.gain - a.gain);
    const fmt = (p) => `${p.slot}|${p.name}|${p.pos}|${p.team}|${p.pts}`;
    return { id: x.roster_id, team: t.name, mgr: mgr(t), pts, vsMedian: pts > median ? "above" : "below", optimal: opt, leftOnBench: r1(opt - pts), benchPts: r1(bn.reduce((a, b) => a + b.pts, 0)),
      starters: st.map(fmt), bench: bn.filter((b) => b.pts !== 0).map(fmt), biggestMisses: swaps.slice(0, 3).map((s) => s.text) };
  };
  const recap = part === "preview" ? null : [...byMatch.values()].filter((g) => g.length === 2).map((g) => ({ a: sideRecap(g[0]), b: sideRecap(g[1]) }));

  // ---- preview: next week's pairings with each team's current lineup and how its players have scored
  const prevRows = weeks[previewWeek] || [];
  const pByMatch = new Map();
  for (const x of prevRows) { if (x.matchup_id == null) continue; const g = pByMatch.get(x.matchup_id) || []; g.push(x); pByMatch.set(x.matchup_id, g); }
  const avgOf = new Map(), lastOf = new Map();
  for (let w = 1; w <= recapWeek; w++) for (const x of weeks[w] || []) for (const [pid, pts] of Object.entries(x.players_points || {})) {
    const k = x.roster_id + ":" + pid; const a = avgOf.get(k) || { s: 0, n: 0 }; a.s += pts; a.n++; avgOf.set(k, a); if (w === recapWeek) lastOf.set(k, pts);
  }
  const sidePreview = (x) => {
    const r = rosterBy.get(x.roster_id) || {}, t = teamOf(x.roster_id), set = r.settings || {};
    const skip = new Set([...(r.reserve || []), ...(r.taxi || [])].map(String));
    const lastX = (weeks[recapWeek] || []).find((y) => y.roster_id === x.roster_id) || {};
    let starters = (x.starters || []).map(String).filter((p) => p !== "0");
    if (!starters.length) starters = (lastX.starters || []).map(String).filter((p) => p !== "0");
    const sset = new Set(starters);
    const bench = (r.players || x.players || []).map(String).filter((p) => !sset.has(p) && !skip.has(p));
    const row = (pid, slot) => { const i = info1(pid), a = avgOf.get(x.roster_id + ":" + pid); return `${slot}|${i.name}|${i.pos}|${i.team}|${i.inj || "-"}|${a ? r1(a.s / a.n) : "-"}|${lastOf.has(x.roster_id + ":" + pid) ? r1(lastOf.get(x.roster_id + ":" + pid)) : "-"}`; };
    return { id: x.roster_id, team: t.name, mgr: mgr(t), record: `${set.wins || 0}-${set.losses || 0}${set.ties ? "-" + set.ties : ""}`, pointsFor: r1((set.fpts || 0) + (set.fpts_decimal || 0) / 100),
      starters: starters.map((pid, i) => row(pid, slots[i] || "?")), bench: bench.map((pid) => row(pid, "BN")) };
  };
  const preview = part === "recap" ? null : [...pByMatch.values()].filter((g) => g.length === 2).map((g) => ({ a: sidePreview(g[0]), b: sidePreview(g[1]) }));

  // ---- league context: the playoff race, streaks, the top of the 2027 draft, and what happened on the transaction wire
  const startWeek = Number(league.settings && league.settings.playoff_week_start) || 15;
  const playoffTeams = Number(league.settings && league.settings.playoff_teams) || 6;
  const weeksLeft = Math.max(0, startWeek - 1 - recapWeek);
  const ranked = rosters.map((r) => { const s = r.settings || {}; return { id: r.roster_id, wins: s.wins || 0, losses: s.losses || 0, ties: s.ties || 0, pf: r1((s.fpts || 0) + (s.fpts_decimal || 0) / 100) }; })
    .sort((a, b) => b.wins - a.wins || a.losses - b.losses || b.pf - a.pf).map((r, i) => ({ ...r, seed: i + 1 }));
  const cutWins = ranked[playoffTeams - 1] ? ranked[playoffTeams - 1].wins : 0;
  const firstOut = ranked[playoffTeams] ? ranked[playoffTeams].wins : 0;
  const seq = new Map();   // roster id -> head-to-head and league-median results, week by week
  for (let w = 1; w <= recapWeek; w++) {
    const rows = weeks[w] || [];
    if (!rows.some((x) => (x.points || 0) > 0)) continue;
    const sc = rows.map((x) => x.points || 0).sort((a, b) => a - b), med = (sc[Math.floor((sc.length - 1) / 2)] + sc[Math.ceil((sc.length - 1) / 2)]) / 2;
    const groups = new Map();
    for (const x of rows) { if (x.matchup_id == null) continue; const g = groups.get(x.matchup_id) || []; g.push(x); groups.set(x.matchup_id, g); }
    for (const g of groups.values()) if (g.length === 2) for (const [me, op] of [[g[0], g[1]], [g[1], g[0]]]) {
      const s = seq.get(me.roster_id) || { h2h: [], med: [] };
      s.h2h.push(me.points > op.points ? "W" : me.points < op.points ? "L" : "T"); s.med.push(me.points > med ? "W" : me.points < med ? "L" : "T"); seq.set(me.roster_id, s);
    }
  }
  const tally = (a) => { const w = a.filter((x) => x === "W").length, l = a.filter((x) => x === "L").length, t = a.filter((x) => x === "T").length; return `${w}-${l}${t ? "-" + t : ""}`; };
  const streakOf = (a) => { const k = a[a.length - 1]; let n = 0; for (let i = a.length - 1; i >= 0 && a[i] === k; i--) n++; return k ? `${k}${n}` : ""; };
  const race = ranked.map((r) => { const t = teamOf(r.id), s = seq.get(r.id) || { h2h: [], med: [] };
    return { seed: r.seed, id: r.id, team: t.name, mgr: mgr(t), record: `${r.wins}-${r.losses}${r.ties ? "-" + r.ties : ""}`, pf: r.pf, rosterPts: t.rosterPts === undefined ? null : t.rosterPts,
      status: r.seed <= playoffTeams ? "in" : "out", winsFromCut: r.seed <= playoffTeams ? r.wins - firstOut : r.wins - cutWins,
      h2hRecord: tally(s.h2h), medianRecord: tally(s.med),
      h2hStreak: streakOf(s.h2h), last5H2H: s.h2h.slice(-5).join(""), medianStreak: streakOf(s.med), last5Median: s.med.slice(-5).join("") }; });
  // picks 1-6 of the 2027 draft: the teams outside the playoff picture, fewest total roster points picks first
  const outTeams = race.filter((r) => r.status === "out").sort((a, b) => (a.rosterPts ?? a.pf) - (b.rosterPts ?? b.pf));
  const draftWatch = outTeams.map((r, i) => ({ pick: i + 1, id: r.id, team: r.team, mgr: r.mgr, rosterPts: r.rosterPts, record: r.record }));

  const legs = [recapWeek, previewWeek];
  const txs = (await Promise.all(legs.map((l) => sleeperGet(`/league/${id}/transactions/${l}`).catch(() => [])))).flat();
  const since = Date.now() - 10 * 24 * 3600 * 1000;
  const seenTx = new Set();
  const recent = txs.filter((x) => x && x.status === "complete" && (x.status_updated || x.created || 0) >= since && !seenTx.has(x.transaction_id) && seenTx.add(x.transaction_id));
  const nm = (pid) => { const i = info1(String(pid)); return `${i.name} (${i.pos}${i.team && i.team !== "FA" ? ", " + i.team : ""})`; };
  const happenings = recent.map((x) => {
    const tn = (rid) => teamOf(rid).name;
    if (x.type === "trade") {
      const gets = (rid) => [...Object.entries(x.adds || {}).filter(([, r]) => r === rid).map(([p]) => nm(p)),
        ...(x.draft_picks || []).filter((p) => p.owner_id === rid).map((p) => `${p.season} round ${p.round} pick${p.roster_id !== p.previous_owner_id ? ` (originally ${tn(p.roster_id)}'s)` : ""}`),
        ...(x.waiver_budget || []).filter((w) => w.receiver === rid).map((w) => `$${w.amount} FAAB`)].join(", ") || "nothing";
      return { type: "trade", text: (x.roster_ids || []).map((rid) => `${tn(rid)} gets ${gets(rid)}`).join("; ") };
    }
    const rid = (x.roster_ids || [])[0], bid = x.settings && x.settings.waiver_bid;
    const adds = Object.keys(x.adds || {}).map(nm), drops = Object.keys(x.drops || {}).map(nm);
    return { type: x.type === "waiver" ? "waiver" : "free agent", bid: bid || 0, text: `${tn(rid)}: ${adds.length ? "added " + adds.join(", ") : ""}${adds.length && drops.length ? "; " : ""}${drops.length ? "dropped " + drops.join(", ") : ""}${bid ? ` ($${bid} FAAB)` : ""}` };
  }).sort((a, b) => (a.type === "trade" ? -1 : 0) - (b.type === "trade" ? -1 : 0) || (b.bid || 0) - (a.bid || 0)).slice(0, 40);

  // ---- season-long bench ledger: points each team left on its bench, week by week (IR and taxi players never count)
  const ledger = new Map();
  for (let w = 1; w <= recapWeek; w++) for (const x of weeks[w] || []) {
    if (!((x.points || 0) > 0)) continue;
    const r = rosterBy.get(x.roster_id) || {}, pp = x.players_points || {};
    const skip = new Set([...(r.reserve || []), ...(r.taxi || [])].map(String));
    const starters = (x.starters || []).map(String).filter((p) => p !== "0"), sset = new Set(starters);
    const pool = (x.players || []).map(String).filter((p) => sset.has(p) || !skip.has(p)).map((pid) => ({ pid, pos: info1(pid).pos, pts: pp[pid] || 0 }));
    const started = starters.reduce((a, p) => a + (pp[p] || 0), 0);
    const a = ledger.get(x.roster_id) || []; a.push({ week: w, left: Math.max(0, r1(optimal(pool) - started)) }); ledger.set(x.roster_id, a);
  }
  const benchLedger = [...ledger].map(([rid, arr]) => { const t = teamOf(rid), tot = r1(arr.reduce((s, y) => s + y.left, 0)), worst = arr.reduce((m, y) => (y.left > m.left ? y : m), arr[0]);
    return { id: rid, team: t.name, mgr: mgr(t), totalLeftOnBench: tot, avgPerWeek: r1(tot / arr.length), worstWeek: worst, byWeek: arr.map((y) => y.left) }; }).sort((a, b) => b.totalLeftOnBench - a.totalLeftOnBench);

  // ---- dynasty view: ages, rookies (and where they sit), and the trade deadline
  const lastRows = weeks[recapWeek] || [];
  const dynasty = rosters.map((r) => {
    const t = teamOf(r.roster_id), reserve = new Set((r.reserve || []).map(String)), taxi = new Set((r.taxi || []).map(String));
    const startersNow = new Set(((lastRows.find((y) => y.roster_id === r.roster_id) || {}).starters || []).map(String));
    const ps = (r.players || []).map(String).map((pid) => { const p = dbAll[pid] || {}, i = info1(pid); return { name: i.name, pos: i.pos, nfl: i.team, age: p.age == null ? null : p.age, exp: p.years_exp == null ? null : p.years_exp, status: taxi.has(pid) ? "taxi" : reserve.has(pid) ? "IR" : startersNow.has(pid) ? "starter" : "bench" }; });
    const aged = ps.filter((p) => p.age && p.pos !== "DST" && p.status !== "taxi");
    return { id: r.roster_id, team: t.name, mgr: mgr(t), avgAge: aged.length ? r1(aged.reduce((a, p) => a + p.age, 0) / aged.length) : null,
      rookies: ps.filter((p) => p.exp === 0 && p.pos !== "DST").map((p) => `${p.name}|${p.pos}|${p.nfl}|age ${p.age ?? "?"}|${p.status}`),
      age29plus: ps.filter((p) => p.age >= 29 && p.pos !== "DST").sort((a, b) => b.age - a.age).map((p) => `${p.name}|${p.pos}|${p.age}|${p.status}`) };
  }).sort((a, b) => (a.avgAge ?? 99) - (b.avgAge ?? 99));
  const td = Number(league.settings && league.settings.trade_deadline) || 0;
  const tradeDeadline = td > 0 && td < 99 ? { week: td, weeksFromNow: td - recapWeek } : { week: null, note: "Sleeper shows no trade deadline" };

  // ---- look ahead: next week's pairings and what each game puts on the line (no lineups, this is a league-wide view)
  const rivalries = [["Brett", "Bryce"], ["Guad", "Lutz"], ["Blake", "Guad"]];
  const byId = new Map(race.map((r) => [r.id, r])), pickOf = new Map(draftWatch.map((d) => [d.id, d.pick]));
  const near = (r) => Math.abs(r.winsFromCut) <= 2, streakLen = (s) => (s ? Number(String(s).slice(1)) || 0 : 0);
  const side = (r) => ({ id: r.id, team: r.team, mgr: r.mgr, record: r.record, seed: r.seed, status: r.status, winsFromCut: r.winsFromCut, h2hStreak: r.h2hStreak, medianStreak: r.medianStreak, draftPick: pickOf.get(r.id) || null });
  const nextWeek = [...pByMatch.values()].filter((g) => g.length === 2).map((g) => {
    const A = byId.get(g[0].roster_id), B = byId.get(g[1].roster_id); if (!A || !B) return null;
    const stakes = [];
    if (near(A) && near(B)) stakes.push("playoff line");
    if (A.status !== B.status) stakes.push("in-vs-out clash");
    if (pickOf.has(A.id) && pickOf.has(B.id)) stakes.push("race for 1.01");
    if ([A, B].some((r) => pickOf.get(r.id) === 1)) stakes.push("1.01 holder plays");
    if (streakLen(A.h2hStreak) >= 2 && streakLen(B.h2hStreak) >= 2 && A.h2hStreak[0] !== B.h2hStreak[0]) stakes.push("streak collision");
    if (rivalries.some(([x, y]) => (A.mgr === x && B.mgr === y) || (A.mgr === y && B.mgr === x))) stakes.push("rivalry");
    return { a: side(A), b: side(B), stakes };
  }).filter(Boolean);
  const liveSeason = ctx.seasons.find((s) => s.live && s.rosterWeeks && s.year === Number(league.season));
  const out = {
    note: "Lineups are strings. Recap rows: slot|player|position|NFL team|points. Preview rows: slot|player|position|NFL team|injury|season average|last week.",
    part, season: Number(league.season), recapWeek, previewWeek, startingSlots: slots, leagueMedianScore: r1(median),
    standings: season ? season.teams.map((t) => ({ id: t.teamId, team: t.name, mgr: mgr(t), record: `${t.wins}-${t.losses}${t.ties ? "-" + t.ties : ""}`, pf: t.pf, rosterPts: t.rosterPts })) : [],
    league: { weeksLeft, playoffTeams, note: "race: seeds by record then points for; status in or out of the playoff picture; winsFromCut is the cushion for teams in and the deficit for teams out. h2hRecord and medianRecord split each team's record into its weekly head-to-head and league-median games (the gap is the luck meter). h2hStreak and medianStreak are current streaks (W3 = three wins in a row); last5 strings are oldest to newest. draftWatch: picks 1 to 6 of the 2027 draft go to non-playoff teams, fewest total roster points picks first (a projection until the regular season ends). happenings: transactions from roughly the last 10 days.",
      race, draftWatch, happenings, happeningsTotal: recent.length },
    benchLedger, dynasty, tradeDeadline,
  };
  out.nextWeek = { week: previewWeek, note: "Pairings for the coming week with what is at stake. stakes: playoff line = both teams within 2 wins of the cut; in-vs-out clash = one team is in and one is out; race for 1.01 = both are in the bottom six draft race; streak collision = opposite head-to-head streaks of 2+; rivalry = Brett/Bryce, Guad/Lutz or Guad/Blake.", games: nextWeek };
  if (recap) { out.recap = recap; if (liveSeason && typeof lockFileData === "function") out.lock = lockFileData(liveSeason); }
  if (preview) out.preview = preview;
  return out;
}

// Boot for the GitHub Pages site: read-only. History is built into the page; the current Sleeper season updates live.
// Live Sleeper updates: every time the page opens it checks Sleeper, so new weeks appear on their own.
(async () => {
  const cfg = Object.assign({}, SLEEPER_DEFAULT, CONFIG.sleeper || {});
  if (cfg.enabled === false || !cfg.leagueId) return;
  const KEY = "fh-live-v2";
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (cached && cached.schema !== SLEEPER_CACHE_SCHEMA) cached = null;   // saved by an older version of the site: fetch fresh
  const apply = (chain) => {
    const last = chain.items[chain.items.length - 1];
    if (last) liveInfo = { leagueId: last.id, year: last.year };
    setLive(chain.items.map((i) => i.season), chain.items.map((i) => i.games), chain.items.map((i) => i.draft), chain.items.flatMap((i) => i.trades || []));
    liveNote = "Live from Sleeper, checked " + new Date(chain.t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    render();
  };
  if (cached && cached.items) apply(cached);
  try {
    const fresh = await sleeperLoadChain(cfg, cached);
    try { localStorage.setItem(KEY, JSON.stringify(fresh)); } catch (e) {}
    apply(fresh);
  } catch (e) {
    liveNote = cached ? "Couldn’t reach Sleeper just now. Showing the last update." : "Couldn’t reach Sleeper. Showing the saved history.";
    render();
  }
})();

</script>
