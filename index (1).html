<html lang="en">
<head>

<title>League History</title>
<style>
/* Colors and sizes live in these variables: change them here to restyle the whole site. */
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --text: #1c2330;
  --muted: #6b7686;
  --line: #e3e7ed;
  --accent: #1f6f4a;
  --accent-soft: #e2f3ea;
  --win: #d9f2e3;
  --loss: #fbe0e0;
  --even: #eef0f3;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --card: #1a2029; --text: #e8ecf1; --muted: #93a0b2; --line: #2a3340;
    --accent: #5cc796; --accent-soft: #1d3a2d; --win: #1e4a35; --loss: #5a2a2a; --even: #262e3a;
  }
}
:root[data-theme="dark"] {
    --bg: #11151b; --card: #1a2029; --text: #e8ecf1; --muted: #93a0b2; --line: #2a3340;
    --accent: #5cc796; --accent-soft: #1d3a2d; --win: #1e4a35; --loss: #5a2a2a; --even: #262e3a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px 0; position: sticky; top: 0; z-index: 5; }
h1 { margin: 0 0 8px; font-size: 20px; }
nav { display: flex; gap: 4px; overflow-x: auto; }
nav a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
nav a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 20px; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px; }
h2 { margin: 0 0 12px; font-size: 17px; }
h3 { margin: 0 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 0 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.cards .card { margin: 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tbody tr:hover { background: var(--accent-soft); }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 13px; }
.pill.win { background: var(--win); } .pill.loss { background: var(--loss); } .pill.even { background: var(--even); }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin: -6px 0 12px; }
.big { font-size: 17px; font-weight: 600; }
.pickers { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
label.inline { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px; }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
.banner { background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; }
.banner.error { background: var(--loss); }
code { background: var(--even); padding: 1px 6px; border-radius: 6px; }
.manager dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; }
.manager dt { color: var(--muted); } .manager dd { margin: 0; text-align: right; }
.trophies { min-height: 24px; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } main { padding: 12px; } }

/* data entry */
.btn { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; display: inline-block; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: #c0392b; }
.btn.small { padding: 2px 9px; }
.btn[disabled] { opacity: .6; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.actions { text-align: right; }
.center { text-align: center; }
input, textarea { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
textarea { width: 100%; }
.entry input { width: 100%; }
.entry td, .entry th { padding: 4px 6px; }
.w-team { min-width: 150px; } .w-mgr { min-width: 110px; } .w-num { min-width: 44px; max-width: 60px; } .w-pts { min-width: 72px; } .w-year { width: 90px; }
.autofill { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
.autofill h3 { margin: 0 0 4px; font-size: 15px; }
.banner a { color: var(--accent); }
.bad { border-color: #c0392b !important; background: var(--loss) !important; }
.w-week { min-width: 48px; max-width: 64px; } .w-score { min-width: 76px; max-width: 96px; }

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

</style>
</head>

// All the math lives here (no HTML), so it's easy to test and to extend with new stats.
// Input is the object from data/history.json.

const pct = (w, l, t) => {
  const g = w + l + t;
  return g ? (w + t / 2) / g : 0;
};

function prepare(data) {
  const managers = new Map(data.managers.map((m) => [m.id, m.name]));
  const seasons = [...data.seasons].sort((a, b) => a.year - b.year);
  return { data, seasons, managers, name: (id) => managers.get(id) ?? "Unclaimed" };
}

// Flat list of games, oldest first. Consolation games are left out unless asked for.
function games(ctx, withConsolation = false) {
  const out = [];
  for (const s of ctx.seasons) {
    const teamName = new Map(s.teams.map((t) => [t.teamId, t.name]));
    for (const g of s.matchups) {
      if (!withConsolation && g.type === "consolation") continue;
      out.push({
        year: s.year, week: g.week, type: g.type,
        a: { m: g.home.managerId, team: teamName.get(g.home.teamId), score: g.home.score },
        b: { m: g.away.managerId, team: teamName.get(g.away.teamId), score: g.away.score },
      });
    }
  }
  return out.sort((x, y) => x.year - y.year || x.week - y.week);
}

function champions(ctx) {
  return [...ctx.seasons].reverse().map((s) => {
    const champ = s.teams.find((t) => t.teamId === s.championTeamId);
    const runner = s.teams.find((t) => t.finalRank === 2);
    const who = (t) => t && { team: t.name, manager: ctx.name(t.managerId) };
    return { year: s.year, platform: s.platform, champion: who(champ), runnerUp: who(runner) };
  });
}

function seasonYears(ctx) {
  return ctx.seasons.map((s) => s.year).reverse();
}

function standings(ctx, year) {
  const s = ctx.seasons.find((x) => x.year === year);
  if (!s) return [];
  return [...s.teams]
    .sort((a, b) => b.wins - a.wins || a.losses - b.losses || b.pf - a.pf)
    .map((t, i) => ({ ...t, rank: i + 1, manager: ctx.name(t.managerId), champion: t.teamId === s.championTeamId }));
}

function allTime(ctx) {
  const rows = new Map();
  const row = (id) => {
    if (!rows.has(id)) rows.set(id, { managerId: id, name: ctx.name(id), seasons: 0, w: 0, l: 0, t: 0, pf: 0, pa: 0, titles: [], runnerUps: [], playoffs: 0 });
    return rows.get(id);
  };
  for (const s of ctx.seasons) {
    const madePlayoffs = new Set();
    for (const g of s.matchups) {
      if (g.type !== "playoff") continue;
      if (g.home.managerId) madePlayoffs.add(g.home.managerId);
      if (g.away.managerId) madePlayoffs.add(g.away.managerId);
    }
    for (const t of s.teams) {
      if (!t.managerId) continue;
      const r = row(t.managerId);
      r.seasons++; r.w += t.wins ?? 0; r.l += t.losses ?? 0; r.t += t.ties ?? 0; r.pf += t.pf ?? 0; r.pa += t.pa ?? 0;
      if (t.teamId === s.championTeamId) r.titles.push(s.year);
      if (t.finalRank === 2) r.runnerUps.push(s.year);
    }
    for (const id of madePlayoffs) row(id).playoffs++;
  }
  return [...rows.values()]
    .map((r) => ({ ...r, pct: pct(r.w, r.l, r.t) }))
    .sort((a, b) => b.titles.length - a.titles.length || b.pct - a.pct);
}

function headToHead(ctx) {
  const all = games(ctx);
  const ids = [...new Set(all.flatMap((g) => [g.a.m, g.b.m]).filter(Boolean))]
    .sort((x, y) => ctx.name(x).localeCompare(ctx.name(y)));
  const rec = new Map();
  const bump = (me, opp, pf, pa) => {
    const k = `${me}|${opp}`;
    const r = rec.get(k) ?? { w: 0, l: 0, t: 0, pf: 0, pa: 0 };
    if (pf > pa) r.w++; else if (pf < pa) r.l++; else r.t++;
    r.pf += pf; r.pa += pa;
    rec.set(k, r);
  };
  for (const g of all) {
    if (!g.a.m || !g.b.m || g.a.m === g.b.m) continue;
    bump(g.a.m, g.b.m, g.a.score, g.b.score);
    bump(g.b.m, g.a.m, g.b.score, g.a.score);
  }
  return { ids, get: (a, b) => rec.get(`${a}|${b}`) ?? null };
}

function pairGames(ctx, a, b) {
  return games(ctx)
    .filter((g) => (g.a.m === a && g.b.m === b) || (g.a.m === b && g.b.m === a))
    .reverse();
}

function records(ctx, top = 5) {
  const gs = games(ctx);

  const singles = gs.flatMap((g) => [
    { year: g.year, week: g.week, m: g.a.m, team: g.a.team, score: g.a.score, opp: g.b.team },
    { year: g.year, week: g.week, m: g.b.m, team: g.b.team, score: g.b.score, opp: g.a.team },
  ]);
  const highScores = [...singles].sort((x, y) => y.score - x.score).slice(0, top);
  const lowScores = singles.filter((s) => s.score > 0).sort((x, y) => x.score - y.score).slice(0, top);

  const margins = gs.map((g) => {
    const [win, lose] = g.a.score >= g.b.score ? [g.a, g.b] : [g.b, g.a];
    return { year: g.year, week: g.week, winner: win, loser: lose, margin: win.score - lose.score };
  });
  const biggestMargins = [...margins].sort((x, y) => y.margin - x.margin).slice(0, top);
  const closestGames = margins.filter((g) => g.margin > 0).sort((x, y) => x.margin - y.margin).slice(0, top);

  const seasonPF = ctx.seasons
    .flatMap((s) => s.teams.map((t) => ({ year: s.year, team: t.name, manager: ctx.name(t.managerId), pf: t.pf ?? 0 })))
    .sort((x, y) => y.pf - x.pf).slice(0, top);

  const perManager = new Map();
  for (const g of gs) {
    for (const [me, opp] of [[g.a, g.b], [g.b, g.a]]) {
      if (!me.m) continue;
      const result = me.score > opp.score ? "W" : me.score < opp.score ? "L" : "T";
      const list = perManager.get(me.m) ?? [];
      list.push({ result, year: g.year, week: g.week });
      perManager.set(me.m, list);
    }
  }
  const streaks = (kind) => {
    const out = [];
    for (const [m, list] of perManager) {
      let run = 0, best = 0, end = -1;
      list.forEach((x, i) => {
        if (x.result === kind) { run++; if (run > best) { best = run; end = i; } } else run = 0;
      });
      if (best > 0) out.push({ manager: ctx.name(m), length: best, from: list[end - best + 1], to: list[end] });
    }
    return out.sort((x, y) => y.length - x.length).slice(0, top);
  };

  return { highScores, lowScores, biggestMargins, closestGames, seasonPF, winStreaks: streaks("W"), loseStreaks: streaks("L") };
}

// Turns stats into HTML. This is the file to edit when you want to change how a page is laid out.

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (n) => Number(n ?? 0).toFixed(1);
const pct3 = (p) => p.toFixed(3).replace(/^0/, "");
const rec = (w, l, t) => (t ? `${w}-${l}-${t}` : `${w}-${l}`);
const when = (year, week) => `${year} wk ${week}`;
const trophy = "\u{1F3C6}";

const table = (heads, rows, cls = "") => `
  <div class="table-wrap"><table class="${cls}">
    <thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;

const section = (title, body, note = "") =>
  `<section class="card"><h2>${esc(title)}</h2>${note ? `<p class="note">${esc(note)}</p>` : ""}${body}</section>`;

function championsView(ctx) {
  const rows = champions(ctx).map((c) => [
    esc(c.year),
    c.champion ? `${trophy} <strong>${esc(c.champion.manager)}</strong>` : `<span class="muted">not decided</span>`,
    c.champion ? esc(c.champion.team) : "",
    c.runnerUp ? `${esc(c.runnerUp.manager)} <span class="muted">(${esc(c.runnerUp.team)})</span>` : `<span class="muted">-</span>`,
  ]);
  return section("Champions", table(["Year", "Champion", "Team", "Runner-up"], rows));
}

function standingsView(ctx, year) {
  const years = seasonYears(ctx);
  const y = years.includes(year) ? year : years[0];
  const select = `<label class="inline">Season <select id="year-select">${years
    .map((v) => `<option value="${v}"${v === y ? " selected" : ""}>${v}</option>`).join("")}</select></label>`;
  const rows = standings(ctx, y).map((t) => [
    esc(t.rank),
    `${t.champion ? trophy + " " : ""}<strong>${esc(t.name)}</strong>`,
    esc(t.manager),
    rec(t.wins, t.losses, t.ties),
    f1(t.pf), f1(t.pa),
    t.finalRank ? esc(t.finalRank) : `<span class="muted">-</span>`,
  ]);
  return section(`${y} standings`, select + table(["#", "Team", "Manager", "Record", "PF", "PA", "Final"], rows),
    "Order is regular-season record, then points for. Final is the playoff finish where the platform reports it.");
}

function allTimeView(ctx) {
  const hasGames = ctx.seasons.some((s) => s.matchups.length);
  const rows = allTime(ctx).map((r) => [
    `<strong>${esc(r.name)}</strong>`,
    esc(r.seasons),
    rec(r.w, r.l, r.t),
    pct3(r.pct),
    f1(r.pf),
    r.titles.length ? `${trophy} ${r.titles.length}` : "0",
    esc(r.runnerUps.length),
    ...(hasGames ? [esc(r.playoffs)] : []),
  ]);
  const heads = ["Manager", "Seasons", "Record", "Win %", "Points for", "Titles", "Runner-ups", ...(hasGames ? ["Playoffs"] : [])];
  return section("All-time leaderboard", table(heads, rows), "Regular-season records only. Sorted by titles, then win %.");
}

function h2hView(ctx, a, b) {
  const h = headToHead(ctx);
  if (!h.ids.length) return section("Head-to-head", `<p class="muted">Head-to-head needs weekly scores, which haven’t been added yet.</p>`);
  const short = (id) => esc(ctx.name(id));
  const matrix = table(
    ["", ...h.ids.map(short)],
    h.ids.map((row) => [
      `<strong>${short(row)}</strong>`,
      ...h.ids.map((col) => {
        if (row === col) return `<span class="muted">-</span>`;
        const r = h.get(row, col);
        if (!r) return `<span class="muted">-</span>`;
        const cls = r.w > r.l ? "win" : r.w < r.l ? "loss" : "even";
        return `<span class="pill ${cls}">${rec(r.w, r.l, r.t)}</span>`;
      }),
    ]),
    "matrix"
  );

  const A = h.ids.includes(a) ? a : h.ids[0];
  const B = h.ids.includes(b) && b !== A ? b : h.ids.find((x) => x !== A);
  const opt = (sel) => h.ids.map((id) => `<option value="${esc(id)}"${id === sel ? " selected" : ""}>${short(id)}</option>`).join("");
  let detail = "";
  if (A && B) {
    const r = h.get(A, B);
    const list = pairGames(ctx, A, B).slice(0, 15).map((g) => {
      const mine = g.a.m === A ? g.a : g.b;
      const theirs = g.a.m === A ? g.b : g.a;
      return [when(g.year, g.week) + (g.type === "playoff" ? " (playoffs)" : ""), `${f1(mine.score)} - ${f1(theirs.score)}`,
        mine.score > theirs.score ? short(A) : mine.score < theirs.score ? short(B) : "Tie"];
    });
    detail = `
      <div class="pickers">
        <label class="inline"><select id="h2h-a">${opt(A)}</select></label>
        <span>vs</span>
        <label class="inline"><select id="h2h-b">${opt(B)}</select></label>
      </div>
      ${r ? `<p class="big">${short(A)} leads ${rec(r.w, r.l, r.t)} <span class="muted">(${f1(r.pf)} - ${f1(r.pa)} total points)</span></p>
             ${table(["When", "Score", "Winner"], list)}` : `<p class="muted">These two have never played each other.</p>`}`;
  }
  return section("Head-to-head", matrix, "Read across: the row manager’s record against the column manager. Regular season and playoffs.") +
    section("Matchup detail", detail);
}

function recordsView(ctx) {
  const r = records(ctx);
  const hasGames = ctx.seasons.some((s) => s.matchups.length);
  const gameRow = (s) => [`<strong>${f1(s.score)}</strong>`, esc(s.team), `<span class="muted">vs ${esc(s.opp)}</span>`, when(s.year, s.week)];
  const marginRow = (g) => [`<strong>${f1(g.margin)}</strong>`, esc(g.winner.team), `<span class="muted">over ${esc(g.loser.team)}</span>`, when(g.year, g.week)];
  const streakRow = (s) => [`<strong>${s.length}</strong>`, esc(s.manager), `${when(s.from.year, s.from.week)} to ${when(s.to.year, s.to.week)}`];
  const H = ["", "Team", "", "When"];
  const pfSection = section("Most points in a season", table(["PF", "Team", "Manager", "Year"], r.seasonPF.map((s) => [`<strong>${f1(s.pf)}</strong>`, esc(s.team), esc(s.manager), esc(s.year)])));
  if (!hasGames) return `<div class="grid">${pfSection}</div><p class="muted">Single-game records and streaks need weekly scores, which haven’t been added yet.</p>`;
  return `<div class="grid">
    ${section("Highest score", table(H, r.highScores.map(gameRow)))}
    ${section("Lowest score", table(H, r.lowScores.map(gameRow)))}
    ${section("Biggest blowouts", table(H, r.biggestMargins.map(marginRow)))}
    ${section("Closest games", table(H, r.closestGames.map(marginRow)))}
    ${section("Most points in a season", table(["PF", "Team", "Manager", "Year"], r.seasonPF.map((s) => [`<strong>${f1(s.pf)}</strong>`, esc(s.team), esc(s.manager), esc(s.year)])))}
    ${section("Longest win streaks", table(["Games", "Manager", "Span"], r.winStreaks.map(streakRow)), "Streaks carry across seasons.")}
    ${section("Longest losing streaks", table(["Games", "Manager", "Span"], r.loseStreaks.map(streakRow)))}
  </div>`;
}

function managersView(ctx) {
  const hasGames = ctx.seasons.some((s) => s.matchups.length);
  const cards = allTime(ctx).map((r) => `
    <article class="card manager">
      <h3>${esc(r.name)}</h3>
      <p class="trophies">${r.titles.length ? r.titles.map((y) => `${trophy} ${y}`).join("<br>") : `<span class="muted">No titles yet</span>`}</p>
      <dl>
        <dt>Record</dt><dd>${rec(r.w, r.l, r.t)} (${pct3(r.pct)})</dd>
        <dt>Seasons</dt><dd>${esc(r.seasons)}</dd>
        ${hasGames ? `<dt>Playoff trips</dt><dd>${esc(r.playoffs)}</dd>` : ""}
        <dt>Runner-up</dt><dd>${r.runnerUps.length ? esc(r.runnerUps.join(", ")) : "-"}</dd>
      </dl>
    </article>`).join("");
  return `<div class="cards">${cards}</div>`;
}

const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
function matchTeam(name, names) {
  const n = norm(name);
  if (!n) return null;
  const exact = names.find((x) => norm(x) === n);
  if (exact) return exact;
  if (n.length >= 4) {
    const part = names.filter((x) => { const k = norm(x); return k && (k.includes(n) || n.includes(k)); });
    if (part.length === 1) return part[0];
  }
  return null;
}

// Saved season docs (+ saved weekly games) -> the shape the stats and views expect.
function toHistory(docs, gdocs) {
  const managers = new Map();
  let unmatched = 0;
  const seasons = [...docs].sort((a, b) => a.year - b.year).map((d) => {
    const teams = (d.teams || []).map((t, i) => {
      const mname = String(t.manager || "").trim();
      const id = mname ? slug(mname) || mname : null;
      if (id && !managers.has(id)) managers.set(id, { id, name: mname });
      return {
        teamId: i + 1, name: t.name || `Team ${i + 1}`, ownerNames: [mname], managerId: id,
        wins: +t.wins || 0, losses: +t.losses || 0, ties: +t.ties || 0, pf: +t.pf || 0, pa: +t.pa || 0,
        finalRank: i === d.champIdx ? 1 : i === d.runnerIdx ? 2 : null, playoffSeed: null,
      };
    });
    const byName = new Map(teams.map((t) => [norm(t.name), t]));
    const matchups = [];
    for (const g of (gdocs.get(d.year)?.games || [])) {
      const h = byName.get(norm(g.home)), a = byName.get(norm(g.away));
      if (!h || !a || h === a) { unmatched++; continue; }
      matchups.push({ week: +g.week, type: g.type || "regular",
        home: { teamId: h.teamId, score: +g.homeScore, managerId: h.managerId },
        away: { teamId: a.teamId, score: +g.awayScore, managerId: a.managerId } });
    }
    const champ = d.champIdx >= 0 && teams[d.champIdx] ? d.champIdx + 1 : null;
    return { year: d.year, platform: "manual", leagueName: d.leagueName || null, status: "complete",
      championTeamId: champ, championManagerId: champ ? teams[d.champIdx].managerId : null, teams, matchups };
  });
  return { sample: false, managers: [...managers.values()], seasons, unmatched };
}

function refresh() {
  ctx = prepare(rows.length ? toHistory(rows, gameDocs) : SAMPLE);
  const years = seasonYears(ctx);
  if (!years.includes(params.year)) params.year = years[0];
}

function unlockCard(title) {
  return `${status ? `<div class="banner">${esc(status)}</div>` : ""}` + section(title, `<p class="muted">Enter the editor PIN to add or change data.</p>
    <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" class="w-year"><button class="btn primary" data-act="unlock">Unlock</button></div>`);
}

function saveErr(e) {
  if (e && e.code === "quota_exceeded") return "The database is full.";
  if (e && e.code === "permission-denied") return "Firebase blocked the save. Check your Firestore rules.";
  return "Couldn’t save that. If you only have view access, ask the owner to add the data.";
}

async function exportAll() {
  const payload = JSON.stringify({ app: "league-history", version: 1, exportedAt: new Date().toISOString(),
    seasons: [...rows].sort((a, b) => a.year - b.year), games: [...gameDocs.values()] }, null, 2);
  const name = `league-history-${new Date().toISOString().slice(0, 10)}.json`;
  try {
    const dl = await use("downloads");
    if (dl) await dl.save({ filename: name, data: payload });
    else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    say("Backup ready.");
  } catch (e) {
    say(e && e.code === "declined" ? "Download cancelled." : "Couldn’t create the download.");
  }
}

async function restoreFrom(file) {
  try {
    const data = JSON.parse(await file.text());
    const seasons = Array.isArray(data.seasons) ? data.seasons : [];
    const games = Array.isArray(data.games) ? data.games : [];
    if (!seasons.length && !games.length) return say("That file doesn’t look like a league backup.");
    busy = true; render();
    for (const s of seasons) if (Number.isInteger(s.year)) await db.collection("seasons").doc(String(s.year)).set(s);
    for (const g of games) if (Number.isInteger(g.year)) await db.collection("games").doc(String(g.year)).set(g);
    busy = false;
    say(`Restored ${seasons.length} season${seasons.length === 1 ? "" : "s"} and ${games.length} set${games.length === 1 ? "" : "s"} of scores.`);
  } catch (e) {
    busy = false;
    say(e && e.code ? saveErr(e) : "Couldn’t read that file.");
  }
}

function sortGames(list) { return [...list].sort((a, b) => (Number(a.week) || 0) - (Number(b.week) || 0)); }

function loadGames(year) {
  const saved = gameDocs.get(year)?.games || [];
  const t = (v) => (v === undefined || v === null ? "" : String(v));
  gdraft = { year: String(year), text: "", weekHint: "",
    games: sortGames(saved.map((g) => ({ week: t(g.week), type: g.type || "regular", home: t(g.home), homeScore: t(g.homeScore), away: t(g.away), awayScore: t(g.awayScore) }))) };
  gFiles = [];
}

/* ---------- actions ---------- */
function say(msg) { status = msg; render(); }

function applyParsed(r) {
  const teams = Array.isArray(r?.teams) ? r.teams : [];
  if (!teams.length) return say("I couldn’t find any teams in that. Try pasting more of the page.");
  const s = (v) => (v === null || v === undefined ? "" : String(v));
  draft.teams = teams.map((t) => ({ name: s(t.name), manager: s(t.manager), wins: s(t.wins), losses: s(t.losses), ties: s(t.ties), pf: s(t.pf), pa: s(t.pa) }));
  if (r.year) draft.year = s(r.year);
  draft.champIdx = teams.findIndex((t) => r.champion && t.name === r.champion);
  draft.runnerIdx = teams.findIndex((t) => r.runnerUp && t.name === r.runnerUp);
  draft.text = "";
  pendingFiles = [];
  say("Filled in. Check the numbers, add any missing manager names, then Save season.");
}

async function fill() {
  const text = draft.text.trim();
  if (!text && !pendingFiles.length) return say("Paste some text or choose a screenshot first.");
  busy = true; status = ""; render();
  const prompt = `Extract final fantasy football league standings from the text and/or screenshots provided. Reply with only a JSON object shaped like {"year": 2019, "teams": [{"name": "Team name", "manager": "Owner name or empty string", "wins": 0, "losses": 0, "ties": 0, "pf": 0, "pa": 0}], "champion": "team name or null", "runnerUp": "team name or null"}. One entry per team, in the order shown. Use 0 for a missing number and an empty string if the manager isn’t shown. Never invent data.${text ? "\n\nText:\n" + text : ""}`;
  const opts = { modelTier: "default" };
  if (pendingFiles.length && imageLimit) opts.images = pendingFiles.slice(0, imageLimit.maxCount || 4);
  try {
    const result = await sampleNs.json(prompt, opts);
    busy = false;
    applyParsed(result);
  } catch (e) {
    busy = false;
    say(e && e.code === "not_granted" ? "Quick fill needs your permission to ask Claude. You can still type the numbers in."
      : "That didn’t work this time. You can try again or type the numbers in.");
  }
}

async function save() {
  const year = Number(draft.year);
  if (!Number.isInteger(year) || year < 1990 || year > 2100) return say("Enter the season year, like 2019.");
  const kept = [];
  draft.teams.forEach((t, i) => { if (t.name.trim() || t.manager.trim()) kept.push({ t, i }); });
  if (kept.length < 2) return say("Add at least two teams.");
  if (kept.some(({ t }) => !t.name.trim())) return say("Every row with a manager needs a team name too.");
  if (kept.some(({ t }) => !t.manager.trim())) return say("Every team needs a manager name so records can combine across seasons.");
  const num = (v) => { const n = parseFloat(String(v).replace(/,/g, "")); return Number.isFinite(n) ? n : 0; };
  const doc = {
    year, platform: "manual", savedAt: new Date().toISOString(),
    teams: kept.map(({ t }) => ({ name: t.name.trim(), manager: t.manager.trim(), wins: num(t.wins), losses: num(t.losses), ties: num(t.ties), pf: num(t.pf), pa: num(t.pa) })),
    champIdx: kept.findIndex(({ i }) => i === draft.champIdx),
    runnerIdx: kept.findIndex(({ i }) => i === draft.runnerIdx),
  };
  busy = true; render();
  try {
    await db.collection("seasons").doc(String(year)).set(doc);
    draft = newDraft();
    busy = false;
    say(`Saved ${year}.`);
  } catch (e) {
    busy = false;
    if (e && e.code === "invalid_argument") canWrite = false;
    say(saveErr(e));
  }
}

async function remove(year) {
  if (confirmDel !== year) { confirmDel = year; return render(); }
  confirmDel = null;
  try { await db.collection("seasons").doc(String(year)).delete(); await db.collection("games").doc(String(year)).delete(); say(`Deleted ${year}.`); }
  catch { say("Couldn’t delete that season."); }
}

async function fillGames() {
  const year = Number(gdraft.year);
  const names = (rows.find((r) => r.year === year)?.teams || []).map((t) => t.name);
  const text = gdraft.text.trim();
  if (!text && !gFiles.length) return say("Paste some text or choose a screenshot first.");
  busy = true; status = ""; render();
  const hint = String(gdraft.weekHint).trim();
  const prompt = `Extract fantasy football weekly matchup scores from the text and/or screenshots provided. Reply with only a JSON array like [{"week": 1, "type": "regular", "home": "Team name", "homeScore": 101.5, "away": "Team name", "awayScore": 98.2}]. type is "regular", "playoff" (championship bracket) or "consolation". ${hint ? `If a week isn’t shown, use week ${hint}.` : "Use the week shown."} Use the closest matching name from this list of teams: ${names.join(" | ")}. Never invent scores.${text ? "\n\nText:\n" + text : ""}`;
  const opts = { modelTier: "default" };
  if (gFiles.length && imageLimit) opts.images = gFiles.slice(0, imageLimit.maxCount || 4);
  try {
    const res = await sampleNs.json(prompt, opts);
    busy = false;
    applyGames(res, names);
  } catch (e) {
    busy = false;
    say(e && e.code === "not_granted" ? "Quick fill needs your permission to ask Claude. You can still type the scores in."
      : "That didn’t work this time. You can try again or type the scores in.");
  }
}

function applyGames(res, names) {
  const list = Array.isArray(res) ? res : Array.isArray(res?.games) ? res.games : [];
  if (!list.length) return say("I couldn’t find any games in that. Try including the week heading.");
  const s = (v) => (v === null || v === undefined ? "" : String(v));
  const types = ["regular", "playoff", "consolation"];
  const parsed = list.map((g) => ({
    week: s(g.week ?? gdraft.weekHint), type: types.includes(g.type) ? g.type : "regular",
    home: matchTeam(g.home, names) || s(g.home), homeScore: s(g.homeScore),
    away: matchTeam(g.away, names) || s(g.away), awayScore: s(g.awayScore),
  }));
  const weeks = new Set(parsed.map((g) => Number(g.week)));
  gdraft.games = sortGames(gdraft.games.filter((g) => !weeks.has(Number(g.week))).concat(parsed));
  gdraft.text = ""; gFiles = [];
  say(`Added ${parsed.length} games. Check them, fix any red team names, then Save scores.`);
}

async function saveGames() {
  const year = Number(gdraft.year);
  const season = rows.find((r) => r.year === year);
  if (!season) return say("Pick a season first.");
  const names = (season.teams || []).map((t) => t.name);
  const kept = gdraft.games.filter((g) => [g.home, g.away, g.homeScore, g.awayScore].some((v) => String(v).trim()));
  if (!kept.length) return say("There are no games to save.");
  const out = [], bad = [];
  for (const g of kept) {
    const home = matchTeam(g.home, names), away = matchTeam(g.away, names);
    if (!home || !away) { bad.push((!home ? g.home : g.away) || "(blank)"); continue; }
    const week = Number(g.week), hs = parseFloat(g.homeScore), as2 = parseFloat(g.awayScore);
    if (home === away) return say(`Week ${g.week}: a team can’t play itself (${home}).`);
    if (!Number.isInteger(week) || week < 1 || week > 25) return say(`“${g.week}” isn’t a valid week number.`);
    if (!Number.isFinite(hs) || !Number.isFinite(as2)) return say(`Week ${week}: ${home} vs ${away} is missing a score.`);
    out.push({ week, type: ["regular", "playoff", "consolation"].includes(g.type) ? g.type : "regular", home, homeScore: hs, away, awayScore: as2 });
  }
  if (bad.length) return say(`These names don’t match a ${year} team: ${[...new Set(bad)].join(", ")}. Fix the red rows.`);
  busy = true; render();
  try {
    await db.collection("games").doc(String(year)).set({ year, games: out, savedAt: new Date().toISOString() });
    busy = false;
    loadGames(year);
    say(`Saved ${out.length} games for ${year}.`);
  } catch (e) {
    busy = false;
    if (e && e.code === "invalid_argument") canWrite = false;
    say(saveErr(e));
  }
}

async function removeGames(year) {
  if (confirmDelGames !== year) { confirmDelGames = year; return render(); }
  confirmDelGames = null;
  try { await db.collection("games").doc(String(year)).delete(); loadGames(year); say(`Deleted all ${year} scores.`); }
  catch { say("Couldn’t delete those scores."); }
}

document.addEventListener("input", (e) => {
  const gk = e.target.dataset && e.target.dataset.g;
  if (gk) { gdraft.games[Number(e.target.dataset.i)][gk] = e.target.value; return; }
  const gf = e.target.dataset && e.target.dataset.gf;
  if (gf) { gdraft[gf] = e.target.value; return; }
  const f = e.target.dataset && e.target.dataset.f;
  if (!f) return;
  if (e.target.dataset.i !== undefined) draft.teams[Number(e.target.dataset.i)][f] = e.target.value;
  else draft[f] = e.target.value;
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "year-select") { params.year = Number(t.value); return render(); }
  if (t.id === "h2h-a") { params.a = t.value; return render(); }
  if (t.id === "h2h-b") { params.b = t.value; return render(); }
  if (t.id === "restore") { const f = t.files[0]; if (f) restoreFrom(f); t.value = ""; return; }
  if (t.id === "g-year") { loadGames(Number(t.value)); return render(); }
  if (t.id === "gshots") { gFiles = [...t.files]; return render(); }
  if (t.id === "shots") { pendingFiles = [...t.files]; return render(); }
  if (t.dataset && t.dataset.act === "champ") draft.champIdx = Number(t.dataset.i);
  if (t.dataset && t.dataset.act === "runner") draft.runnerIdx = Number(t.dataset.i);
});

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "addrow") { draft.teams.push(blankTeam()); render(); }
  else if (act === "delrow") {
    const i = Number(b.dataset.i);
    draft.teams.splice(i, 1);
    if (draft.champIdx === i) draft.champIdx = -1; else if (draft.champIdx > i) draft.champIdx--;
    if (draft.runnerIdx === i) draft.runnerIdx = -1; else if (draft.runnerIdx > i) draft.runnerIdx--;
    render();
  }
  else if (act === "clear") { draft = newDraft(); pendingFiles = []; status = ""; render(); }
  else if (act === "gaddrow") {
    const last = gdraft.games[gdraft.games.length - 1];
    gdraft.games.push({ week: last ? last.week : "1", type: last ? last.type : "regular", home: "", homeScore: "", away: "", awayScore: "" });
    render();
  }
  else if (act === "gdelrow") { gdraft.games.splice(Number(b.dataset.i), 1); render(); }
  else if (act === "gfill") fillGames();
  else if (act === "gsave") saveGames();
  else if (act === "gdelall") removeGames(Number(gdraft.year));
  else if (act === "export") exportAll();
  else if (act === "unlock") {
    const pin = document.querySelector("#pin");
    if (pin && pin.value === EDIT_PIN) { unlocked = true; try { localStorage.setItem("fh-unlocked", EDIT_PIN); } catch {} say(""); }
    else say("That PIN isn’t right.");
  }
  else if (act === "save") save();
  else if (act === "fill") fill();
  else if (act === "del") remove(Number(b.dataset.year));
  else if (act === "edit") {
    const d = rows.find((r) => r.year === Number(b.dataset.year));
    if (!d) return;
    const s = (v) => (v === 0 ? "0" : String(v ?? ""));
    draft = { year: s(d.year), text: "", champIdx: d.champIdx ?? -1, runnerIdx: d.runnerIdx ?? -1,
      teams: (d.teams || []).map((t) => ({ name: t.name, manager: t.manager, wins: s(t.wins), losses: s(t.losses), ties: s(t.ties), pf: s(t.pf), pa: s(t.pa) })) };
    status = `Editing ${d.year}. Save season to overwrite it.`;
    render();
    window.scrollTo({ top: 0 });
  }
});
window.addEventListener("hashchange", () => { status = ""; confirmDel = null; confirmDelGames = null; render(); });

/* ---------- start ---------- */
refresh();
render();

// Subscribes to the saved seasons and scores. Called once by the boot code for each build.
function startData() {
  const onErr = (e) => {
    if (e && e.code === "permission-denied") storageNote = "Firebase blocked access. Check your Firestore rules.";
    render();
  };
  db.collection("seasons").onSnapshot(
    (snap) => { rows = snap.docs.map((d) => d.data()).filter((d) => d && Number.isInteger(d.year)); refresh(); render(); },
    onErr
  );
  db.collection("games").onSnapshot(
    (snap) => {
      gameDocs = new Map(snap.docs.map((d) => d.data()).filter((d) => d && Number.isInteger(d.year)).map((d) => [d.year, d]));
      refresh(); render();
    },
    onErr
  );
}


// Boot for the GitHub Pages version: data lives in Firebase (or on this device if Firebase isn't set up).
function localDb() {
  const mem = {}, subs = {};
  const load = (c) => { try { return JSON.parse(localStorage.getItem("fh:" + c) || "{}"); } catch { return mem[c] || {}; } };
  const save = (c, obj) => { mem[c] = obj; try { localStorage.setItem("fh:" + c, JSON.stringify(obj)); } catch {} };
  const emit = (c) => (subs[c] || []).forEach((f) => f({ docs: Object.values(load(c)).map((d) => ({ data: () => d })) }));
  return { collection: (c) => ({
    onSnapshot: (next) => { (subs[c] = subs[c] || []).push(next); setTimeout(() => emit(c), 0); return () => {}; },
    doc: (id) => ({
      set: async (d) => { const o = load(c); o[id] = JSON.parse(JSON.stringify(d)); save(c, o); emit(c); },
      delete: async () => { const o = load(c); delete o[id]; save(c, o); emit(c); },
    }),
  }) };
}

(async () => {
  const cfg = CONFIG.firebase;
  if (cfg && cfg.apiKey) {
    try {
      const V = "10.12.2";
      const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
      const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
      const fb = fs.getFirestore(appMod.initializeApp(cfg, "league-history"));
      // Stored in collections fhSeasons and fhGames so they never mix with other apps in the same project.
      db = { collection: (name) => {
        const col = "fh" + name[0].toUpperCase() + name.slice(1);
        return {
          onSnapshot: (next, err) => fs.onSnapshot(fs.collection(fb, col), (snap) => next({ docs: snap.docs.map((d) => ({ data: () => d.data() })) }), err),
          doc: (id) => ({ set: (data) => fs.setDoc(fs.doc(fb, col, id), data), delete: () => fs.deleteDoc(fs.doc(fb, col, id)) }),
        };
      } };
    } catch (e) {
      storageNote = "Couldn’t connect to Firebase, so data is saving on this device only.";
    }
  } else {
    storageNote = "No Firebase settings yet, so data is saving on this device only. Add them at the top of this file to share it with your league.";
  }
  if (!db) db = localDb();
  startData();
  render();
})();

</script>
